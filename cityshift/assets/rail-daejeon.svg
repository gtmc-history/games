<text x="24" y="36" font-size="18" font-weight="800" fill="#8e2f2b">수업용 노선 관계도 · 축척 없음</text>
<text x="24" y="372" font-size="15" fill="#6f665c">노선 관계는 대전광역시 연혁·우리역사넷 자료를 바탕으로 단순화</text>
