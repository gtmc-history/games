<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">호남선 도시 관계도</title><desc id="desc">이리, 광주, 나주, 영산포와 호남선의 관계를 단순화한 수업용 노선도. 축척 없음.</desc>
<rect width="760" height="430" fill="#f3efe5"/>
<path d="M350 38 C345 105 360 142 382 192 C402 238 403 286 391 342 C386 370 382 394 382 416" fill="none" stroke="#4e5860" stroke-width="9" stroke-linecap="round"/>
<path d="M352 62 C265 67 206 80 148 108" fill="none" stroke="#7e878d" stroke-width="5" stroke-linecap="round"/>
<g fill="#fff" stroke="#315e63" stroke-width="5"><circle cx="353" cy="70" r="14"/><circle cx="392" cy="248" r="14"/><circle cx="392" cy="329" r="14"/><circle cx="386" cy="367" r="12"/></g>
<g font-family="system-ui, Noto Sans KR" fill="#20242b">
<text x="379" y="65" font-size="26" font-weight="800">이리</text>
<text x="419" y="244" font-size="26" font-weight="800">광주</text>
<text x="419" y="325" font-size="26" font-weight="800">나주</text>
<text x="414" y="385" font-size="24" font-weight="800">영산포</text>
<text x="433" y="145" font-size="20" fill="#59636a">호남선</text>
<text x="126" y="94" font-size="17" fill="#6d767b">군산 방향</text>
<text x="24" y="36" font-size="18" font-weight="800" fill="#8e2f2b">수업용 노선 관계도 · 축척 없음</text>
<text x="24" y="410" font-size="15" fill="#6f665c">철도·도시 관계 확인용. 도시 성장의 인과를 지도 자체가 뜻하지 않음.</text>
</g>
</svg>
