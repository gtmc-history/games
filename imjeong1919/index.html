<style>
  :root{
    --bg:#f0ece4; --surface:#e8e0d4; --primary:#003087; --accent:#cd2e3a;
    --text:#1a1a1a; --sepia:#8b7355; --sepia-light:#c9b89a; --paper:#f7f2e8;
    --font-display:'Black Han Sans',sans-serif;
    --font-body:'Noto Sans KR',sans-serif;
    --font-doc:'Gowun Batang','Noto Serif KR',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5;
    background-image:radial-gradient(rgba(139,115,85,.08) 1px,transparent 1px);background-size:14px 14px}
  .frame{max-width:960px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px 8px}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:10px 0 6px;border-bottom:1px solid var(--sepia-light)}
  header h1{font-family:var(--font-display);font-size:22px;color:var(--primary);letter-spacing:.5px}
  header .step{font-size:14px;color:var(--sepia)} header .step b{color:var(--text)}

  .record{display:flex;gap:6px;align-items:center;padding:6px 0;font-size:13px;color:var(--sepia);overflow:hidden;white-space:nowrap}
  .record .tag{font-family:var(--font-doc);font-weight:700;border:1px solid var(--sepia-light);padding:1px 6px;margin-right:4px}
  .record .ev{padding:1px 6px;background:var(--surface);opacity:.35} .record .ev.done{opacity:1} .record .ev.now{background:var(--sepia);color:#fff;opacity:1}
  .record .arrow{opacity:.5}
  .mine{display:flex;gap:6px;align-items:center;padding:0 0 6px;font-size:13px;color:var(--primary);overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--sepia-light);scrollbar-width:none} .mine::-webkit-scrollbar{display:none}
  .mine .tag{font-weight:700;border:1px solid var(--primary);padding:1px 6px;margin-right:4px}
  .mine .ev{padding:1px 6px;background:rgba(0,48,135,.06)} .mine .ev.now{background:var(--primary);color:#fff}
  .confirm{display:none;align-self:flex-start;margin:2px 0 8px 14px} .confirm.show{display:inline-block}
  .stampq{font-size:15px;font-weight:500;margin:8px 0 4px}

  .scene{flex:1;display:flex;flex-direction:column;min-height:0;animation:scene-in .4s ease forwards}
  @keyframes scene-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .year{font-family:var(--font-display);font-size:34px;color:var(--sepia);line-height:1;margin:10px 0 2px}
  .situ{font-size:16px;margin:4px 0 6px;max-width:760px}
  .role{font-size:14px;padding:4px 0 6px;color:var(--text)} .role b{font-family:var(--font-doc);color:var(--primary)}
  .q{font-size:17px;font-weight:500;margin:6px 0}

  .choices{display:flex;flex-direction:column;gap:8px;margin:6px 0}
  .choice{display:flex;align-items:flex-start;gap:10px;min-height:48px;padding:10px 12px;border:1px solid var(--sepia-light);border-left:3px solid transparent;
    background:var(--surface);font-size:17px;text-align:left;cursor:pointer;font-family:var(--font-body);border-radius:4px;
    transition:border-color .2s,background .2s,transform .15s}
  .choice:hover{border-left-color:var(--primary);background:#fff;transform:translateX(4px)}
  .choice.on{border-left-color:var(--primary);background:#fff;box-shadow:inset 0 0 0 1px var(--primary)}
  .choice.off{opacity:.45;pointer-events:none}
  .choice .k{font-family:var(--font-display);color:var(--sepia);min-width:22px}
  .cond{display:none;margin:4px 0 8px 14px;padding:8px 12px;border-left:3px solid var(--sepia);background:var(--paper);font-size:15px}
  .cond.show{display:block;animation:scene-in .3s ease}
  .cond b{color:var(--sepia);font-weight:700;margin-right:6px}

  .cards{display:grid;gap:8px;margin:6px 0}

  .card .layer{font-size:11px;letter-spacing:.5px;color:var(--sepia)} .card p{font-size:15px;line-height:1.45} .card .src{font-size:11px;color:var(--sepia);margin-top:auto}

  .card.event .fixed{font-size:11px;color:var(--accent);letter-spacing:.5px}
  .card.flip{cursor:pointer} .card.flip .back{display:none} .card.flip.open .front{display:none} .card.flip.open .back{display:block}
  .card.hist{background:var(--surface);border-left:3px solid var(--sepia)}

  .cb{border-left:3px solid var(--primary);background:rgba(0,48,135,.06);padding:5px 10px;font-size:14px;line-height:1.4;margin:3px 0}
  .cb .who{font-weight:700;color:var(--primary);margin-right:6px}

  .puz{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0;flex:1;min-height:0}
  .pool,.slots{display:flex;flex-direction:column;gap:6px}
  .pcard{min-height:48px;padding:8px 10px;background:var(--paper);border:1px solid var(--sepia-light);font-family:var(--font-doc);font-size:15px;cursor:pointer;border-radius:4px;transition:transform .15s}
  .pcard:hover{transform:translateX(4px)} .pcard.pick{box-shadow:inset 0 0 0 2px var(--primary)} .pcard.gone{display:none}
  .slot{min-height:48px;padding:8px 10px;border:1px dashed var(--sepia);background:var(--surface);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:4px}
  .slot .nm{font-weight:500;white-space:nowrap} .slot .got{font-size:13px;color:var(--primary);font-family:var(--font-doc);text-align:right}
  .slot.full{border-style:solid;border-color:var(--primary);background:#fff}
  @keyframes correct-pulse{0%{box-shadow:0 0 0 0 rgba(46,213,115,.6)}70%{box-shadow:0 0 0 12px rgba(46,213,115,0)}100%{box-shadow:0 0 0 0 rgba(46,213,115,0)}}
  .correct{animation:correct-pulse .6s ease}
  @keyframes wrong-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .wrong{animation:wrong-shake .4s ease}

  .grid6{display:grid;grid-template-columns:90px 1fr 1fr;gap:6px;flex:1;min-height:0}
  .ghead{font-size:12px;letter-spacing:.5px;color:var(--sepia);padding:0 6px 2px;border-bottom:1px solid var(--sepia-light)} .ghead.r{color:var(--primary);border-bottom-color:var(--primary)}
  .issue{display:flex;flex-direction:column;justify-content:center;padding:6px;border-right:2px solid var(--sepia-light)}
  .issue .name{font-family:var(--font-display);font-size:18px} .issue .s2{font-size:11px;color:var(--primary);border:1px solid var(--primary);padding:0 5px;margin-top:4px;align-self:flex-start}
  .decide{margin-top:6px;border-top:1px solid var(--sepia-light);padding-top:6px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{min-height:44px;padding:8px 14px;border:1px solid var(--sepia);background:var(--surface);font-size:16px;cursor:pointer;border-radius:4px;font-family:var(--font-body);transition:transform .15s,border-color .2s,background .2s}
  .chip:hover{transform:translateY(-2px)} .chip[disabled]{opacity:.4;pointer-events:none} .chip.on{border-color:var(--primary);background:#fff;box-shadow:inset 0 0 0 1px var(--primary)} .chip.on::before{content:"✓ ";color:var(--primary)}
  .verdict{display:flex;flex-direction:column;gap:6px;min-width:250px}
  .stage2{display:none;gap:6px} .stage2.show{display:flex}
  .stage2 input{flex:1;min-height:44px;border:1px solid var(--sepia-light);padding:0 10px;font-family:var(--font-body);font-size:15px;background:#fff}
  .hint{font-size:12px;color:var(--sepia)}

  .btn{min-height:48px;padding:0 18px;border:1px solid var(--primary);background:var(--surface);color:var(--primary);font-family:var(--font-body);font-size:17px;font-weight:500;cursor:pointer;border-radius:4px;transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)} .btn:active{transform:translateY(0) scale(.97)}
  .btn.on,.btn.primary{background:var(--primary);color:#fff} .btn.ghost{border-color:var(--sepia);color:var(--sepia)}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .nav{display:flex;justify-content:flex-end;gap:8px;padding:8px 0 4px;margin-top:auto;flex-wrap:wrap}

  .tt{border-bottom:1px dotted var(--sepia);cursor:help}
  #tt-bubble{position:absolute;top:-9999px;left:0;max-width:280px;background:#1a1a1a;color:#f0ece4;font-size:13px;line-height:1.4;padding:8px 10px;border-radius:4px;z-index:50;pointer-events:none;opacity:0;transition:opacity .15s}
  #tt-bubble.show{opacity:1}

  .result{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin:8px 0}
  .traj{background:#fff;border-left:3px solid var(--primary);padding:12px 14px} .traj p{margin:4px 0;font-size:15.5px}
  .traj h3,.hist2 h3{font-family:var(--font-display);font-size:18px;margin-bottom:6px} .traj h3{color:var(--primary)} .hist2 h3{color:var(--sepia)}
  .hist2{background:var(--paper);border-left:3px solid var(--sepia);padding:12px 14px;font-family:var(--font-doc)} .hist2 p{margin:4px 0;font-size:15px}
  .labels{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0} .lab{font-size:13px;border:1px solid var(--sepia);padding:2px 8px;color:var(--sepia)}
  .ask{margin:8px 0;padding:10px 12px;background:var(--surface);font-size:15px} .ask p{margin:3px 0}
  textarea{width:100%;min-height:52px;border:1px solid var(--sepia-light);padding:8px;font-family:var(--font-body);font-size:15px;background:#fff;resize:vertical}
  .stats{margin:6px 0;font-size:14px} .stats .row{display:flex;gap:6px;align-items:center;margin:2px 0} .stats .bar{height:8px;background:var(--primary);opacity:.6;display:inline-block}
  footer{text-align:center;font-size:12px;color:rgba(120,100,80,0.4);padding:12px 0 4px}
  .intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:720px;margin:0 auto;width:100%}
  .intro .big{font-family:var(--font-display);font-size:40px;color:var(--primary);line-height:1.15;white-space:pre-line}
  .intro .sub{font-family:var(--font-doc);font-size:18px;color:var(--sepia)}
  .intro .notice{font-size:13px;color:var(--sepia);border-left:2px solid var(--sepia-light);padding-left:8px}

  @media (max-width:820px){
    .cards.c4,.cards.c3{grid-template-columns:1fr 1fr} .puz,.result{grid-template-columns:1fr}
    .grid6{grid-template-columns:90px 1fr 1fr} .decide{grid-template-columns:1fr} .card p{font-size:14px}
    .record{font-size:12px} .intro .big{font-size:30px}
  }
</style>

  var items=[['1919',S.s1?S1SHORT[S.s1]:null],['1920',pname(S.s3p,S.s3o)||null],['1921',pname(S.s4p,S.s4o)||null],['1923',S.s5],['1925',S.s6v]];
  return items.map(function(it,i){ return it[0]+' '+(i===now?'판단 중':(it[1]||'?')); });
}
function pname(p, o){ return p ? p : (o ? '내부의 합의' : ''); }
function josa(w, a, b){ if(!w) return a; var c=w.charCodeAt(w.length-1); var has=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28)!==0:false; return has?a:b; }
function trajectory(S){
  var a = [];
  a.push('당신은 1919년 통합안으로 「' + S1NAME[S.s1] + '」을 지지했다.');
  var p3=pname(S.s3p,S.s3o); a.push('1920년에는 ' + p3 + josa(p3,'을','를') + ' 가장 중요하게 보았다.');
  var same = (S.s3p === S.s4p) && (S.s3o === S.s4o);
  var why = S.s4r ? '「' + S.s4r + '」을 보고 ' : '';
  a.push('1921년 위기 이후 ' + why + (same ? '그 판단을 유지했다.' : (function(){ var p4=pname(S.s4p,S.s4o); return p4 + josa(p4,'으로','로') + ' 바꾸었다.'; })()));
  a.push('1923년에는 ' + S.s5 + ' 입장에 섰다' + (S.s5r ? ' — 근거: ' + S.s5r : '') + '.');
  if (S.s6v === '유보') a.push('1925년에는 자료가 부족하다고 판단했다.');
  else a.push('1925년에는 탄핵에 ' + S.s6v + '했다 — 근거: ' + S.s6r.join(', ') + '.');
  return a;
}

/* ───────── DOM 헬퍼 — 템플릿 리터럴 안 태그 삽입 금지 → 노드 조립 ───────── */
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function rich(str){
  var frag=document.createDocumentFragment(), re=/\{\{([^}]+)\}\}/g, last=0, m;
  while((m=re.exec(str))){ if(m.index>last) frag.appendChild(document.createTextNode(str.slice(last,m.index))); frag.appendChild(tt(m[1])); last=re.lastIndex; }
  if(last<str.length) frag.appendChild(document.createTextNode(str.slice(last)));
  return frag;
}
function P(cls, str){ var p=el('p',cls||null); p.appendChild(rich(str)); return p; }
function tt(term){
  var s=el('span',null,term); var tip=TIP[term];
  if(!tip) return s;
  s.className='tt'; s.setAttribute('data-tip',tip);
  s.addEventListener('click',function(ev){ ev.stopPropagation(); showTip(s); });
  return s;
}
var bubble=document.getElementById('tt-bubble');
function showTip(s){
  bubble.textContent=s.getAttribute('data-tip'); bubble.style.top='-9999px'; bubble.classList.add('show');
  var r=s.getBoundingClientRect(), h=bubble.offsetHeight, w=bubble.offsetWidth;
  var top=window.scrollY+r.top-h-8; if(top<window.scrollY+4) top=window.scrollY+r.bottom+8;
  var left=Math.max(8,Math.min(window.scrollX+r.left, window.innerWidth-w-8));
  bubble.style.top=top+'px'; bubble.style.left=left+'px';
}
document.addEventListener('click',function(){ bubble.classList.remove('show'); bubble.style.top='-9999px'; });

/* 판단형 선택지 — ① 탭: 조건·한계 미리보기(자유 비교) ② 「지지한다」로 확정 ③ 확정 후 잠금 → 그 뒤에만 역사 공개. 정오 색상 없음 */
function choiceList(opts, onConfirm, confirmLabel){
  var wrap=el('div','choices'); var conds=[]; var cur=-1; var locked=false;
  var btn=el('button','btn primary confirm',confirmLabel||'이 안을 지지한다');
  opts.forEach(function(o,i){
    var b=el('button','choice'); b.appendChild(el('span','k',o.k)); b.appendChild(rich(o.t));
    var c=el('div','cond'); c.appendChild(el('b',null,'조건')); c.appendChild(rich(o.c)); c.appendChild(el('br')); c.appendChild(el('b',null,'한계')); c.appendChild(rich(o.l));
    b.addEventListener('click',function(){
      if(locked) return; cur=i;
      wrap.querySelectorAll('.choice').forEach(function(x,j){ x.classList.toggle('on',j===i); });
      conds.forEach(function(x,j){ x.classList.toggle('show',j===i); });
      btn.classList.add('show'); conds[i].appendChild(btn);
    });
    wrap.appendChild(b); wrap.appendChild(c); conds.push(c);
  });
  btn.addEventListener('click',function(){
    if(cur<0||locked) return; locked=true; btn.classList.remove('show');
    wrap.querySelectorAll('.choice').forEach(function(x,j){ x.classList.toggle('off',j!==cur); });
    onConfirm(opts[cur],cur);
  });
  return wrap;
}
/* 근거 도장 — 자료와 선택을 잇는 행동 (S4·S5) */
function stampRow(q, labels, onStamp){

  var done=false; labels.forEach(function(t){ var c=el('button','chip',t); c.addEventListener('click',function(){ if(done) return; done=true; c.classList.add('on'); chips.querySelectorAll('.chip').forEach(function(x){ if(x!==c) x.disabled=true; }); onStamp(t); }); chips.appendChild(c); });
  box.appendChild(chips); return box;
}
/* 퍼즐 — 카드 탭 → 슬롯 탭. 사실층이므로 정오 피드백 사용 */
function puzzle(cfg, onDone){
  var wrap=el('div','puz'); var pool=el('div','pool'), slots=el('div','slots'); var picked=null, correct=0;
  pool.appendChild(el('span','hint','① 왼쪽 카드를 누르고 → ② 오른쪽 자리를 누른다. 틀리면 흔들린다.'));
  cfg.cards.forEach(function(c){ var p=el('div','pcard'); p.appendChild(rich(c.t)); p.setAttribute('data-ans',c.ans);
    p.addEventListener('click',function(){ pool.querySelectorAll('.pcard').forEach(function(x){x.classList.remove('pick');}); p.classList.add('pick'); picked=p; });
    pool.appendChild(p); });
  cfg.slots.forEach(function(k){ var s=el('div','slot'); s.appendChild(el('span','nm',cfg.slotName[k])); var got=el('span','got',''); s.appendChild(got);
    s.addEventListener('click',function(){
      if(!picked) return;
      if(picked.getAttribute('data-ans')===k){
        s.classList.remove('correct'); void s.offsetWidth; s.classList.add('correct'); s.classList.add('full');
        var nm=picked.textContent.split(' — ')[0].slice(0,14); got.textContent=got.textContent?got.textContent+' · '+nm:nm;
        picked.classList.add('gone'); picked=null; correct++;
      } else { s.classList.remove('wrong'); void s.offsetWidth; s.classList.add('wrong'); picked.classList.remove('pick'); picked=null; }
      if(pool.querySelectorAll('.pcard:not(.gone)').length===0) onDone(correct);
    }); slots.appendChild(s); });
  wrap.appendChild(pool); wrap.appendChild(slots); return wrap;
}

  ['찬성','반대'].forEach(function(t){ var b=el('button','btn','탄핵에 '+t); b.disabled=true; b.addEventListener('click',function(){ right.querySelectorAll('.btn').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); S.s6v=t; next.disabled=false; }); vote.appendChild(b); });
  var hb=el('button','btn ghost','판단을 유보한다'); hb.addEventListener('click',function(){ hb.classList.add('on'); S.s6v='유보'; next.disabled=false; }); hold.appendChild(hb);
  right.appendChild(vote); right.appendChild(hold); right.appendChild(el('span','hint','유보는 세 번째 표가 아니라 증거가 부족하다는 판단이다.'));
  dec.appendChild(left); dec.appendChild(right); v.appendChild(dec);
  nav.appendChild(next); v.appendChild(nav); mount(v);
}
/* ───────── 결과 ───────── */
function result(){
  setHeader(6,'결과'); setRecord(5,-1); setMine(-1);
  var choices=buildChoices(S, GAME_CONFIG.version);
  if(!S.submitted){ sendToSupabase(choices,''); S.submitted=true; }
  var v=el('div','scene');
  v.appendChild(histCard(S6.hist));
  var grid=el('div','result');
  var t=el('div','traj'); t.appendChild(el('h3',null,'나의 판단 궤적')); trajectory(S).forEach(function(s){ t.appendChild(el('p',null,s)); });
  var labs=el('div','labels'); labs.appendChild(el('span','lab','우선순위 · '+choices.priority_transition)); labs.appendChild(el('span','lab','조직 · '+choices.pattern.org)); labs.appendChild(el('span','lab','책임 · '+S.s6v)); t.appendChild(labs);
  grid.appendChild(t);
  var h=el('div','hist2'); h.appendChild(el('h3',null,'역사의 기록'));
  ['1919.9 통합 · 상하이 (국민의회는 이탈)','연통제 · 교통국 · 외교 · 공채','1921 침체 · 국무총리 사임 · 성토문','1923 국민 대표 회의 결렬 · 해산령','1925 탄핵 · 면직 · 국무령제'].forEach(function(s){ h.appendChild(el('p',null,s)); });
  grid.appendChild(h); v.appendChild(grid);
  var ask=el('div','ask'); ask.appendChild(el('b',null,'생각해 볼 것')); ASK.forEach(function(s){ ask.appendChild(el('p',null,'· '+s)); }); v.appendChild(ask);
  var ta=el('textarea'); ta.id='comment'; ta.rows=2; ta.placeholder='한 줄 소감을 남겨보세요. (이름·학번 제외)'; ta.maxLength=100; v.appendChild(ta);
  var nav=el('div','nav');
  nav.appendChild(navBtn('결과 복사',function(){
    var c=ta.value.trim();
    if(c && !S.commentSubmitted){ sendToSupabase({record_type:'comment',version:GAME_CONFIG.version},c); S.commentSubmitted=true; }
    var txt=['[임시 정부를 다시 설계하다]'].concat(trajectory(S)).concat(['패턴: 우선순위 '+choices.priority_transition+' / 조직 '+choices.pattern.org+' / 책임 '+S.s6v]).concat(c?['소감: '+c]:[]).join('\n');
    navigator.clipboard.writeText(txt).then(function(){ alert('복사했습니다. 패들렛이나 하이러닝에 붙여 넣으세요.'); },function(){ alert('복사에 실패했습니다.'); });
  },true));
  nav.appendChild(navBtn('다시 하기',function(){ reset(); intro(); },false));
  v.appendChild(nav);
  v.appendChild(el('footer',null,'© 찰리쌤 · hischarlie.tistory.com'));
  mount(v);
}
