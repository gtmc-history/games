function $(q,root=document){return root.querySelector(q)}function $$(q,root=document){return[...root.querySelectorAll(q)]}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function withTT(text){let h=esc(text),marks=[];TT_KEYS.forEach((k,i)=>{const token='\u0001'+i+'\u0001';if(h.includes(k)){h=h.split(k).join(token);marks[i]=k}});marks.forEach((k,i)=>{if(!k)return;h=h.split('\u0001'+i+'\u0001').join('<span class="tt" data-t="'+esc(k)+'">'+esc(k)+'</span>')});return h}function rich(tag,cls,text){const n=el(tag,cls);n.innerHTML=withTT(text);return n}
function mount(node){$('#stage').replaceChildren(node);window.scrollTo({top:0,behavior:'instant'})}function setScene(n,dark=false){S.scene=n;$('#gprog').textContent='S '+n+' / 6';$('#wrap').classList.toggle('mode-dark',!!dark);const v=el('section');v.dataset.scene=String(n);return v}function dots(n){const d=el('div','step-dots');for(let i=1;i<=6;i++)d.appendChild(el('div','dot'+(i<=n?' on':'')));return d}function heading(v,eyebrow,title,lead){v.appendChild(el('div','eyebrow',eyebrow));v.appendChild(el('h1','sc-title',title));if(lead)v.appendChild(rich('p','lead',lead));v.appendChild(dots(S.scene))}
document.addEventListener('click',e=>{const b=$('#tt-bubble'),t=e.target.closest('.tt');if(t){b.textContent=TT[t.dataset.t]||'';b.classList.add('show');b.style.top='-9999px';b.style.left='0px';const bh=b.offsetHeight,bw=b.offsetWidth,r=t.getBoundingClientRect();let top=r.top+scrollY-bh-8;if(top<scrollY+4)top=r.bottom+scrollY+8;let left=r.left+scrollX+r.width/2-bw/2;left=Math.max(8,Math.min(left,scrollX+document.documentElement.clientWidth-bw-8));b.style.top=top+'px';b.style.left=left+'px'}else b.classList.remove('show')});
function tagSymbol(n){return n?'①②③④'[n-1]:'·'}function tagLabel(n){return n?tagSymbol(n)+' '+TARGET_TAGS[n-1]:'미분류'}
function storeMapRecord(card,yearLabel){const i=S.mapRecords.findIndex(r=>r.key===card.key),rec={id:card.id,key:card.key,name:card.name,place:card.place,year:yearLabel===undefined?card.year:yearLabel,special:!!card.special,tag:null};if(i>=0){rec.tag=S.mapRecords[i].tag;S.mapRecords[i]=rec}else S.mapRecords.push(rec)}function updateMapTag(key,tag){const r=S.mapRecords.find(x=>x.key===key);if(r)r.tag=tag}
function pointPercent(place,viewKey){const p=PLACES[place],b=MAP_VIEWS[viewKey].bounds;return{left:(p.lng-b[0])/(b[1]-b[0])*100,top:(b[3]-p.lat)/(b[3]-b[2])*100}}
function buildMap(records,focusPlace=null,focusKey=null){const wrap=el('div','map-wrap');wrap.appendChild(el('div','map-instruction','지도는 정답 문제가 아니라 사건 위치와 당신의 표적 분류가 쌓이는 기록판입니다.'));const tabs=el('div','region-tabs');wrap.appendChild(tabs);const host=el('div');wrap.appendChild(host);let active=focusPlace&&PLACES[focusPlace]?PLACES[focusPlace].region:'overview';const buttons={};Object.entries(MAP_VIEWS).forEach(([key,m])=>{const b=el('button','region-tab',m.label);b.type='button';b.dataset.testid='map-'+key;b.onclick=()=>{active=key;render()};buttons[key]=b;tabs.appendChild(b)});
 function render(){Object.entries(buttons).forEach(([k,b])=>b.classList.toggle('active',k===active));const view=MAP_VIEWS[active],frame=el('div','static-map');const img=document.createElement('img');img.src=view.src;img.alt=view.label+' 정적 지리 지도';img.onerror=()=>frame.replaceChildren(el('div','map-fail','지도 그림을 불러오지 못했습니다. 같은 폴더의 지도 파일을 확인해 주세요.'));frame.appendChild(img);const seen=new Set();records.forEach(r=>{if(seen.has(r.place))return;const p=PLACES[r.place];if(!p)return;if(active!=='overview'&&p.region!==active)return;const pt=pointPercent(r.place,active);if(pt.left<0||pt.left>100||pt.top<0||pt.top>100)return;seen.add(r.place);const rs=records.filter(x=>x.place===r.place);const mk=el('div','map-marker'+(rs.some(x=>x.key===focusKey)?' current':''));mk.style.left=pt.left+'%';mk.style.top=pt.top+'%';const lab=el('span','marker-label',r.place);const ids=el('span','marker-records',rs.map(x=>x.id+' '+x.name).join(' · '));const tg=el('span','marker-tags',rs.map(x=>tagSymbol(x.tag)).join(' '));lab.appendChild(ids);lab.appendChild(tg);mk.appendChild(lab);frame.appendChild(mk)});host.replaceChildren(frame);const legend=el('div','map-legend');TARGET_TAGS.forEach((t,i)=>{const x=el('span');x.innerHTML='<b>'+tagSymbol(i+1)+'</b> '+esc(t);legend.appendChild(x)});host.appendChild(legend)}render();return wrap}

function s4Decision(){const v=setScene(4,true);heading(v,'S4 · 1923~1925','다음 움직임을 어떻게 설명할 것인가?','역사가의 자리에서 당시까지 드러난 조건을 두 개 골라, 이후 움직임의 방향을 설명합니다. 실제 역사와 같아야 정답인 문제는 아닙니다.');const cs=el('div','conditions');S4_CONDITIONS.forEach(t=>cs.appendChild(rich('div','condition',t)));v.appendChild(cs);v.appendChild(el('div','q','이 조건들을 종합하면, 의열단의 이후 움직임에서 어떤 방향이 더 강해질 것으로 보는가?'));const dc=el('div','choices');let d=null;S4_DECISIONS.forEach((txt,i)=>{const b=el('button','choice',txt);b.dataset.testid='s4-decision-'+(i+1);b.onclick=()=>{d=i+1;$$('.choice',dc).forEach(x=>x.classList.toggle('picked',x===b));update()};dc.appendChild(b)});v.appendChild(dc);v.appendChild(el('div','q','그 설명에 가장 크게 작용한 조건 두 가지를 고르시오.'));const ec=el('div','choices'),evidence=new Set(),counter=el('div','evidence-count','0 / 2 선택');S4_CONDITIONS.forEach((txt,i)=>{const b=el('button','choice',(i+1)+'. '+txt);b.dataset.testid='s4-evidence-'+(i+1);b.onclick=()=>{const n=i+1;if(evidence.has(n))evidence.delete(n);else if(evidence.size<2)evidence.add(n);b.classList.toggle('picked',evidence.has(n));counter.textContent=evidence.size+' / 2 선택';update()};ec.appendChild(b)});v.appendChild(ec);v.appendChild(counter);const row=el('div','btnrow'),go=el('button','btn','판단 제출');go.dataset.testid='s4-submit';go.disabled=true;row.appendChild(go);v.appendChild(row);function update(){go.disabled=!(d&&evidence.size===2)}go.onclick=()=>{S.choices.s4_decision=d;S.choices.s4_evidence=[...evidence].sort((a,b)=>a-b);const future=unlockFutureData();S.futureUnlocked=true;const nr=S.mapRecords.find(x=>x.key==='namjahyun');if(nr)nr.year='1924 / 1926';$$('.choice',dc).concat($$('.choice',ec)).forEach(b=>b.disabled=true);go.disabled=true;const out=el('div'),cmp=el('div','compare'),mine=el('div');mine.appendChild(el('h3',null,'당신의 설명'));mine.appendChild(el('p',null,S4_DECISIONS[d-1]));mine.appendChild(el('p','hint','중요하게 본 조건 · '+S.choices.s4_evidence.map(n=>n+'. '+S4_CONDITIONS[n-1]).join(' / ')));const theirs=el('div');theirs.appendChild(el('h3',null,'실제로 이어진 움직임'));theirs.appendChild(el('p',null,future.s4_record));cmp.appendChild(mine);cmp.appendChild(theirs);out.appendChild(cmp);out.appendChild(el('div','feedback','당신의 설명이 실제 후속 움직임과 다르다고 해서 틀린 것은 아닙니다. 같은 조건에서도 무엇을 더 중요하게 보느냐에 따라 다른 설명이 가능합니다. 이후 기록은 판단을 다시 검토하는 추가 근거입니다.'));const note=el('div','panel');note.appendChild(el('strong',null,'연도 충돌 기록 보완'));note.appendChild(el('p','lead',future.namjahyun_note));out.appendChild(note);nextButton(out,'다시 기록을 살펴보기',s5,'s4-next');v.appendChild(out)};mount(v)}
function affiliationPhase(host,card,onNext,last){host.appendChild(el('div','q','교과서 분류 기준으로 이 기록의 소속을 고르세요.'));const ah=el('div','aff-grid');host.appendChild(ah);let pick=null,checked=false;const render=()=>{ah.replaceChildren();AFFS.forEach(a=>{const b=el('button','aff-btn',a);b.dataset.aff=a;b.dataset.testid='aff-'+card.key+'-'+a;if(pick===a)b.classList.add('picked');b.disabled=checked;b.onclick=()=>{if(checked)return;pick=a;render();go.disabled=false};ah.appendChild(b)})};const fb=el('div');host.appendChild(fb);const row=el('div','btnrow'),go=el('button','btn','소속 확인');go.disabled=true;row.appendChild(go);host.appendChild(row);render();go.onclick=()=>{if(checked)return;checked=true;S.choices.s5_affiliations[card.key]=pick;const ok=pick===card.affiliation;$$('.aff-btn',ah).forEach(b=>{b.disabled=true;if(b.dataset.aff===card.affiliation)b.classList.add('correct');if(b.dataset.aff===pick&&pick!==card.affiliation)b.classList.add('wrong')});fb.className='feedback '+(ok?'ok':'bad');fb.textContent=ok?'교과서 분류와 일치합니다.':'교과서 분류 기준의 소속을 확인하세요.';go.textContent=last?'네 기록 비교하기':'다음 기록';go.disabled=false;go.onclick=onNext}}
function s5(){const future=unlockFutureData();$('#wrap').classList.remove('mode-dark');let idx=0;function show(){if(idx>=future.cards.length){s5Judgement();return}const card=future.cards[idx];storeMapRecord(card,card.year);const v=setScene(5);heading(v,'S5 · 1926~1932','다시 기록을 살펴봅니다.','이후 네 기록에도 같은 표적 성격 4칸을 적용합니다. 그다음 교과서 분류 기준의 소속을 확인합니다.');v.appendChild(el('div','hint',(idx+1)+' / '+future.cards.length+' 기록'));v.appendChild(incidentCard(card));v.appendChild(recordMeta(card));const mapHost=el('div');v.appendChild(mapHost);const redraw=()=>mapHost.replaceChildren(buildMap(S.mapRecords,card.place,card.key));redraw();const actions=el('div');v.appendChild(actions);const tagBox=el('div','tag-panel');actions.appendChild(tagBox);tagChoices(tagBox,card,'s5_target_tags',()=>{redraw();const rb=resultBlock(card);if(rb)tagBox.appendChild(rb);const aff=el('div','panel');actions.appendChild(aff);affiliationPhase(aff,card,()=>{idx++;show()},idx===future.cards.length-1)});mount(v)}show()}
function futureRecordBoard(cards){const box=el('div','mini-records');cards.forEach(card=>{const m=el('div','mini-record'),h=el('div','mini-head');h.appendChild(el('span',null,card.id+' · '+card.name));h.appendChild(el('span',null,card.place));m.appendChild(h);m.appendChild(rich('div','mini-text',card.text));m.appendChild(el('div','mini-tag',tagLabel(S.choices.s5_target_tags[card.key])));m.appendChild(el('div','mini-aff','교과서 분류 · '+card.affiliation));box.appendChild(m)});return box}
function s5Judgement(){const future=unlockFutureData(),v=setScene(5);heading(v,'S5 · 판단','기록은 어디까지 말해 주는가','1923년 선언과 네 기록의 표적·소속을 나란히 놓고 판단합니다.');const board=el('div','compare-board');board.appendChild(declarationBridge());const right=el('div');right.appendChild(el('div','source-bridge-title','1926~1932년에 살펴본 네 기록'));right.appendChild(futureRecordBoard(future.cards));board.appendChild(right);v.appendChild(board);v.appendChild(el('div','q','이 자료만으로 네 사건도 〈조선 혁명 선언〉과 같은 논리였다고 말할 수 있는가?'));const ch=el('div','choices');let pick=null;future.judgements.forEach((txt,i)=>{const b=el('button','choice',txt);b.dataset.testid='s5-judge-'+(i+1);b.onclick=()=>{pick=i+1;$$('.choice',ch).forEach(x=>x.classList.toggle('picked',x===b));go.disabled=false};ch.appendChild(b)});v.appendChild(ch);const row=el('div','btnrow'),go=el('button','btn','판단 기록');go.dataset.testid='s5-submit';go.disabled=true;row.appendChild(go);v.appendChild(row);go.onclick=()=>{S.choices.s5_judgement=pick;$$('.choice',ch).forEach(b=>b.disabled=true);go.disabled=true;const text=(pick===4)?'자료의 한계를 먼저 본 판단입니다. 현재 기록만으로는 표적의 유사성까지는 확인할 수 있지만, 조직과 논리의 동일성까지 확정할 수는 없습니다.':'표적의 유사성은 확인할 수 있지만, 그것만으로 같은 조직·같은 논리였다고 단정할 수는 없다. 이 자료가 보여 주는 것은 "비슷한 표적"까지이며, 같은 논리였다는 주장을 하려면 그 논리를 직접 보여 주는 근거가 더 필요하다.';const fb=el('div','feedback',text);fb.dataset.testid='s5-post-explanation';v.appendChild(fb);nextButton(v,'결과판 보기',result,'s5-result');};mount(v)}
function allTagCounts(){const merged={...S.choices.s1_target_tags,...S.choices.s3_target_tags,...S.choices.s5_target_tags};return tagCounts(merged)}
function renderFinalMap(v){v.appendChild(el('div','q','완성된 지도'));v.appendChild(buildMap(S.mapRecords));const list=el('div','timeline');S.mapRecords.slice().sort((a,b)=>String(a.year).localeCompare(String(b.year))).forEach(r=>{const x=el('div','t-item');x.appendChild(el('div','t-year',String(r.year)));x.appendChild(el('div','t-name',r.name));x.appendChild(el('div','t-place',r.place));x.appendChild(el('div','t-tag',tagLabel(r.tag)));list.appendChild(x)});v.appendChild(list)}
function result(){$('#wrap').classList.remove('mode-dark');if(!S.submitted){sendToSupabase({...S.choices},'');S.submitted=true}const v=setScene(6);heading(v,'S6 · 결과판','당신이 남긴 판단 궤적','점수나 유형명 대신, 표적 분류에서 자료의 한계 판단까지 어떤 경로를 거쳤는지 확인합니다.');const counts=allTagCounts();v.appendChild(distributionPanel(counts,'표적 분류 — ① '+counts[0]+'건 / ② '+counts[1]+'건 / ③ '+counts[2]+'건 / ④ '+counts[3]+'건 (학생 본인 분류 기준)'));renderFinalMap(v);v.appendChild(el('div','q','판단 궤적'));const tr=el('div','trajectory');[['표적 분류','① '+counts[0]+'건 / ② '+counts[1]+'건 / ③ '+counts[2]+'건 / ④ '+counts[3]+'건 (학생 본인 분류 기준)'],['S1 가설',S1_HYP[(S.choices.s1_hypothesis||1)-1]],['S3 연결',PRE_CARDS.s3.map(c=>c.name+' → '+LINK_OPTS[(S.choices.s3_links[c.key]||4)-1]).join(' / ')],['S4 설명·근거',S4_DECISIONS[(S.choices.s4_decision||1)-1]+' · '+(S.choices.s4_evidence||[]).map(n=>n+'. '+S4_CONDITIONS[n-1]).join(' / ')],['S5 자료 한계 판단',unlockFutureData().judgements[(S.choices.s5_judgement||1)-1]]].forEach(([lab,val])=>{const c=el('div','traj');c.appendChild(el('div','traj-label',lab));c.appendChild(el('div','traj-value',val));tr.appendChild(c)});v.appendChild(tr);v.appendChild(el('p','hint','소속 판정은 교과서 분류(의열단 / 한인 애국단 / 기타) 기준입니다.'));const d=el('div','discovery-card');d.dataset.testid='today-discovery';d.appendChild(el('div','kicker','TODAY’S DISCOVERY'));d.appendChild(el('h3',null,'오늘의 발견'));const pts=el('div','discovery-points');[['1','의열 투쟁의 표적은 식민 통치·치안·경제 수탈·일본 국가 권력의 여러 지점을 향했다.'],['2','표적의 성격은 시기에 따라 한 방향으로 교체되기보다 반복되고 겹쳐 나타났다.'],['3','표적이 비슷하다는 사실만으로 같은 조직·같은 논리였다고 단정할 수는 없다.']].forEach(([n,t])=>{const p=el('div','discovery-point');p.appendChild(el('strong',null,n));p.appendChild(el('div',null,t));pts.appendChild(p)});d.appendChild(pts);d.appendChild(el('div','discovery-thesis','표적은 식민 지배의 무엇을 문제로 보았는지 읽는 중요한 단서다. 그러나 표적 하나만으로 독립운동의 조직과 전략, 논리 전체를 설명할 수는 없다.'));v.appendChild(d);const q=el('div','panel');q.appendChild(el('div','q','비슷한 표적을 공격했다고 해서 같은 조직, 같은 논리라고 말할 수 있을까?'));v.appendChild(q);v.appendChild(el('div','q reflection-q','처음 생각한 의열 투쟁과 비교해, 가장 달라진 생각 한 가지 (선택)'));const ta=document.createElement('textarea');ta.id='comment';ta.rows=2;ta.maxLength=100;ta.placeholder='예: 표적이 시대별로 한 방향으로 바뀐다고 생각했는데, 여러 성격이 겹쳐 나타났다. (이름·학번 제외)';v.appendChild(ta);const row=el('div','btnrow'),cp=el('button','btn','결과 복사'),rs=el('button','btn secondary','다시 하기');cp.dataset.testid='copy';rs.dataset.testid='restart';row.appendChild(cp);row.appendChild(rs);v.appendChild(row);const msg=el('div','hint');v.appendChild(msg);v.appendChild(el('footer','footer-copy','© 찰리쌤 · hischarlie.tistory.com'));cp.onclick=()=>{const comment=ta.value.trim(),text=['《왜 그곳을 겨냥했을까?》 탐구 결과','표적 분류: ① '+counts[0]+'건 / ② '+counts[1]+'건 / ③ '+counts[2]+'건 / ④ '+counts[3]+'건','S1 가설: '+S1_HYP[S.choices.s1_hypothesis-1],'S4 설명: '+S4_DECISIONS[S.choices.s4_decision-1],'S4 근거 2개: '+S.choices.s4_evidence.map(n=>n+'. '+S4_CONDITIONS[n-1]).join(' / '),'S5 판단: '+unlockFutureData().judgements[S.choices.s5_judgement-1],'오늘의 발견: 표적은 식민 지배의 구조를 읽는 단서지만, 표적의 유사성만으로 조직·전략·논리의 동일성을 단정할 수 없다.',comment?'달라진 생각: '+comment:null].filter(Boolean).join('\n');const p=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(text):Promise.reject();p.then(()=>msg.textContent='복사했습니다. 패들렛이나 하이러닝에 붙여넣으세요.').catch(()=>{ta.value=text;ta.select();msg.textContent='복사 기능을 사용할 수 없어 결과 텍스트를 선택했습니다.'});if(comment&&!S.commentSubmitted){sendToSupabase({record_type:'comment',version:GAME_CONFIG.version},comment);S.commentSubmitted=true}};rs.onclick=restart;mount(v)}
