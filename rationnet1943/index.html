<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배급망 1943 — 기록을 잇는 사람</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G350VXSFGE"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#f0ece4;
  --surface:#e8e0d4;
  --surface-2:#f6f2ea;
  --text:#1a1a1a;
  --muted:#5a5148;
  --sepia:#8b7355;
  --line:#c9bca7;
  --primary:#003087;
  --primary-soft:rgba(0,48,135,.08);
  --accent:#cd2e3a; /* 정의만 유지. 게임 UI에서 사용하지 않음 */
  --font-display:'Noto Serif KR',serif;
  --font-body:'Noto Sans KR',sans-serif;
  --font-doc:'Gowun Batang',serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{
  background:var(--color-bg);color:var(--text);
  font-family:var(--font-body);font-size:16px;line-height:1.6;
  min-height:100dvh;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.28;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .28 0 0 0 .18 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
}
button,textarea,input{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:16px 16px 48px}

/* 헤더 */
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.hdr .gname{font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:.02em}
.hdr .gname small{font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:14px;margin-left:8px}
.hdr .prog{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.hdr .prog b{color:var(--text)}

/* 장면 공통 */
.scene{animation:scene-in .4s ease forwards}
@keyframes scene-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kicker{font-size:14px;color:var(--sepia);font-weight:700;letter-spacing:.06em}
h1{font-family:var(--font-display);font-weight:900;font-size:34px;line-height:1.2;margin:4px 0 8px}
h2{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.3;margin:0 0 6px}
h3{font-family:var(--font-display);font-weight:700;font-size:18px;margin:16px 0 8px}
.sub{color:var(--muted);font-size:16px;margin:0 0 12px}
.question{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.4;margin:16px 0 10px}
.mission{border-left:3px solid var(--primary);background:var(--primary-soft);padding:12px 14px;margin:12px 0 16px;border-radius:0 4px 4px 0}
.mission .lab{font-size:14px;color:var(--primary);font-weight:700}
.mission b{display:block;margin-top:2px;font-size:17px}
.mission .how{color:var(--muted);margin-top:4px;font-size:16px}
.notice{font-size:14px;color:var(--muted);border:1px dashed var(--line);padding:8px 12px;border-radius:4px;margin:12px 0}

/* 버튼 */
.btn{
  min-height:48px;border:1px solid var(--sepia);border-radius:4px;padding:10px 16px;
  background:var(--surface-2);font-weight:700;font-size:17px;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease,background .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sel{border-left:3px solid var(--primary);background:var(--surface)}
.btn.small{min-height:48px;font-size:16px;padding:8px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.nav{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.nav[hidden]{display:none} /* [hidden] 전역 규칙의 보조. display:flex가 hidden을 덮지 않도록 */

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{
  position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;
  padding:14px 14px 12px;min-height:150px;display:flex;flex-direction:column;
  transition:border-color .2s,background .2s,transform .15s;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s}
.card.sel{background:var(--surface)}
.card.sel::before{background:var(--primary)}
.card.done{opacity:.6}
.card.hold{border-style:dashed;border-color:#9a9a9a}
.card .meta{font-size:14px;color:var(--sepia);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.card .cname{font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:4px;line-height:1.35}
.card .ctext{font-family:var(--font-doc);font-size:16px;line-height:1.65}
.card .recon{font-size:14px;color:var(--sepia);margin-top:8px}
.card .fb{font-size:16px;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);animation:fb-in .35s ease}
@keyframes fb-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.live{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:16px;min-height:52px}
.live strong{color:var(--primary)}
#live{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden} /* 낭독기 전용. 시각 피드백은 카드 안에 표시 */

/* S2 작업판 */
.board{overflow-x:auto;margin:8px 0 12px}
.board table{border-collapse:separate;border-spacing:6px;min-width:640px;width:100%}
.board th{font-size:14px;color:var(--muted);font-weight:700;padding:4px 6px;text-align:center;white-space:nowrap}
.board th.rowh{text-align:left;white-space:normal;width:120px}
.board td{padding:0}
.cell{
  width:100%;min-height:64px;border:1px dashed var(--line);border-radius:4px;background:transparent;
  cursor:pointer;text-align:left;padding:8px 10px;font-size:16px;line-height:1.35;color:var(--muted);
  transition:background .2s,border-color .2s;
}
.cell:hover{background:rgba(0,0,0,.03)}
.cell.filled{border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--text);cursor:default;font-family:var(--font-doc)}
.cell.filled::before{content:"";display:inline-block;width:3px;height:1em;background:var(--primary);margin-right:8px;vertical-align:-2px}
.cell.target{border-color:var(--primary);background:var(--primary-soft);color:var(--text)}
.cell.empty{border-color:transparent;background:transparent;cursor:default}
.board.hint{text-align:center;color:var(--muted);font-size:14px}
.cardrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rowpick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;align-items:center}
.rowpick .lab{font-size:14px;color:var(--sepia);font-weight:700;flex-basis:100%}
.pick{
  flex:1 1 200px;min-height:48px;text-align:left;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);
  padding:10px 12px;font-size:16px;line-height:1.45;cursor:pointer;font-family:var(--font-doc);position:relative;
}
.pick::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.pick.sel{background:var(--surface)}
.pick.sel::before{background:var(--primary)}
.pick.placed{opacity:.45;cursor:default}
.pick.retry{border-style:dashed;border-color:#9a9a9a}
.pick .d{font-family:var(--font-body);font-size:14px;color:var(--sepia);font-weight:700;display:block}

/* S4 선 판별 */
.lines{display:flex;flex-direction:column;gap:10px}
.lrow{border:1px solid var(--line);border-radius:4px;background:var(--surface-2);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative}
.lrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.lrow.fixed::before{background:var(--primary)}
.lrow.fixed.dash::before{background:var(--sepia)}
.lrow.hold{border-style:dashed;border-color:#9a9a9a}
.lrow .lname{flex:1 1 220px;font-weight:700;font-size:17px}
.lrow .lname .arrow{color:var(--sepia);margin:0 6px}
.lrow .lbtns{display:flex;gap:6px;flex-wrap:wrap}
.lrow .lfb{flex-basis:100%;font-size:16px;color:var(--text);padding-top:8px;border-top:1px dashed var(--line);animation:fb-in .35s ease}
.lrow .lstate{font-size:14px;color:var(--sepia);font-weight:700}

/* 선택 후보 (S5·S6) */
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt{
  min-height:48px;text-align:left;border:1px solid var(--line);border-left:3px solid transparent;border-radius:4px;
  background:var(--surface-2);padding:10px 14px;font-size:17px;cursor:pointer;
  transition:border-color .2s,background .2s,transform .15s;
}
.opt:hover{border-left-color:var(--primary);background:var(--surface);transform:translateX(4px)}
.opt.sel{border-left-color:var(--primary);background:var(--surface)}
.opt.hold{border-style:dashed;border-color:#9a9a9a}
.opt[disabled]{cursor:default;transform:none}

/* S7 검수 */
.stepbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 6px;font-size:14px;color:var(--sepia);font-weight:700}
.stepbar .dots{display:flex;gap:6px}
.stepbar .dots i{display:inline-block;width:12px;height:12px;border:1px solid var(--sepia);border-radius:2px}
.stepbar .dots i.on{background:var(--sepia)}
.stepbar .dots i.cur{border-color:var(--primary);border-width:2px}
.claim{border:1px solid var(--line);border-radius:4px;background:var(--surface-2);padding:14px;margin-bottom:12px}
.claim .ctitle{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.claim .ctitle .lab{font-size:14px;color:var(--sepia);font-weight:700;white-space:nowrap;padding-top:3px}
.claim .ctitle .txt{font-family:var(--font-doc);font-size:17px;flex:1 1 260px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  min-height:48px;border:1px solid var(--line);border-left:3px solid transparent;border-radius:4px;
  background:var(--color-bg);padding:8px 12px;font-size:16px;cursor:pointer;text-align:left;
}
.chip.sel{border-left-color:var(--primary);background:var(--surface)}
.chip.cant{border-style:dashed}
.chip.cant.sel{border-style:solid}
.chip[disabled]{opacity:.5;cursor:not-allowed}
.review{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.review summary{cursor:pointer;font-weight:700;font-size:16px;min-height:48px;display:flex;align-items:center;gap:8px}
.review .vd{font-size:14px;font-weight:700;color:var(--sepia);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.review ul{margin:6px 0 0;padding-left:18px}
.review li{margin:4px 0;font-size:16px}
.review .sum{margin-top:8px;font-size:16px;font-weight:700}

/* 생활지도 */
.mappanel{margin:4px 0 18px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);padding:10px 12px 6px}
.mappanel .mt{font-size:14px;color:var(--sepia);font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mapwrap{overflow-x:auto}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap.big svg{min-width:720px}
.mapzoom{display:none}
@media (max-width:640px){.mapzoom{display:inline-block;min-height:40px;font-size:14px;padding:6px 10px;margin-top:6px}}
.node rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.node text{fill:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;text-anchor:middle}
.node.admin rect{fill:#e6e9f1}
.node.new rect{stroke:var(--primary)}
.edge{fill:none;stroke:var(--primary);stroke-width:3;stroke-linejoin:round}
.edge.pending{stroke:var(--sepia);stroke-width:2;stroke-dasharray:6 5}
.edge.free{stroke:var(--sepia);stroke-width:3}
.edge.candidate{stroke:#b9b0a3;stroke-width:2;stroke-dasharray:2 5}
.node.candidate rect{stroke:#c9c1b5;stroke-dasharray:3 3}
.faded{opacity:.35;transition:opacity .6s ease}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:26px;height:0;border-top:3px solid var(--primary);vertical-align:middle;margin-right:4px}
.legend i.p{border-top:2px dashed var(--sepia)}
.legend i.f{border-top:3px solid var(--sepia)}
.legend i.c{border-top:2px dotted #b9b0a3}

/* 최종 화면 */
.final .slider{display:flex;align-items:center;gap:12px;margin:12px 0 4px;flex-wrap:wrap}
.final .slhint{font-size:14px;color:var(--muted);margin:0 0 12px}
.final .slider label{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.final input[type=range]{flex:1 1 200px;min-height:48px;accent-color:var(--primary)}
.law{border:1px solid var(--line);border-radius:4px;background:var(--surface-2);padding:14px;margin:10px 0}
.law .lyear{font-size:14px;color:var(--sepia);font-weight:700}
.law .lname{font-family:var(--font-display);font-weight:700;font-size:18px;margin:2px 0 4px}
.law .ltext{font-family:var(--font-doc);font-size:16px}
.sig{margin:18px 0;padding:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sig .s1,.sig .s2{font-family:var(--font-display);font-weight:900;font-size:24px;line-height:1.35;animation:fb-in .5s ease}
.sig .s2{margin-top:10px}
.sig .tag{display:inline-block;font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--sepia);border:1px solid var(--sepia);border-radius:4px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.sig .anno{font-size:16px;color:var(--muted);margin-top:10px}
.sig .anno b{color:var(--text)}
.sig .basis{font-size:14px;color:var(--muted);margin-top:6px}
.final .evid{font-size:16px}
.final .evid li{margin:4px 0}
textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px;resize:vertical;background:var(--surface-2);font-size:16px}
.final .finaltext{min-height:110px;font-family:var(--font-doc)}
.footer{margin-top:28px;font-size:14px;color:rgba(120,100,80,0.4);text-align:right}

/* 툴팁 — 왕의 결재함 v3 레퍼런스 패턴 (근현대 팔레트 적용) */
.tt{border-bottom:1.5px dashed var(--sepia);cursor:pointer;position:relative;white-space:nowrap;color:inherit;transition:border-color .15s}
/* 48px 터치 타깃: 글자 크기는 두고 투명한 히트 영역만 넓힌다 */
.tt::before{content:"";position:absolute;left:50%;top:50%;width:100%;min-width:48px;height:48px;transform:translate(-50%,-50%)}
.tt:hover,.tt:focus-visible{border-bottom-color:var(--primary)}
#tt-bubble{
  position:fixed;z-index:9000;max-width:240px;background:#2b2520;border:1px solid rgba(139,115,85,.7);
  border-radius:4px;padding:10px 13px;box-shadow:0 6px 24px rgba(0,0,0,.45);pointer-events:none;
  opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;
}
#tt-bubble.show{opacity:1;transform:translateY(0)}
#tt-bubble .tb-word{font-size:14px;font-weight:700;color:#d9c39a;font-family:var(--font-display);margin-bottom:5px}
#tt-bubble .tb-desc{font-size:14px;color:rgba(240,236,228,.9);font-family:var(--font-body);line-height:1.6}
#tt-bubble::after{content:"";position:absolute;bottom:-6px;left:var(--arrow-left,50%);transform:translateX(-50%);border:6px solid transparent;border-bottom:none;border-top-color:rgba(139,115,85,.7)}
#tt-bubble.below::after{bottom:auto;top:-6px;border-top:none;border-bottom:6px solid rgba(139,115,85,.7)}
@media (prefers-reduced-motion:reduce){#tt-bubble{transition:none}}

.sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  h1{font-size:28px}
  .hdr{flex-direction:column;gap:2px}
}
@media (prefers-reduced-motion:reduce){
  .scene,.card .fb,.lrow .lfb,.sig .s1,.sig .s2{animation:none}
  .btn,.opt,.card,.faded{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr" id="hdr">
    <div class="gname">배급망 1943 <small>기록을 잇는 사람</small></div>
    <div class="prog" id="prog"></div>
  </div>
  <main id="app" aria-live="polite"></main>
  <div id="live" class="live" role="status" aria-live="polite" hidden></div>
</div>
<div id="tt-bubble" role="tooltip"><div class="tb-word"></div><div class="tb-desc"></div></div>
<script>
/* =====================================================================
   배급망 1943 — DESIGN_LOCK v1.1.3 구현
   데이터와 문안은 모두 DATA 객체에 있다. pending 승격 시 DATA.s4.lines[*].state 와
   DATA.s5/s6 의 pending 선 상태값만 바꾸면 기대 판별·표시가 함께 바뀐다.
   ===================================================================== */
window.GAME_CONFIG = {
  game_id: 'rationnet1943',
  label: '배급망 1943',
  era: '일제강점기',
  version: '1.1.3'   /* 저장 스키마 변경(s2_cells → s2_classify) 이후 버전 */
};
window.CHARLIE_CONFIG = {
  supabaseUrl: 'https://xgniwztlrakkrbzcfklb.supabase.co',
  supabasePublishableKey: 'sb_publishable_mYZObIGh4nOLKqfnjXHsow_eIARb5U9'
};

const RECON = '당시 기록을 바탕으로 재구성';

window.DATA = {
  tooltips: {
    '매출표':'매출표(賣出票) — 쌀을 살 때 사용하도록 한 판매표',
    '전표':'전표(傳票) — 물품을 배급받을 때 내는 표',
    '공정가격':'공정가격(公定價格) — 관청이 정해 고시한 판매 가격',
    '절미':'절미(節米) — 쌀 소비를 줄이는 것',
    '혼식':'혼식(混食) — 쌀에 잡곡을 섞어 먹는 것',
    '대용식':'대용식(代用食) — 쌀 대신 먹도록 한 음식',
    '부영':'부영(府營) — 부(府)가 직접 운영함',
    '이관':'이관(移管) — 사무를 다른 기관으로 넘김',
    '애국반':'애국반(愛國班) — 전시기에 배급·동원 등에 쓰인 말단 주민 조직',
    '연맹':'연맹(聯盟) — 배급 과정에 등장하는 관련 연합 조직',
    '구제':'구제(區制) — 부 아래에 구를 두는 행정 구역 제도',

<script>
/* ---------- 유틸 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* 용어 툴팁 래핑: 텍스트를 이스케이프한 뒤 등록 용어의 첫 등장만 .tt 스팬으로 감싼다 (문자열 연결만 사용) */
function T(text){
  var out = esc(text);
  var keys = Object.keys(DATA.tooltips).sort(function(a,b){ return b.length-a.length; });
  var used = [];
  for (var i=0;i<keys.length;i++){
    var k = keys[i];
    var idx = out.indexOf(k);
    if (idx<0) continue;
    /* 이미 감싼 스팬 내부(예: 매출표 안의 표)는 건너뛴다 */
    var before = out.slice(0,idx);
    if ((before.match(/<span/g)||[]).length !== (before.match(/<\/span>/g)||[]).length) continue;
    out = before + '<span class="tt" tabindex="0" role="button" data-tt="' + esc(k) + '">' + k + '</span>' + out.slice(idx+k.length);
    used.push(k);
  }
  return out;
}
function setLive(strong, text){
  var live = document.getElementById('live');
  live.hidden = false;
  live.innerHTML = '<strong>' + esc(strong) + '</strong><br>' + esc(text||'');
}
function clearLive(){ var live=document.getElementById('live'); live.hidden=true; live.innerHTML=''; }

/* ---------- 상태 ---------- */
var scene = 0;           /* 0 도입, 1~7 장면, 8 최종 */
/* 같은 플레이의 result·comment 행을 잇는 키. 대시보드 병합 키(result_id/attempt_id/submission_id)와
   다른 이름을 써서 mergeAttemptRows()의 choices 덮어쓰기를 피한다 (지침 v3 attempt_id 주의). */
function newPlayId(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
}
var S = null;
function freshState(){

    map:{ nodes:{ home:1, market:1 }, edges:{ 'home-market':'free' }, big:false },
    submitted:false, commentSubmitted:false, commentPending:false,

    }

}
S = freshState(); S.choices.play_id = S.play_id;
DATA.s7.claims.forEach(function(c){ S.s7.claims[c.id] = { mode:null, chips:[] }; });

/* ---------- 생활지도 ---------- */
var MAP = {
  nodes:{
    gov:{ x:330,y:70, label:'경성부', cls:'admin' },
    league:{ x:550,y:70, label:'관련 연맹' },
    food:{ x:110,y:190, label:'식료배급소', cls:'admin' },
    gu:{ x:330,y:190, label:'구', cls:'admin' },
    aeguk:{ x:550,y:190, label:'애국반' },
    school:{ x:770,y:190, label:'학교' },
    home:{ x:110,y:310, label:'우리 집' },
    docs:{ x:330,y:310, label:'매출표·전표' },
    rice:{ x:550,y:310, label:'쌀 판매처' },
    student:{ x:770,y:310, label:'학생' },

  },
  edges:{
    'home-market':'M110,330 L110,410',
    'home-docs':'M190,310 L250,310',
    'docs-rice':'M410,310 L470,310',
    'gov-league':'M410,70 L470,70',
    'league-aeguk':'M550,90 L550,170',
    'league-school':'M630,70 L770,70 L770,170',
    'aeguk-home':'M550,210 L550,250 L150,250 L150,290',
    'school-student':'M770,210 L770,290',
    'gov-food':'M250,70 L110,70 L110,170',
    'food-home':'M110,210 L110,290',
    'gov-gu':'M330,90 L330,170',
    'gu-aeguk':'M410,190 L470,190',
    'league-retail':'M630,85 L650,85 L650,430 L690,430'
  }
};
function mapAdd(nodes, edges){
  (nodes||[]).forEach(function(n){ S.map.nodes[n]=1; });
  if (S.map.candNodes){ (nodes||[]).forEach(function(n){ delete S.map.candNodes[n]; }); }
  Object.keys(edges||{}).forEach(function(e){ S.map.edges[e]=edges[e]; });
}
function nodeSvg(id, extraCls){
  var n = MAP.nodes[id];
  var cand = (S.map.candNodes && S.map.candNodes[id]) ? ' candidate' : '';
  return '<g class="node ' + (n.cls||'') + ' ' + (extraCls||'') + cand + '" data-node="' + id + '">' +
    '<rect x="' + (n.x-80) + '" y="' + (n.y-20) + '" width="160" height="40" rx="3"/>' +
    '<text x="' + n.x + '" y="' + (n.y+5) + '">' + esc(n.label) + '</text></g>';
}
function edgeSvg(id, type, extraCls){
  return '<path class="edge ' + (type==='pending'?'pending':type==='free'?'free':type==='candidate'?'candidate':'') + ' ' + (extraCls||'') + '" data-edge="' + id + '" d="' + MAP.edges[id] + '"/>';
}
/* opts: {final:true, faded:true, laterOpacity:n} */
function renderMap(opts){
  opts = opts||{};
  var initialNodes = ['home','market'];
  var later = [], initial = [];
  Object.keys(S.map.edges).forEach(function(e){
    var s = edgeSvg(e, S.map.edges[e], (opts.faded && e==='home-market')?'faded':'');
    if (e==='home-market') initial.push(s); else later.push(s);
  });
  Object.keys(S.map.nodes).forEach(function(n){
    if (!MAP.nodes[n]) return;
    var s = nodeSvg(n, (opts.faded && n==='market')?'faded':'');
    if (initialNodes.indexOf(n)>=0) initial.push(s); else later.push(s);
  });
  var lop = (opts.final ? (S.fin.slider/100) : 1);
  var svg = '<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="생활지도">' +
    '<g id="g-initial">' + initial.join('') + '</g>' +
    '<g id="g-later" style="opacity:' + lop + '">' + later.join('') + '</g></svg>';
  var hasCand = Object.keys(S.map.edges).some(function(e){ return S.map.edges[e]==='candidate'; });
  var legend = '<div class="legend"><span><i></i>기록이 말한 선</span><span><i class="p"></i>기록이 여기까지만 말하는 선</span>' + (hasCand?'<span><i class="c"></i>아직 판별하지 않은 후보선</span>':'') + '<span><i class="f"></i>처음 지도의 선</span></div>';
  var zoom = '<button class="btn ghost small mapzoom" data-action="mapzoom">' + (S.map.big?'작게 보기':'크게 보기') + '</button>';
  return '<div class="mappanel"><div class="mt"><span>생활지도 — 우리 집에서 물건이 오는 길</span><span>' + (opts.caption||'') + '</span></div><div class="mapwrap' + (S.map.big?' big':'') + '">' + svg + '</div>' + legend + zoom + '</div>';
}

/* ---------- 공통 조각 ---------- */
function cardHtml(c, opts){
  opts = opts||{};
  var cls = 'card' + (opts.done?' done':'') + (opts.hold?' hold':'') + (opts.sel?' sel':'');
  var meta = '<div class="meta"><span>' + esc(opts.metaL||'문서철') + '</span><span>' + esc(opts.metaR||'') + '</span></div>';
  var html = '<div class="' + cls + '" data-card="' + esc(c.id) + '">' + meta +
    '<div class="cname">' + T(c.name||'') + '</div>' +
    '<div class="ctext">' + T(c.text||'') + '</div>' +
    '<div class="recon">' + RECON + '</div>' +
    (opts.fb ? '<div class="fb">' + esc(opts.fb) + '</div>' : '') +
    (opts.actions ? '<div class="actions">' + opts.actions + '</div>' : '') +
    '</div>';
  return html;
}
function recordHtml(r){
  return '<div class="card" style="min-height:auto;margin-bottom:12px"><div class="meta"><span>' + esc(r.name) + '</span><span>' + esc(r.date||'') + '</span></div><div class="ctext">' + T(r.text) + '</div><div class="recon">' + RECON + '</div></div>';
}
function missionHtml(text){ return '<div class="mission"><div class="lab">할 일</div><b>' + esc(text) + '</b></div>'; }
function doneHtml(d, sceneNo){
  return '<div class="card" style="min-height:auto;margin-top:16px"><div class="meta"><span>장면 완료</span></div><div class="cname">' + esc(d.title) + '</div><div class="ctext" style="font-family:var(--font-body)">' + esc(d.text) + '</div></div>' +
    '<div class="nav"><button class="btn primary" data-action="next">' + esc(DATA.nav[sceneNo]) + '</button></div>';
}
function head(title, sub, caption){
  var map = (scene>=1 && scene<=7) ? renderMap({caption: caption||'지금까지 복원한 선'}) : '';
  return '<div class="kicker">장면 ' + scene + ' / 7</div><h2>' + esc(title) + '</h2><p class="sub">' + esc(sub) + '</p>' + map;
}
function setProg(){
  var p = document.getElementById('prog');
  if (scene===0) p.innerHTML = '';
  else if (scene===8) p.innerHTML = '최종 · 겹쳐 보기';
  else p.innerHTML = '장면 <b>' + scene + '</b> / 7';
}

/* ---------- 렌더러 ---------- */
function render(){
  var app = document.getElementById('app');
  setProg();
  var html = '';
  if (scene===0) html = rIntro();
  else if (scene===1) html = rClassify('s1');
  else if (scene===2) html = rS2();
  else if (scene===3) html = rClassify('s3');
  else if (scene===4) html = rS4();
  else if (scene===5) html = rS5();
  else if (scene===6) html = rS6();
  else if (scene===7) html = rS7();
  else html = rFinal();
  app.innerHTML = '<div class="scene">' + html + '</div>';
  try { window.scrollTo({ top:0, behavior:'auto' }); } catch(e){}
}

function rIntro(){
  var d = DATA.intro;
  return '<div class="kicker">' + esc(d.kicker) + '</div><h1>' + esc(d.title) + '</h1>' +
    '<p class="sub" style="font-size:17px;color:var(--text)">' + esc(d.role) + '</p>' +
    '<p class="sub" style="font-size:14px">' + esc(d.recon) + '</p>' +
    '<div class="question">' + esc(d.question) + '</div>' +
    '<div class="notice">' + esc(d.notice) + '</div>' +
    '<div class="nav"><button class="btn primary" data-action="next">' + esc(DATA.nav[0]) + '</button></div>';
}

/* S1 · S3 분류 */
function rClassify(key){
  var d = DATA[key], st = S[key];
  var cards = d.cards.map(function(c){
    var done = !!st.done[c.id];
    var btns = Object.keys(d.cats).map(function(cat){
      return '<button class="btn small" data-action="classify" data-scene="' + key + '" data-card="' + c.id + '" data-cat="' + cat + '"' + (done?' disabled':'') + '>' + esc(d.cats[cat]) + '</button>';
    }).join('');
    return cardHtml(c, { done:done, hold:!!st.hold[c.id], fb:st.fb[c.id], actions:btns, metaR: done ? d.cats[c.cat] : '' });
  }).join('');
  var all = d.cards.every(function(c){ return st.done[c.id]; });
  return head(d.title, d.sub) + missionHtml(d.mission) + '<div class="grid">' + cards + '</div>' +

function classify(key, cardId, cat){

/* S4 선 판별 — 후보선은 지도에 옅게 미리 그리고, 판별할 때마다 그 선만 상태가 바뀐다 */
var S4_EDGE = { line1:'gov-league', line2:'league-aeguk', line3:'league-school', line4:'aeguk-home', line5:'school-student', line6:'league-retail' };
var S4_NODES = ['gov','league','aeguk','school','student','retail'];
function s4enter(){
  if (S.s4entered) return;
  S.s4entered = true;
  S.map.candNodes = {};
  S4_NODES.forEach(function(n){ S.map.nodes[n]=1; S.map.candNodes[n]=1; });
  DATA.s4.lines.forEach(function(l){ S.map.edges[S4_EDGE[l.id]] = 'candidate'; });
}
function rS4(){
  var d = DATA.s4, st = S.s4;
  s4enter();
  var rows = d.lines.map(function(l){
    var fixed = !!st.fixed[l.id], hold = (!fixed && st.judged[l.id]);
    var state = fixed ? '<span class="lstate">' + esc(d.stateLabel[l.state]) + '</span>' : '';
    var btns = fixed ? '' : '<div class="lbtns">' +
      '<button class="btn small" data-action="s4judge" data-line="' + l.id + '" data-v="yes">' + esc(d.yes) + '</button>' +
      '<button class="btn small" data-action="s4judge" data-line="' + l.id + '" data-v="no">' + esc(d.no) + '</button></div>';
    return '<div class="lrow' + (fixed?' fixed':'') + (fixed && l.state!=='stated'?' dash':'') + (hold?' hold':'') + '">' +
      '<div class="lname">' + esc(l.from) + '<span class="arrow">→</span>' + esc(l.to) + '</div>' + state + btns +
      (st.fb[l.id] ? '<div class="lfb">' + (hold?'<b>판별 보류 — </b>':'') + esc(st.fb[l.id]) + '</div>' : '') + '</div>';
  }).join('');
  var all = d.lines.every(function(l){ return st.fixed[l.id]; });
  return head(d.title, d.sub, '옅은 선은 아직 판별하지 않은 후보') + recordHtml(d.record) + missionHtml(d.mission) + '<div class="lines">' + rows + '</div>' +
    (all ? doneHtml(d.done, scene) : '');
}
function s4judge(lineId, v){
  var d = DATA.s4, st = S.s4;
  var l = d.lines.filter(function(x){ return x.id===lineId; })[0];
  if (!l || st.fixed[lineId]) return;
  var expect = (l.state==='stated') ? 'yes' : 'no';
  if (S.choices.s4_lines[lineId+'_first']===null) S.choices.s4_lines[lineId+'_first'] = (v==='yes'?'says':'not');
  var fbset = l.fb[l.state] || {};
  st.judged[lineId] = v; st.fb[lineId] = fbset[v] || '';
  if (v===expect){
    st.fixed[lineId] = true; setLive('선 확정', st.fb[lineId]);
    var e = S4_EDGE[lineId];
    if (l.state==='unstated'){ delete S.map.edges[e]; if (lineId==='line6'){ delete S.map.nodes.retail; delete S.map.candNodes.retail; } }
    else { S.map.edges[e] = l.state; }
    /* 선이 하나라도 확정된 노드는 후보 표시를 푼다 */
    Object.keys(S.map.candNodes||{}).forEach(function(n){
      var touched = Object.keys(S.map.edges).some(function(k){ return S.map.edges[k]!=='candidate' && k.indexOf(n)>=0; });
      if (touched) delete S.map.candNodes[n];
    });
  }
  else { setLive('판별 보류', st.fb[lineId]); }
  if (d.lines.every(function(x){ return st.fixed[x.id]; })) onSceneDone('s4');
  render();
}

/* S7 범위 판별 */
function claimReady(cs){ return cs.mode==='cannot' || (cs.mode==='evidence' && cs.chips.length>0); }
function computeVerdict(claimId, cs){
  var has = function(n){ return cs.chips.indexOf(n)>=0; };
  if (cs.mode==='cannot') return claimId==='claim_b' ? 'direct' : 'insufficient';
  if (claimId==='claim_a') return (has(1)&&has(2)) ? 'direct' : 'insufficient';
  if (claimId==='claim_b') return 'scope_exceeded';
  if (claimId==='claim_c') return (has(2)&&(has(3)||has(4))) ? 'direct' : 'insufficient';
  if (claimId==='claim_d') return ([3,4,5].filter(has).length>=2) ? 'direct' : 'insufficient';
  return 'insufficient';
}
function sumText(claim, cs, verdict){
  var has = function(n){ return cs.chips.indexOf(n)>=0; };
  if (cs.mode==='cannot') return claim.sum.cant;
  if (claim.id==='claim_c' && verdict==='insufficient' && !has(2) && (has(3)||has(4))) return claim.sum.noRice;
  return claim.sum[verdict] || claim.sum.insufficient || '';
}
function rS7(){
  var d = DATA.s7, st = S.s7;
  var n = d.claims.length;
  var claimBox = function(c, withControls){
    var cs = st.claims[c.id];
    var chips = '';
    if (withControls){
      var chipBtns = d.chips.map(function(ch){
        var sel = cs.mode==='evidence' && cs.chips.indexOf(ch.id)>=0;
        var full = cs.mode==='evidence' && cs.chips.length>=2 && !sel;
        return '<button class="chip' + (sel?' sel':'') + '" data-action="s7chip" data-claim="' + c.id + '" data-chip="' + ch.id + '"' + (full?' disabled':'') + ' aria-pressed="' + sel + '">' + esc(ch.label) + '</button>';
      }).join('');
      var cant = '<button class="chip cant' + (cs.mode==='cannot'?' sel':'') + '" data-action="s7cant" data-claim="' + c.id + '" aria-pressed="' + (cs.mode==='cannot') + '">' + esc(d.cant) + '</button>';
      var counter = cs.mode==='cannot' ? '이 기록들로는 말할 수 없다 — 선택됨' : '붙인 기록 ' + cs.chips.length + ' / 2' + (cs.chips.length>=2 ? ' · ' + d.maxNote : '');
      chips = '<div class="meta" style="margin-top:10px;font-size:14px;color:var(--sepia);font-weight:700">' + esc(counter) + '</div><div class="chips">' + chipBtns + cant + '</div>';
    }
    var review = '';
    if (st.reviewed){
      var v = st.verdicts[c.id];
      var label = (cs.mode==='cannot' && c.id==='claim_b') ? d.verdictLabel.within : d.verdictLabel[v];
      var lines = (cs.mode==='evidence') ? '<ul>' + cs.chips.map(function(k){ var ch = d.chips.filter(function(x){ return x.id===k; })[0]; return '<li><b>' + esc(ch.label) + '</b> — ' + esc(c.chipFb[k]) + '</li>'; }).join('') + '</ul>' : '<div style="font-size:16px;color:var(--muted)">' + esc(d.cant) + '</div>';
      review = '<details class="review" open><summary><span class="vd">' + esc(label) + '</span>판정</summary>' + lines + '<div class="sum">' + esc(sumText(c, cs, v)) + '</div></details>';
    }
    return '<div class="claim"><div class="ctitle"><span class="lab">' + esc(c.layer) + '</span><span class="txt">' + T(c.text) + '</span></div>' + chips + review + '</div>';
  };
  var body, footer;
  if (st.reviewed){
    body = d.claims.map(function(c){ return claimBox(c, false); }).join('');
    footer = '<div class="nav"><button class="btn ghost" data-action="s7redo">' + esc(d.redoBtn) + '</button><button class="btn primary" data-action="next">' + esc(DATA.nav[7]) + '</button></div>';
  } else {
    var cur = Math.max(0, Math.min(n-1, st.cur));
    var c = d.claims[cur];
    var dots = d.claims.map(function(x,i){ return '<i class="' + (claimReady(st.claims[x.id])?'on':'') + (i===cur?' cur':'') + '"></i>'; }).join('');
    var stepbar = '<div class="stepbar"><span>주장 ' + (cur+1) + ' / ' + n + '</span><span class="dots" aria-hidden="true">' + dots + '</span></div>';
    body = stepbar + claimBox(c, true);
    var ready = d.claims.every(function(x){ return claimReady(st.claims[x.id]); });
    var curReady = claimReady(st.claims[c.id]);
    var prev = '<button class="btn ghost" data-action="s7prev"' + (cur===0?' disabled':'') + '>' + esc(d.prevBtn) + '</button>';
    var next = (cur<n-1)
      ? '<button class="btn primary" data-action="s7next"' + (curReady?'':' disabled') + '>' + esc(d.nextBtn) + '</button>'
      : '<button class="btn primary" data-action="s7review"' + (ready?'':' disabled') + '>' + esc(d.reviewBtn) + '</button>';
    var note = (!curReady) ? '기록을 붙이거나 「' + d.cant + '」를 고르면 다음으로 갈 수 있다.' : (cur===n-1 && !ready ? d.readyNote : '');
    footer = (note ? '<p class="sub" style="text-align:right;font-size:14px;margin:12px 0 0">' + esc(note) + '</p>' : '') + '<div class="nav">' + prev + next + '</div>';
  }
  return head(d.title, d.sub, '복원한 지도') + missionHtml(d.mission) + body + footer;
}
function s7nav(dir){ var n = DATA.s7.claims.length; S.s7.cur = Math.max(0, Math.min(n-1, S.s7.cur + dir)); render(); }
function s7chip(claimId, chipId){
  var cs = S.s7.claims[claimId];
  if (S.s7.reviewed) return;
  if (cs.mode!=='evidence'){ cs.mode='evidence'; cs.chips=[]; }
  var i = cs.chips.indexOf(chipId);
  if (i>=0) cs.chips.splice(i,1);
  else if (cs.chips.length<2) cs.chips.push(chipId);
  if (cs.chips.length===0) cs.mode=null;
  render();
}
function s7cant(claimId){
  var cs = S.s7.claims[claimId];
  if (S.s7.reviewed) return;
  if (cs.mode==='cannot'){ cs.mode=null; } else { cs.mode='cannot'; cs.chips=[]; }
  render();
}
function s7review(){
  var d = DATA.s7, st = S.s7;
  if (!d.claims.every(function(c){ return claimReady(st.claims[c.id]); })) return;
  d.claims.forEach(function(c){
    var cs = st.claims[c.id];
    var v = computeVerdict(c.id, cs);
    st.verdicts[c.id] = v;
    var first = S.choices.s7[c.id];
    if (first.mode===null){ first.mode = (cs.mode==='cannot'?'cannot_say':'evidence'); first.chips = cs.chips.slice(); first.verdict = v; }
  });
  st.reviewed = true;
  setLive('판정 완료', d.done.text);
  render();
}
function s7redo(){ S.s7.reviewed = false; S.s7.verdicts = {}; S.s7.cur = 0; render(); }

}
function buildCopyText(){
  var lines = ['[배급망 1943] 복원 결과'];
  DATA.s7.claims.forEach(function(c){
    var cs = S.s7.claims[c.id]; var v = S.s7.verdicts[c.id];
    var label = (cs.mode==='cannot' && c.id==='claim_b') ? DATA.s7.verdictLabel.within : DATA.s7.verdictLabel[v];
    var chips = cs.mode==='cannot' ? DATA.s7.cant : cs.chips.map(function(n){ return DATA.s7.chips.filter(function(x){ return x.id===n; })[0].label; }).join(' + ');
    lines.push('- ' + c.text + ' → ' + label + ' (' + chips + ')');
  });
  lines.push('발견: ' + DATA.fin.s1 + ' ' + DATA.fin.s2 + ' [' + DATA.fin.s2tag + ']');
  if (S.choices.final_text) lines.push('서술: ' + S.choices.final_text);
  if (S.fin.commentDraft) lines.push('소감: ' + S.fin.commentDraft);
  return lines.join('\n');
}
function copyResult(){
  var ft = document.getElementById('finaltext'), cm = document.getElementById('comment');
  var finalText = ft ? ft.value.trim() : S.fin.finalDraft, comment = cm ? cm.value.trim() : S.fin.commentDraft;
  S.fin.finalDraft = finalText; S.fin.commentDraft = comment;
  if (S.choices.final_text===null && finalText) S.choices.final_text = finalText;
  /* 서술과 소감을 하나의 comment 행으로 한 번만 전송한다 */
  sendCommentRow(comment);
  var text = buildCopyText();
  var done = function(){ S.fin.copied = true; setLive('복사됨', '패들렛이나 하이러닝에 붙여 넣을 수 있다.'); render(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done); else done();
}

/* ---------- 장면 완료 → 지도 반영 ---------- */
function onSceneDone(key){
  if (key==='s1') mapAdd(['docs'], { 'home-docs':'stated' });
  if (key==='s2') mapAdd(['rice'], { 'docs-rice':'stated' });
  if (key==='s4'){
    Object.keys(S.map.edges).forEach(function(e){ if (S.map.edges[e]==='candidate') delete S.map.edges[e]; });
    S.map.candNodes = {};
  }
  if (key==='s5') mapAdd(['food'], { 'gov-food':'stated', 'food-home':DATA.s5.homeLine });
  if (key==='s6') mapAdd(['gu'], { 'gov-gu':'stated', 'gu-aeguk':DATA.s6.district.aegukLine });
}
function next(){
  if (scene===7 && !S.s7.reviewed) return;
  scene = Math.min(scene+1, 8);
  clearLive();
  if (scene===8 && !S.submitted){
    sendToSupabase(S.choices, '');
    S.submitted = true;
  }
  render();
}
function restart(){
  scene = 0; S = freshState(); S.choices.play_id = S.play_id;
  DATA.s7.claims.forEach(function(c){ S.s7.claims[c.id] = { mode:null, chips:[] }; });
  clearLive(); render();
}

/* ---------- Supabase ---------- */
function publicHeaders(extra){
  var key = (window.CHARLIE_CONFIG && window.CHARLIE_CONFIG.supabasePublishableKey) || '';
  var headers = Object.assign({ apikey:key }, extra||{});
  if (key.indexOf('eyJ')===0) headers.Authorization = 'Bearer ' + key;
  return headers;
}
function sendToSupabase(choiceData, comment){
  var url = window.CHARLIE_CONFIG.supabaseUrl, key = window.CHARLIE_CONFIG.supabasePublishableKey;
  if (!url || !key || key.indexOf('__')===0) return Promise.resolve({ ok:false, skipped:true });
  return fetch(url + '/rest/v1/game_results', {
    method:'POST',
    headers: publicHeaders({ 'Content-Type':'application/json', Prefer:'return=minimal' }),
    body: JSON.stringify({
      class: new URLSearchParams(location.search).get('class') || '미입력',
      game: window.GAME_CONFIG.game_id,
      choices: choiceData,
      comment: comment || '',
      timestamp: new Date().toISOString()
    })
  }).then(function(res){
    if (!res.ok) console.warn('[Supabase] 전송 실패 HTTP ' + res.status);
    return res;
  }).catch(function(err){
    console.warn('[Supabase] 네트워크 전송 실패', err);
    return { ok:false, failed:true };
  });
}
/* 소감 행: 소감 또는 서술이 있을 때 한 번만. 서술(final_text)은 result 행 전송 이후에 작성되므로 comment 행 choices에 실린다. */
function sendCommentRow(comment){
  if (S.commentSubmitted || S.commentPending) return Promise.resolve();
  if (!comment && !S.choices.final_text) return Promise.resolve();
  S.commentPending = true;
  return sendToSupabase({ record_type:'comment', version:GAME_CONFIG.version, play_id:S.play_id, final_text:S.choices.final_text }, comment)
    .then(function(res){
      S.commentPending = false;
      /* 키 미주입(skipped)은 서버 없음이므로 잠근다. 네트워크·HTTP 실패는 잠그지 않고 재시도를 허용한다. */
      if (res && (res.ok || res.skipped)){ S.commentSubmitted = true; }
      else { S.commentSubmitted = false; setLive('저장 실패', '서술·소감이 아직 저장되지 않았다. 복사 버튼을 다시 누르면 재시도한다.'); }
      if (scene===8) render();
    });
}

/* ---------- 툴팁 (왕의 결재함 v3 패턴) ---------- */
var bubbleTimer = null;
function tt(target){
  var bubble = document.getElementById('tt-bubble');
  var key = target.getAttribute('data-tt');
  var full = DATA.tooltips[key]; if (!full) return;
  var sep = full.indexOf(' — ');
  var word = sep>0 ? full.slice(0,sep) : key, desc = sep>0 ? full.slice(sep+3) : full;
  bubble.querySelector('.tb-word').textContent = word;
  bubble.querySelector('.tb-desc').textContent = desc;
  var rect = target.getBoundingClientRect();
  var bw = 240;
  var left = Math.max(8, Math.min(rect.left + rect.width/2 - bw/2, window.innerWidth - bw - 8));
  bubble.style.width = bw + 'px';
  bubble.style.left = left + 'px';
  bubble.style.top = '-9999px';
  bubble.classList.remove('below');
  bubble.classList.add('show');
  bubble.style.setProperty('--arrow-left', ((rect.left + rect.width/2) - left) + 'px');
  var bubH = bubble.offsetHeight;
  if (rect.top - bubH - 14 < 8){ bubble.style.top = (rect.bottom + 10) + 'px'; bubble.classList.add('below'); }
  else bubble.style.top = (rect.top - bubH - 14) + 'px';
  if (bubbleTimer) clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(hideTt, 4000);
}
function hideTt(){ var b = document.getElementById('tt-bubble'); b.classList.remove('show'); if (bubbleTimer){ clearTimeout(bubbleTimer); bubbleTimer=null; } }

/* ---------- 이벤트 ---------- */
document.getElementById('app').addEventListener('click', function(ev){
  var t = ev.target.closest('.tt');
  if (t){ ev.preventDefault(); tt(t); return; }
  var a = ev.target.closest('[data-action]');
  if (!a || a.disabled) { hideTt(); return; }
  hideTt();
  var act = a.getAttribute('data-action'), ds = a.dataset;
  if (act==='next') next();
  else if (act==='classify') classify(ds.scene, ds.card, ds.cat);
  else if (act==='s2cls') s2cls(ds.card, ds.row);
  else if (act==='s7prev') s7nav(-1);
  else if (act==='s7next') s7nav(1);
  else if (act==='mapzoom'){ S.map.big = !S.map.big; render(); }
  else if (act==='s4judge') s4judge(ds.line, ds.v);
  else if (act==='s5opt') s5opt(ds.id);
  else if (act==='s6read') s6read(ds.id);
  else if (act==='s6dist') s6dist(ds.id);
  else if (act==='s7chip') s7chip(ds.claim, Number(ds.chip));
  else if (act==='s7cant') s7cant(ds.claim);
  else if (act==='s7review') s7review();
  else if (act==='s7redo') s7redo();
  else if (act==='lawopen'){ S.fin.lawOpen = true; render(); }
  else if (act==='lawdone'){ S.fin.lawDone = true; setLive('법령 확인', DATA.fin.anno); render(); }
  else if (act==='copy') copyResult();
  else if (act==='restart') restart();
});
document.getElementById('app').addEventListener('keydown', function(ev){
  var t = ev.target.closest('.tt');
  if (t && (ev.key==='Enter' || ev.key===' ')){ ev.preventDefault(); tt(t); }
  if (ev.key==='Escape') hideTt();
});
document.getElementById('app').addEventListener('input', function(ev){
  if (!ev.target) return;
  if (ev.target.id==='slider') onSlider(ev.target.value);
  if (ev.target.id==='finaltext') S.fin.finalDraft = ev.target.value;
  if (ev.target.id==='comment') S.fin.commentDraft = ev.target.value;
});
document.addEventListener('click', function(ev){ if (!ev.target.closest('.tt') && !ev.target.closest('#tt-bubble')) hideTt(); });

render();
</script>
