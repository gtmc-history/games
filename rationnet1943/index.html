 intro:{kicker:'1940 ~ 1943 · 경성',title:'배급망 1943',role:'현대의 생활사 기록 복원자',setting:'경성의 한 집에 남았을 법한 생활필수품 기록을 당시 자료를 바탕으로 재구성한 문서철입니다. 실제 유물이 아니라 복원 작업을 위한 자료 묶음입니다.',question:'전시 동원은 전쟁터로 끌려간 사람에게만 일어난 일이었을까?',mission:'문서철의 기록을 잇고, 기록이 허용하는 만큼만 선을 긋고, 그 선으로 무엇을 말할 수 있는지 검수한다.',notice:'주제 고지 — 이 게임은 전시 물자 통제와 생활 기록을 다룹니다. 정답 점수는 없으며, 사료의 범위를 판별하는 과정 자체가 결과로 남습니다.'},
 s1:{title:'문서철을 연다',sub:'네 장의 기록이 있다. 물건이 오는 길을 정한 기록인가, 값을 정한 기록인가.',mission:'각 기록을 「구매·배급 경로」 또는 「가격 통제」로 분류한다.',cats:{purchase:'구매·배급 경로',price:'가격 통제'},cards:[{id:'rice',name:'쌀 매출표',text:'1940년 5월. 쌀을 살 때 매출표를 쓰도록 했다는 기록.',cat:'purchase',ok:'쌀을 사는 길에 표가 들어왔다.'},{id:'rubber',name:'고무제품 배급 기록',text:'1942년 8월 초. 경성부 내 고무제품을 관련 연맹을 거쳐 배급한다는 기록.',cat:'purchase',ok:'고무제품이 조직을 거쳐 오게 됐다.'},{id:'food',name:'부영 식료배급소 기록',text:'1943년 4월. 경성부가 직접 운영하는 식료배급소가 문을 열었다는 기록.',cat:'purchase',ok:'부가 운영하는 배급소가 생겼다.'},{id:'price',name:'공정가격 기록',text:'정해진 공정가격에 맞추어 팔도록 했다는 기록.',cat:'price',ok:'값을 고시한 기록. 길이 아니라 값의 통제다.'}],miss:{purchase:'표·배급소처럼 물건이 오는 길을 정한 기록이다.',price:'이 기록은 물건이 오는 길이 아니라 값을 다룬다.'},done:{title:'첫 기록 복원 완료',text:'물건을 사는 데 돈 외에도 표·조직·배급소 같은 조건이 끼어들기 시작했다. 값을 정하는 통제는 그것과 다른 선에 있다.'}},
 s2:{title:'쌀, 1940',sub:'네 기록을 시간과 성격이 만나는 칸에 놓는다. 시간은 카드가 알려 주고, 성격은 당신이 판단한다.',mission:'카드를 고른 뒤 칸을 누른다. 날짜가 없는 카드는 「시기 미확인」에 둔다.',cols:[{id:'y1939',label:'1939'},{id:'y1940_5',label:'1940년 5월'},{id:'y1940_10',label:'1940년 10월 이후'},{id:'unknown',label:'시기 미확인'}],rows:[{id:'situation',label:'상황·배경'},{id:'distribution',label:'배급·소비 통제'},{id:'price',label:'가격 통제'}],cards:[{id:'c1',date:'1939년',text:'흉작으로 식량 사정이 나빠졌다는 기록.',col:'y1939',row:'situation',ok:'1939년 기록. 통제가 아니라 통제 앞에 놓인 상황이다.',colMiss:'카드에 1939년이 적혀 있다.',rowMiss:{distribution:'이 기록은 통제 조치가 아니다. 식량 사정을 적은 기록이다.',price:'이 기록은 통제 조치가 아니다. 식량 사정을 적은 기록이다.'}},{id:'c2',date:'1940년 5월',text:'서울지역 쌀 배급에 매출표제가 실시되었다는 기록.',col:'y1940_5',row:'distribution',ok:'1940년 5월, 쌀 배급에 매출표가 들어왔다.',colMiss:'카드에 1940년 5월이 적혀 있다.',rowMiss:{situation:'상황 기록이 아니라 실시된 통제 조치다.',price:'매출표는 값이 아니라 사는 방식을 바꾼 장치다.'}},{id:'c3',date:'1940년 10월 이후',text:'절미를 위해 대용식·혼식 등 소비 규정을 철저히 하도록 한 기록.',col:'y1940_10',row:'distribution',ok:'1940년 10월 이후, 혼식 등 소비 규정을 강화했다.',colMiss:'카드에 1940년 10월 이후라고 적혀 있다.',rowMiss:{situation:'상황 기록이 아니라 소비 규정을 정한 기록이다.',price:'값을 정한 통제가 아니라 소비 규정에 관한 기록이다.'}},{id:'c4',date:null,text:'공정가격을 어긴 판매를 단속했다는 기록. 시기는 이 문서철에서 확인되지 않는다.',col:'unknown',row:'price',ok:'값을 어긴 판매를 단속한 기록. 배급과는 다른 통제다.',colMiss:'이 기록에는 날짜가 없다. 날짜 없는 칸에 둔다.',rowMiss:{situation:'상황 기록이 아니라 단속이라는 조치 기록이다.',distribution:'배급 방식이 아니라 값을 다룬다. 가격 통제 선이다.'}}],done:{title:'쌀 기록 정리 완료',text:'1940년 5월, 경성에서 쌀을 사는 길에 매출표가 들어왔다. 가격을 제한하는 통제와는 다른 방식이었다. 모든 기록의 시기를 지금 알 수 있는 것은 아니다.'}},
 s3:{title:'표는 쌀에서 끝나지 않았다',sub:'다른 품목의 기록이 섞여 있다. 배급 경로를 정한 기록인가, 통제망 밖 거래와 값을 단속한 기록인가.',mission:'각 기록을 「배급 통제」 또는 「가격·단속」으로 분류한다. 이 기록들의 시기는 문서철에 적혀 있지 않다.',cats:{distribution:'배급 통제',price:'가격·단속'},cards:[{id:'sugar',name:'설탕·면포',text:'전표를 통한 배급 통제 대상이 되었다는 기록.',cat:'distribution',ok:'설탕과 면포에도 전표가 붙었다.'},{id:'item26',name:'세탁비누',text:'배급 통제 대상 품목이 되었다는 기록.',cat:'distribution',ok:'세탁비누도 배급 통제 대상에 들어갔다.'},{id:'towel',name:'타올',text:'전표 배급 대상이 되었다는 기록.',cat:'distribution',ok:'타올도 전표 배급 대상이다.'},{id:'black',name:'암거래·가격 단속',text:'통제망 밖 거래와 가격 위반을 단속했다는 기록.',cat:'price',ok:'통제 밖으로 새는 거래와 값을 단속한 기록이다.'}],miss:{distribution:'이 기록은 값이 아니라 배급 대상을 정한 기록이다.',price:'이 기록은 배급 경로가 아니라 통제망 밖 거래와 값을 다룬다.'},done:{title:'통제 품목 확대 확인',text:'표는 쌀에서 끝나지 않았다. 설탕·면포·세탁비누·타올 등 여러 생활필수품으로 배급 통제가 넓어졌다. 시기는 이 문서철만으로는 알 수 없다.'}},
 s4:{title:'1942, 고무제품은 어디를 거쳤나',sub:'기록이 직접 말하는 선만 실선으로 남긴다. 말하지 않는 선은 없었다는 뜻이 아니라, 이 기록으로는 그을 수 없다는 뜻이다.',record:{name:'고무제품 배급 기록',date:'1942년 7월 말',text:'8월 초 경성부 내 고무제품 배급 예정. 관련 연맹에서 「각 애국반을 거치거나」 「학교로 배급」한다고 적혀 있다.'},mission:'후보선 여섯 개마다 「기록이 진술한다」 또는 「기록이 말하지 않는다」를 판별한다.',yes:'기록이 진술한다',no:'기록이 말하지 않는다',lines:[{id:'line1',from:'경성부 내 할당',to:'관련 연맹',state:'stated',fb:{stated:{yes:'1942년 8월 초 경성부 내 배급이 연맹을 통해 예정됐다.',no:'기록은 경성부 내 할당이 연맹으로 넘어감을 적고 있다.'}}},{id:'line2',from:'관련 연맹',to:'애국반',state:'stated',fb:{stated:{yes:'기록이 ‘각 애국반을 거쳐’ 배급한다고 적었다.',no:'‘각 애국반을 거치거나’라는 구절이 있다. 다시 보자.'}}},{id:'line3',from:'관련 연맹',to:'학교',state:'stated',fb:{stated:{yes:'기록이 ‘학교로 배급’한다고 적었다.',no:'‘학교로 배급’이라는 구절이 있다. 다시 보자.'}}},{id:'line4',from:'애국반',to:'가구',state:'pending',fb:{pending:{yes:'애국반을 ‘거친다’고만 적혔다. 가구 수령까지는 말하지 않는다.',no:'기록은 애국반까지만 말한다. 그 뒤는 현재 확정하지 않는다.'},stated:{yes:'기록이 애국반을 거쳐 가구에 배급한다고 적었다.',no:'애국반에서 가구로 이어지는 구절이 있다. 다시 보자.'}}},{id:'line5',from:'학교',to:'학생',state:'pending',fb:{pending:{yes:'‘학교로 배급’까지 적혔다. 학생 수령 방식은 말하지 않는다.',no:'기록은 학교까지만 말한다. 그 뒤는 현재 확정하지 않는다.'},stated:{yes:'기록이 학교를 거쳐 학생에게 배급한다고 적었다.',no:'학교에서 학생으로 이어지는 구절이 있다. 다시 보자.'}}},{id:'line6',from:'관련 연맹',to:'지정 소매상',state:'unstated',fb:{unstated:{yes:'이 기록에 지정 소매상 경로는 없다. 없었다는 뜻은 아니다.',no:'이 기록은 소매상 경로를 적지 않았다. 이 기록으로는 그을 수 없다.'}}}],stateLabel:{stated:'실선 — 기록이 진술',pending:'점선 — 기록이 여기까지만',unstated:'미표시 — 이 기록에는 없음'},done:{title:'기록이 직접 말한 선만 남겼다',text:'경성의 고무제품은 관련 연맹에서 애국반 또는 학교로 이어졌다. 그러나 그 뒤의 최종 수령 경로까지는 현재 기록만으로 확정하지 않는다.'}},
 s5:{title:'1943년 4월, 새 배급소',sub:'지도에 새 자리가 하나 생긴다. 이 배급소는 지도의 어디에서 이어지는가.',record:{name:'부영 식료배급소 기록',date:'1943년 4월',text:'경성부가 직접 운영하는 부영(府營) 식료배급소가 문을 열었다는 기록.'},question:'‘부영 식료배급소’는 지도의 어디에서 이어져야 할까?',expect:'gov',opts:[{id:'gov',label:'경성부',fb:'‘부영’은 부가 운영한다는 뜻. 경성부에서 이어진다.'},{id:'aeguk',label:'애국반',fb:'애국반은 주민 조직이다. 카드의 ‘부영’을 다시 보자.'},{id:'league',label:'관련 연맹',fb:'연맹은 고무제품 배급 조직. 이 배급소는 ‘부영’이다.'},{id:'market',label:'여러 상점',fb:'상점이 아니라 부가 운영하는 배급소다.'}],homeLine:'pending',done:{title:'경성부가 직접 운영하는 배급소',text:'경성부에서 식료배급소로 선이 하나 더 그어졌다. 배급소에서 집까지의 선은 이 기록이 말하지 않는다.'}},
 s6:{title:'지도를 읽는다',sub:'새 기록 없이, 지금까지 그린 지도를 먼저 읽는다.',read:{question:'지금까지 복원한 쌀·고무제품·식료배급소는 같은 하나의 담당선을 거쳤을까?',expect:'none',opts:[{id:'all',label:'모두 같은 선',fb:'지도를 다시 보자. 세 사례의 선이 한 조직을 지나는가.'},{id:'two',label:'두 사례만 같은 선',fb:'겹치는 조직을 짚어 보자. 같은 이름이 두 선에 있는가.'},{id:'none',label:'하나로 묶이지 않는다',fb:'사례마다 서로 다른 조직과 경로가 보인다.'}]},district:{record:{name:'구 설치와 배급 사무',date:'1943년 6월 이후',text:'경성부에 구가 설치되고 생활필수품 배급 사무가 구로 이관되었다는 기록.'},question:'배급 사무를 넘겨받은 ‘구’는 지도 어디에 추가해야 할까?',expect:'under_gov',opts:[{id:'under_gov',label:'경성부 아래',fb:'부의 배급 사무가 구로 내려왔다. 그 아래 경로는 이 기록이 말하지 않는다.'},{id:'replace_aeguk',label:'애국반을 대신하는 자리',fb:'구는 행정 단위다. 애국반이 없어졌다는 기록은 없다.'},{id:'beside_aeguk',label:'애국반과 나란히',fb:'애국반은 주민 조직, 구는 부 아래 행정 단위다.'},{id:'beside_market',label:'여러 상점 옆',fb:'구는 판매처가 아니라 사무를 넘겨받은 행정 단위다.'}],aegukLine:'pending'},done:{title:'1940년 지도에 없던 조직과 선이 붙었다',text:'쌀·고무제품·식료배급소·구 — 경로마다 담당이 다르다.'}},

function s2pick(id){if(S.s2.placed[id])return;S.s2.sel=(S.s2.sel===id?null:id);render();}function s2cell(row,col){var st=S.s2,d=DATA.s2;if(!st.sel)return;var c=d.cards.filter(function(x){return x.id===st.sel;})[0],key=row+'/'+col,idx=d.cards.indexOf(c)+1;if(S.choices.s2_cells['c'+idx+'_first']===null)S.choices.s2_cells['c'+idx+'_first']=key;if(c.col!==col){st.fb[c.id]=c.colMiss;st.retry[c.id]=true;setLive('다시 놓는다',c.colMiss);}else if(c.row!==row){var m=c.rowMiss[row]||'기록의 성격을 다시 보자.';st.fb[c.id]=m;st.retry[c.id]=true;setLive('다시 놓는다',m);}else{st.placed[c.id]=key;st.fb[c.id]=c.ok;st.retry[c.id]=false;st.sel=null;setLive('놓였다',c.ok);if(d.cards.every(function(x){return st.placed[x.id];}))onSceneDone('s2');}render();}

function publicHeaders(extra){var key=(window.CHARLIE_CONFIG&&window.CHARLIE_CONFIG.supabasePublishableKey)||'';var headers=Object.assign({apikey:key},extra||{});if(key.indexOf('eyJ')===0)headers.Authorization='Bearer '+key;return headers;}
function sendToSupabase(choiceData,comment){var url=window.CHARLIE_CONFIG.supabaseUrl,key=window.CHARLIE_CONFIG.supabasePublishableKey;if(!url||!key||key.indexOf('__')===0)return Promise.resolve({ok:false,skipped:true});return fetch(url+'/rest/v1/game_results',{method:'POST',headers:publicHeaders({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({class:new URLSearchParams(location.search).get('class')||'미입력',game:window.GAME_CONFIG.game_id,choices:choiceData,comment:comment||'',timestamp:new Date().toISOString()})}).then(function(res){if(!res.ok)console.warn('[Supabase] 전송 실패 HTTP '+res.status);return res;}).catch(function(err){console.warn('[Supabase] 네트워크 전송 실패',err);return{ok:false,failed:true};});}
function sendCommentRow(comment){if(S.commentSubmitted||S.commentPending)return Promise.resolve();if(!comment&&!S.choices.final_text)return Promise.resolve();S.commentPending=true;return sendToSupabase({record_type:'comment',version:GAME_CONFIG.version,final_text:S.choices.final_text},comment).then(function(res){S.commentPending=false;if(res&&res.skipped){S.commentSubmitted=true;render();return res;}if(res&&res.ok){S.commentSubmitted=true;render();return res;}setLive('저장 실패','복사 버튼을 다시 누르면 재시도한다.');render();return res;});}
var bubbleTimer=null;function tt(target){var key=target.getAttribute('data-tt'),text=DATA.tooltips[key]||key,b=document.getElementById('tt-bubble');b.querySelector('.tb-word').textContent=key;b.querySelector('.tb-desc').textContent=text.replace(/^.*? — /,'');b.classList.remove('below');b.style.left='0';b.style.top='0';b.classList.add('show');requestAnimationFrame(function(){var r=target.getBoundingClientRect(),br=b.getBoundingClientRect(),left=Math.max(8,Math.min(r.left+r.width/2-br.width/2,window.innerWidth-br.width-8)),top=r.top-br.height-10;if(top<8){top=r.bottom+10;b.classList.add('below');}b.style.left=left+'px';b.style.top=top+'px';b.style.setProperty('--arrow-left',(r.left+r.width/2-left)+'px');});clearTimeout(bubbleTimer);}function hideTt(){document.getElementById('tt-bubble').classList.remove('show');}
document.getElementById('app').addEventListener('click',function(ev){var t=ev.target.closest('.tt');if(t){ev.preventDefault();tt(t);return;}var a=ev.target.closest('[data-action]');if(!a||a.disabled){hideTt();return;}hideTt();var act=a.getAttribute('data-action'),ds=a.dataset;if(act==='next')next();else if(act==='classify')classify(ds.scene,ds.card,ds.cat);else if(act==='s2pick')s2pick(ds.card);else if(act==='s2cell')s2cell(ds.row,ds.col);else if(act==='s4judge')s4judge(ds.line,ds.v);else if(act==='s5opt')s5opt(ds.id);else if(act==='s6read')s6read(ds.id);else if(act==='s6dist')s6dist(ds.id);else if(act==='s7chip')s7chip(ds.claim,Number(ds.chip));else if(act==='s7cant')s7cant(ds.claim);else if(act==='s7review')s7review();else if(act==='s7redo')s7redo();else if(act==='lawopen'){S.fin.lawOpen=true;render();}else if(act==='lawdone'){S.fin.lawDone=true;setLive('법령 확인',DATA.fin.anno);render();}else if(act==='copy')copyResult();else if(act==='restart')restart();});
document.getElementById('app').addEventListener('keydown',function(ev){var t=ev.target.closest('.tt');if(t&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();tt(t);}if(ev.key==='Escape')hideTt();});document.getElementById('app').addEventListener('input',function(ev){if(!ev.target)return;if(ev.target.id==='slider')onSlider(ev.target.value);if(ev.target.id==='finaltext')S.fin.finalDraft=ev.target.value;if(ev.target.id==='comment')S.fin.commentDraft=ev.target.value;});document.addEventListener('click',function(ev){if(!ev.target.closest('.tt')&&!ev.target.closest('#tt-bubble'))hideTt();});render();
</script>
</body>
