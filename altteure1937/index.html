<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알뜨르: 지도를 넓혀라</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-G350VXSFGE"></script>

<style>
:root{
  --bg:#e9e3d7;
  --paper:#fbf8f1;
  --ink:#191815;
  --muted:#6b655c;
  --line:#c9bfaf;
  --blue:#173b64;
  --red:#8c3d2f;
  --soft:#efe9dc;
  --white:#fffdf8;
  --r:4px;

  --font-display:'Noto Serif KR', serif;
  --font-body:'Noto Sans KR', sans-serif;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
}
body{
  background:
    radial-gradient(circle at 20% 0%, rgba(255,255,255,.55), transparent 36%),
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(60,50,35,.024) 23px 24px),
    var(--bg);
  -webkit-text-size-adjust:100%;
}
button,textarea{font:inherit;font-family:var(--font-body)}

.app{max-width:1120px;margin:auto;padding:16px 14px 40px}

/* ---------- 헤더 : 판단형 게임이므로 진행 상태만 표시 (점수·타이머 없음) ---------- */
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:6px 2px 13px;border-bottom:1px solid var(--line);margin-bottom:16px
}
.brand{font-family:var(--font-display);font-weight:900;letter-spacing:-.02em;font-size:20px}
.progress-wrap{display:flex;align-items:center;gap:10px}
.progress-text{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.progress-track{width:150px;height:6px;background:#d7cebf;border-radius:var(--r);overflow:hidden}
.progress-fill{height:100%;background:var(--blue);transition:width .35s ease}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}
.stage{background:rgba(251,248,241,.98);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scene{padding:clamp(18px,3.4vw,34px)}

/* ---------- 사이드바 : 확장된 시야의 누적 기록 ---------- */
.sidebar{display:flex;flex-direction:column;gap:12px}
.sidecard{background:rgba(251,248,241,.96);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.side-title{font-size:12px;color:var(--red);font-weight:900;letter-spacing:.08em;margin-bottom:8px}
.side-main{font-weight:700;line-height:1.5;font-size:14px}
.evidence-list{display:grid;gap:8px;margin-top:10px}
.evidence{
  padding:9px 10px;border-radius:var(--r);background:#f3eee4;border:1px solid #ddd2c0;
  font-size:12.5px;color:#4e4941;line-height:1.5
}
.evidence strong{font-size:12.5px}
.evidence.locked{opacity:.42}

/* ---------- 타이포 ---------- */
.kicker{font-size:12.5px;color:var(--red);font-weight:900;letter-spacing:.08em}
h1,h2{font-family:var(--font-display);line-height:1.24;letter-spacing:-.03em}
h1{font-size:clamp(27px,4.6vw,42px);margin:8px 0 18px}
h2{font-size:clamp(23px,3.4vw,32px);margin:8px 0 16px}
.lead{font-size:16.5px;line-height:1.75}
.small{font-size:12.5px;color:var(--muted);line-height:1.6}

.photo,.mapimg{width:100%;display:block;border-radius:var(--r);border:1px solid var(--line);background:#ddd}
.photo{object-fit:cover}
.photo.hero{aspect-ratio:16/10}
.photo.close{aspect-ratio:16/10;object-position:center 45%}
.mapimg{background:#dde8ea}
.figure{margin:0}
.caption{font-size:12px;color:var(--muted);padding:8px 2px 0;line-height:1.5}

.question{
  margin:24px 0 12px;padding-left:13px;border-left:3px solid var(--blue);
  font-weight:900;font-size:18px;line-height:1.5
}

/* ---------- 선택지 : 판단형 — 정오 암시 색상 사용하지 않음 ---------- */
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.opt,.invest,.obs{
  border:1px solid var(--line);border-radius:var(--r);background:var(--white);color:var(--ink);
  text-align:left;padding:14px 15px;min-height:48px;cursor:pointer;font-weight:700;
  line-height:1.5;transition:border-color .2s, background .2s, transform .15s
}
.opt:hover,.invest:hover,.obs:hover{border-color:#8f826e;transform:translateX(3px)}
.opt:focus-visible,.invest:focus-visible,.obs:focus-visible,.tag:focus-visible,.btn:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px
}
.opt.sel,.invest.sel,.obs.sel{border:2px solid var(--blue);padding:13px 14px;background:#edf3f8}

.investigation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.invest strong{display:block;margin-bottom:5px;font-size:15.5px}
.invest{font-weight:500;font-size:14px}
.invest.sel{padding:13px 14px}
.obs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{
  border:1px solid #221f1a;border-radius:var(--r);padding:12px 18px;background:#26221d;color:#fff;
  cursor:pointer;font-weight:900;min-height:48px;
  transition:transform .15s ease, box-shadow .15s ease
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(50,40,25,.25)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.36;cursor:not-allowed}

/* ---------- 결과·해설 블록 ---------- */
.feedback{
  display:none;margin-top:13px;padding:14px 15px;border-radius:var(--r);
  background:#f0ece2;border-left:3px solid var(--blue);line-height:1.7
}
.feedback.show{display:block;animation:scene-in .35s ease}
.reveal{
  margin-top:16px;padding:15px;border:1px solid var(--line);border-radius:var(--r);background:#f6f1e8;
  animation:scene-in .35s ease
}
.reveal p{line-height:1.75;margin:8px 0 0}
.reveal img{margin-top:11px}
.ribbon{
  display:inline-block;background:#e7ded0;border:1px solid #cbbfac;border-radius:var(--r);
  padding:4px 9px;font-size:11.5px;font-weight:900;color:#4f493f;letter-spacing:.04em
}
.source{
  margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted);line-height:1.65
}
.grade{
  display:inline-block;background:var(--blue);color:#fff;border-radius:var(--r);
  padding:2px 7px;font-size:11px;font-weight:900;margin-right:6px
}

/* ---------- S5 지도 오버레이 : 이미지 좌표계와 1:1 정렬 ---------- */
.map-figure{position:relative;width:100%;max-width:700px;margin:0 auto;aspect-ratio:1696/1303}
.map-figure img{width:100%;height:100%;display:block;border-radius:var(--r);border:1px solid var(--line)}
.map-overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.route-overlay{opacity:0;transition:opacity .45s ease}
.route-overlay.show{opacity:1}
.base-label{font-family:'Noto Sans KR',sans-serif;font-size:34px;font-weight:900;fill:#1d4875}
.base-small{font-family:'Noto Sans KR',sans-serif;font-size:25px;font-weight:700;fill:#6b655c}

/* ---------- S6 ---------- */
.tags{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.tag{
  padding:11px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--white);
  cursor:pointer;font-weight:700;min-height:48px;transition:background .2s, border-color .2s
}
.tag.sel{background:#e7eef6;color:var(--blue);border-color:var(--blue);font-weight:900}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.panel{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:#f7f2e9;line-height:1.65}
.panel strong{display:block;margin-bottom:7px;font-size:13px;color:var(--red);letter-spacing:.04em}
textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--r);padding:12px;
  background:#fffdf8;resize:vertical;line-height:1.65;color:var(--ink)
}
#finalText{min-height:104px}
#comment{min-height:56px}
.hint{font-size:12.5px;color:var(--muted);margin-top:7px}

.final-card{padding:18px;border-radius:var(--r);background:#f1ece2;border:1px solid var(--line);margin-top:20px;animation:scene-in .4s ease}
.closing{font-family:var(--font-display);font-weight:900;font-size:19px;margin:16px 0 0}
.credits{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}
.copyright{margin-top:14px;font-size:11.5px;color:rgba(120,100,80,0.4)}

/* ---------- 툴팁 ---------- */
.tt{
  border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;
  border-bottom:1px dashed var(--red);cursor:help;font-weight:inherit
}
#tt-bubble{
  position:absolute;z-index:60;max-width:250px;display:none;
  background:#26221d;color:#f5efe3;padding:9px 11px;border-radius:var(--r);
  font-size:13px;line-height:1.55;box-shadow:0 6px 18px rgba(40,32,20,.3)
}
#tt-bubble.show{display:block}

@keyframes scene-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.scene-enter{animation:scene-in .4s ease}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

@media(max-width:920px){
  .layout{grid-template-columns:1fr}
  .sidebar{order:-1}
  .investigation-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  .options,.compare,.obs-grid{grid-template-columns:1fr}
  .scene{padding:18px 14px}
  .progress-track{width:96px}
  .brand{font-size:17px}
  .question{font-size:17px}
  .lead{font-size:16px}
}
@media(max-width:380px){
  .app{padding:12px 10px 32px}
  .progress-track{width:64px}
  .brand{font-size:15.5px}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">알뜨르: 지도를 넓혀라</div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
      <div class="progress-text" id="ptext">1 / 6</div>
    </div>
  </header>

  <div class="layout">
    <main class="stage">
      <section class="scene" id="scene" aria-live="polite"></section>
    </main>
    <aside class="sidebar">
      <div class="sidecard">
        <div class="side-title">나의 현재 설명</div>
        <div class="side-main" id="hypView">아직 첫 가설을 고르지 않았습니다.</div>
      </div>
      <div class="sidecard">
        <div class="side-title">확인한 단서</div>
        <div class="evidence-list" id="evidenceView"></div>
      </div>
    </aside>
  </div>
</div>

<div id="tt-bubble" role="tooltip"></div>

<script>
/* =========================================================================
   알뜨르: 지도를 넓혀라
   DESIGN_LOCK v1.0 (2026-08-22) 기준 정식 구현
   ========================================================================= */

window.GAME_CONFIG = {
  game_id: 'altteure1937',
  label: '알뜨르: 지도를 넓혀라',
  era: '일제강점기',
  version: '1.0'
};

window.CHARLIE_CONFIG = {
  supabaseUrl: 'https://xgniwztlrakkrbzcfklb.supabase.co',
  supabasePublishableKey: 'sb_publishable_mYZObIGh4nOLKqfnjXHsow_eIARb5U9'
};

/* -------------------------------------------------------------------------
   이번 통합에서는 전달 패키지의 검토된 자산을 그대로 사용한다.
   확인되지 않은 출처·권리 정보는 CREDITS에 새로 단정하지 않는다.
   ------------------------------------------------------------------------- */
const ASSETS = {
  site:     'assets/photo-site.jpg',
  close:    'assets/photo-close.jpg',
  locator:  'assets/locator.jpg',
  aerial:   'assets/aerial.jpg',
  jeju:     'assets/jeju.png',
  eastasia: 'assets/eastasia.png'
};

const CREDITS = {
  photo:  '현장 사진 — 대한민국역사박물관 근현대사아카이브 (공공누리 제1유형). 자료명·자료번호 확정 예정.',
  aerial: '항공·위성 자료 — 사용 권리 확인 예정.',
  maps:   '제주도·동아시아 개략도 — 자체 제작.',
  source: '사료 — 조성윤, 「알뜨르 비행장; 일본 해군의 제주도 항공기지 건설 과정」, 『탐라문화』 41, 2012.'
};

/* ---------------- Supabase 저장 계약 (프로젝트 지침 v3 신규 표준) ---------------- */
function publicHeaders(extra){
  const key = window.CHARLIE_CONFIG.supabasePublishableKey || '';
  const headers = Object.assign({ apikey: key }, extra || {});
  // publishable/secret 키는 Bearer 헤더에 넣을 수 없다. JWT 형식(레거시)일 때만 부착.
  if (key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + key;
  return headers;
}

function sendToSupabase(choiceData, comment){
  const url = window.CHARLIE_CONFIG.supabaseUrl;
  const key = window.CHARLIE_CONFIG.supabasePublishableKey;
  if(!url || !key || key.startsWith('__')) return Promise.resolve({ ok:false, skipped:true });
  return fetch(url + '/rest/v1/game_results', {
    method: 'POST',
    headers: publicHeaders({ 'Content-Type':'application/json', Prefer:'return=minimal' }),
    body: JSON.stringify({
      class: new URLSearchParams(location.search).get('class') || '미입력',
      game: window.GAME_CONFIG.game_id,
      choices: choiceData,
      comment: comment || '',
      timestamp: new Date().toISOString()
    })
  })
  .then(res => {
    // fetch는 401·403·500에서 reject되지 않는다 — res.ok 확인 필수.
    // UI에는 오류를 띄우지 않는다 (수업 흐름 유지).
    if(!res.ok) console.warn('[Supabase] 전송 실패 HTTP ' + res.status);
    return res;
  })
  .catch(err => {
    console.warn('[Supabase] 네트워크 전송 실패', err);
    return { ok:false, failed:true };
  });
}

/* ---------------------------- 상태 ---------------------------- */
const INITIAL_STATE = {
  step: 1,
  initialHyp: '',
  initialHypLabel: '',
  investigation: '',
  sufficiency: '',
  observation: '',
  scaleJudgment: '',
  city: '',
  cityAttempts: [],
  tags: [],
  finalText: '',
  path: [],
  submitted: false,
  commentSubmitted: false
};
function newResultId(){
  if(window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  return 'altteure1937-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
}
function freshState(){
  return Object.assign({}, INITIAL_STATE, {
    resultId: newResultId(), cityAttempts:[], tags:[], path:[]
  });
}
let state = freshState();

const CITY_LABEL = { nanjing:'난징', shanghai:'상하이', japan:'일본 서부', korea:'한반도 남부' };
const TAG_LABEL  = {
  farm:'생활·농경 공간', military:'군사시설의 흔적',
  war:'전쟁과 연결된 비행장 공간', labor:'주민의 노동이 동원된 공간'
};

const scene = document.getElementById('scene');
const hypView = document.getElementById('hypView');
const evidenceView = document.getElementById('evidenceView');

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[m]);
}

function setStep(n){
  state.step = n;
  document.getElementById('ptext').textContent = n + ' / 6';
  document.getElementById('pfill').style.width = (n/6*100) + '%';
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function addPath(label){
  if(!state.path.includes(label)) state.path.push(label);
}

/* ---------------------------- 사이드바 ---------------------------- */
function updateSidebar(){
  hypView.textContent = state.initialHypLabel || '아직 첫 가설을 고르지 않았습니다.';
  const rows = [
    ['현장 사진',      true,                          '농경지 사이에 낯선 콘크리트 구조물이 남아 있다.'],
    ['추가 관찰',      !!state.investigation,         investigationText()],
    ['위에서 본 흔적',  state.step >= 4,               '위에서 보니 길고 곧은 흔적이 넓은 공간을 가로지른다. 이곳은 과거 비행장으로 이용되었다.'],
    ['제주 전체',      state.step >= 5,               '알뜨르는 제주 남서부에 자리한다.'],
    ['기록과 동아시아', state.step >= 6 || state.city === 'nanjing',
                                                     '기록을 지도에 옮기며 알뜨르와 난징의 연결을 확인했다.']
  ];
  evidenceView.innerHTML = rows.map(r =>
    '<div class="evidence ' + (r[1] ? '' : 'locked') + '"><strong>' + r[0] + '</strong><br>' +
    (r[1] ? r[2] : '아직 확인하지 않음') + '</div>'
  ).join('');
}
function investigationText(){
  if(state.investigation === 'facility') return '가까이 보니 낮고 두꺼운 콘크리트 구조물이다.';
  if(state.investigation === 'land')     return '이 장소는 넓은 평야와 농경지 사이에 놓여 있다.';
  if(state.investigation === 'position') return '현재 위치는 모슬포항과 가깝고 제주 남서부 해안에 놓여 있다.';
  return '아직 확인하지 않음';
}

/* ---------------------------- 선택지 헬퍼 ---------------------------- */
function optHtml(items, group){
  return '<div class="options">' + items.map(it =>
    '<button type="button" class="opt" data-group="' + group + '" data-value="' + it[0] + '" aria-pressed="false">' + it[1] + '</button>'
  ).join('') + '</div>';
}
function bindOpts(group, cb){
  const nodes = document.querySelectorAll('[data-group="' + group + '"]');
  nodes.forEach(btn => btn.onclick = () => {
    nodes.forEach(b => { b.classList.remove('sel'); b.setAttribute('aria-pressed','false'); });
    btn.classList.add('sel');
    btn.setAttribute('aria-pressed','true');
    cb(btn.dataset.value, btn.textContent.trim());
  });
}

/* ---------------------------- 렌더 ---------------------------- */
function render(){
  updateSidebar();
  ({1:s1, 2:s2, 3:s3, 4:s4, 5:s5, 6:s6})[state.step]();
  scene.classList.remove('scene-enter');
  void scene.offsetWidth;
  scene.classList.add('scene-enter');
  bindTooltips();
}

/* ============================ S1 · 낯선 풍경 ============================ */
function s1(){
  scene.innerHTML = `
  <div class="kicker">S1 · 낯선 풍경</div>
  <div class="reveal" style="margin-top:12px">
    <span class="ribbon">이 활동의 주제</span>
    <p><strong>일제강점기 전쟁이 제주 지역의 공간과 사람들에게 남긴 흔적</strong>을 살펴봅니다.</p>
  </div>
  <h1>왜 밭 사이에<br>이런 구조물이 남아 있을까?</h1>
  <figure class="figure">
    <img class="photo hero" src="${ASSETS.site}" alt="농경지 사이에 둥근 콘크리트 구조물 여러 개가 흩어져 있는 들판 전경">
    <figcaption class="caption">제주 남서부, 현재 · 들판 일대 전경</figcaption>
  </figure>
  <p class="lead">아직 장소의 이름이나 용도를 설명하지 않습니다. 사진만 보고 지금 드는 생각을 하나 남겨봅니다.</p>
  <p class="question">가장 그럴듯한 첫 설명은?</p>
  ${optHtml([

      <div class="panel" style="margin-bottom:4px"><strong>새롭게 보이는 의미</strong>${esc(tagText)}</div>
      <p class="closing">같은 장소가, 이제는 다르게 보입니다.</p>

      <label for="comment" class="side-title" style="display:block;margin-top:20px">한 줄 소감 (선택)</label>
      <textarea id="comment" rows="2" placeholder="한 줄 소감을 남겨보세요. (이름·학번 제외)" maxlength="100"></textarea>

      <div class="actions">
        <button type="button" id="copyBtn" class="btn">결과 복사하기</button>
        <button type="button" id="restart2" class="btn secondary">처음부터 다시</button>
      </div>
      <div class="hint" id="copyHint"></div>

      <div class="credits">
        <strong>자료 출처</strong><br>
        ${CREDITS.source}<br>
        ${CREDITS.photo}<br>
        ${CREDITS.aerial}<br>
        ${CREDITS.maps}
      </div>
      <div class="copyright">© 찰리쌤 · hischarlie.tistory.com</div>
    </div>`;

  document.getElementById('copyBtn').onclick = onCopy;
  document.getElementById('restart2').onclick = restart;
  document.getElementById('finalWrap').scrollIntoView({ behavior:'smooth', block:'start' });
}

function onCopy(){
  const commentEl = document.getElementById('comment');
  const comment = commentEl ? commentEl.value.trim() : '';

  // ② 복사 시점에 소감이 있으면 소감 행만 별도 전송 (선택 데이터 재전송 없음)
  if(comment && !state.commentSubmitted){
    sendToSupabase({
      record_type:'comment',
      result_id:state.resultId,
      version:window.GAME_CONFIG.version
    }, comment);
    state.commentSubmitted = true;
  }

  const lines = [
    '알뜨르: 지도를 넓혀라',
    '처음 생각 — ' + (state.initialHypLabel || '선택 없음'),
    '지금의 설명 — ' + state.finalText,
    '새롭게 보이는 의미 — ' + (state.tags.map(t => TAG_LABEL[t]).join(' · ') || '선택 없음')
  ];
  if(comment) lines.push('한 줄 소감 — ' + comment);

  const hint = document.getElementById('copyHint');
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => { hint.textContent = '복사되었습니다. 패들렛이나 하이러닝에 붙여 넣으세요.'; })
    .catch(() => { hint.textContent = '복사에 실패했습니다. 위 내용을 직접 옮겨 적어주세요.'; });
}

function restart(){
  state = freshState();
  setStep(1);
}

/* ============================ 툴팁 ============================ */
const bubble = document.getElementById('tt-bubble');
let activeTip = null;

function bindTooltips(){
  document.querySelectorAll('.tt').forEach(el => {
    el.onclick = e => { e.stopPropagation(); toggleTip(el); };
  });
}
function toggleTip(el){
  if(activeTip === el){ hideTip(); return; }
  activeTip = el;
  bubble.textContent = el.dataset.tip;
  // 위치 계산 전 화면 밖에서 렌더링하여 실제 높이를 측정한다
  bubble.style.top = '-9999px';
  bubble.style.left = '0px';
  bubble.classList.add('show');

  const r = el.getBoundingClientRect();
  const h = bubble.offsetHeight;
  const w = bubble.offsetWidth;
  let left = r.left + window.scrollX + r.width/2 - w/2;
  left = Math.max(10, Math.min(left, document.documentElement.clientWidth - w - 10));
  let top = r.top + window.scrollY - h - 9;
  if(top < window.scrollY + 4) top = r.bottom + window.scrollY + 9;

  bubble.style.left = left + 'px';
  bubble.style.top = top + 'px';
}
function hideTip(){
  bubble.classList.remove('show');
  activeTip = null;
}
document.addEventListener('click', hideTip);
window.addEventListener('scroll', hideTip, { passive:true });
window.addEventListener('resize', hideTip);
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideTip(); });

/* ============================ 시작 ============================ */
setStep(1);
</script>
