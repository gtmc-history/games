function refreshGlobal(){const names=['기록 접수','배경 복원','문서 복원','시민 기록','복원 기록철'];$('stepBadge').textContent=`${state.scene}/5 · ${names[state.scene-1]}`;const b=$('classBadge');b.textContent='수업 반: '+classInfo.value+(classInfo.corrected?' · 반 링크 표기 보정':classInfo.warning?' ⚠️':'');b.className='tag'+(classInfo.warning?' warn':'');const r=$('ribbon');const vals=[['① 배경',state.archive.background],['② 발포·무장·검열',state.archive.actor_sequence],['③ 시민 생활',state.archive.citizen_context]];const restoredMask=vals.reduce((mask,[,value],i)=>mask|(value?1<<i:0),0);r.innerHTML=vals.map(([title,value],i)=>`<div class="ribbon-cell ${value?'complete':''} ${previousRestoredMask!==null&&value&&!(previousRestoredMask&(1<<i))?'just-restored':''}"><b>${title} ${value?'✓':''}</b><small>${value?'근거가 연결됐습니다':'아직 복원 전'}</small></div>`).join('');previousRestoredMask=restoredMask;const stageKey=state.scene+':'+(state.scene===4?state.cStage:1);const hero=$('sceneHero');hero.dataset.scene=String(state.scene);hero.dataset.cStep=String(state.cStage||1);hero.classList.toggle('hero-complete',Boolean((state.scene===2&&state.archive.background)||(state.scene===3&&state.archive.actor_sequence)||(state.scene===4&&state.archive.citizen_context)));hero.querySelectorAll('[data-art-scene]').forEach(g=>g.classList.toggle('is-current',Number(g.dataset.artScene)===state.scene));if(previousVisualStage!==null&&previousVisualStage!==stageKey){hero.classList.remove('scene-arrival');void hero.offsetWidth;hero.classList.add('scene-arrival')}previousVisualStage=stageKey;const briefs=[['ARCHIVE DESK / EP.02','1980: 광주의 기록을 복원하라','1980년 5월의 기록에는 서로 다른 설명이 남았습니다. 누가 무엇을 기록하고 빠뜨렸는지 자료를 대조해 복원하세요.'],['MISSION A / BACKGROUND','광주의 5월은 어디서 시작됐나','5월 이전의 맥락이 지워진 일지를 복원해 보세요. 세 사건을 잇고 두 왜곡 설명을 제외한 뒤, 근거를 연결하세요.'],['MISSION B / CENSORED TEXT',"'충돌'이라는 말에 가려진 순서",'‘충돌’이라는 말만 남은 원고에서 누가 발포했는지, 시민군의 본격적 무장은 언제 이어졌는지, 검열이 어떻게 기록을 가렸는지 확인하세요.'],['MISSION C / EVIDENCE', '기록에서 사라진 광주의 일상','같은 1980년 5월에도 계엄사와 시민 측이 남긴 기록은 달랐습니다. 기록이 말한 것과 말하지 않은 것을 구별해 광주의 모습을 복원하세요.'],['EPILOGUE / ARCHIVE RESTORED','처음 기록과 내가 복원한 기록을 비교하세요','이제 처음 훼손된 세 문장과, 자료를 연결해 복원한 기록을 나란히 보세요. 복원 전과 같은 질문에도 다시 답해 주세요.']];const brief=briefs[state.scene-1];$('heroEyebrow').textContent=brief[0];$('heroTitle').textContent=brief[1];$('heroText').textContent=brief[2];setMessage(renderMessage,renderMessageKind);}
function orderQuestion(kind){const v=kind==='before'?state.pre:state.post;return `<fieldset style="border:0;padding:0;margin:0"><legend class="prompt">${ORDER_QUESTION}</legend><div class="button-grid" style="margin:13px 0">${ORDER_OPTIONS.map(o=>`<button type="button" class="choice ${v===o.id?'selected':''}" data-order-kind="${kind}" data-order="${o.id}" aria-pressed="${v===o.id}">${o.label}</button>`).join('')}</div></fieldset>`;}
function sourceTag(type){return type==='claim'?'<span class="tag claim">당시 권력의 주장</span>':type==='later'?'<span class="tag later">후대 해설</span>':'<span class="tag">동시대 자료</span>';}
function sourceCards(ids,active,selector){return ids.map(id=>{const s=SOURCES[id],isActive=id===active;return `<div class="source-item ${isActive?'source-focus':''}">${sourceTag(s.type)} <span class="eyebrow">${id}</span><h3>${escapeHTML(s.title)}</h3><div class="meta">${escapeHTML(s.meta)}</div><p>${escapeHTML(s.short)}</p><div class="source-actions"><button type="button" class="tiny ${isActive?'selected':''}" data-source-select="${id}" data-source-mode="${selector}">${selector==='A'?'근거칩 선택':selector==='B'?'이 근거 연결':selector==='C1'?'역할 연결에 사용':'보드에 연결'}</button><button type="button" class="tiny secondary" data-open="${id}">안전 요약 더 보기</button></div>${state[selector==='A'?'a':selector==='B'?'b':'c'].opened.includes(id)?`<p class="meta" style="margin-top:8px">${escapeHTML(s.detail)}</p>${s.url?`<p class="meta">출처: ${escapeHTML(s.meta)} (외부 사이트는 열리지 않아도 게임 진행 가능)</p>`:''}`:''}</div>`}).join('');}
function renderStart(){return `<div class="panel"><div class="panel-h"><h2>기록 복원 조사 시작</h2><span class="tag rebuild">질문 · 사전 판단</span></div><div class="panel-b"><div class="note warning">이 게임에는 1980년 5월 국가폭력과 기록 통제에 관한 역사 자료가 포함됩니다. 개인이나 가족의 경험을 말하거나 공개할 필요는 없습니다.</div>${classInfo.warning?`<div class="note warning">수업 반: 미입력 ⚠️ — ${escapeHTML(classInfo.warning)}</div>`:classInfo.corrected?'<div class="note">반 링크 표기 보정 — 인식된 수업 반을 확인하세요.</div>':''}<p class="muted">정답을 먼저 보여주지 않습니다. 지금 생각을 기록하고 다른 자료로 확인하세요.</p>${orderQuestion('before')}<div class="actions"><button type="button" class="primary" id="startButton" ${!state.pre?'disabled':''}>기록 복원 시작</button></div></div></div>`;}
function labelCard(id){const x=EVENT_CARDS.find(x=>x.id===id);return x?x.text:'비어 있음';}
function renderA(){const a=state.a;return `<div class="main-grid"><section class="panel"><div class="panel-h"><h2>사료를 조사한다</h2><span class="tag later">후대 해설</span></div><div class="panel-b">${sourceCards(['A-S1','A-S2','A-S3'],selectedSource,'A')}</div></section><section class="panel"><div class="panel-h"><h2>사건의 시간과 근거를 잇는다</h2><span class="tag rebuild">A / 세 사건과 두 왜곡</span></div><div class="panel-b"><div class="note">1. 사건 조각 선택 → 시간축/제외 칸 지정<br>2. 근거칩 선택 → 사건의 시간축 칸 누르기<br>3. 복원 결과 확인</div><div class="subhead">사건 조각 (최초 배열은 섞여 있습니다)</div><div class="button-grid">${a.deck.map(id=>`<button type="button" class="choice ${selectedCard===id?'selected':''}" data-card="${id}">${labelCard(id)} ${id.startsWith('A-D')?'<small class="tag rebuild">학습용 왜곡 설명</small>':''}</button>`).join('')}</div><div class="subhead">시간축 — 날짜는 원문 카드에서 확인합니다</div><div class="line-cards">${a.order.map((id,i)=>`<div class="line-row"><span class="slotnum">${i+1}</span><button type="button" class="slot ${id?'selected':''}" data-a-slot="${i}">${id?escapeHTML(labelCard(id)):'이곳에 사건을 배치하세요'}<p>${a.links[i]?`근거: ${a.links[i]}`:'근거 미연결'}</p></button></div>`).join('')}</div><div class="subhead">제외할 설명 두 장</div><div class="mini-grid">${a.excluded.map((id,i)=>`<button type="button" class="slot" data-a-excluded="${i}">${id?escapeHTML(labelCard(id)):'왜곡 설명 제외 칸'}</button>`).join('')}</div><div class="actions"><button class="tiny danger" id="resetA" type="button">현재 배치 초기화</button><button class="primary" id="checkA" type="button" ${a.done?'disabled':''}>기록철 ① 복원</button></div>${a.done?'<div class="status-line success">배경 기록 복원 완료 ✓</div><div class="actions"><button class="primary" id="toB">발포와 검열 기록을 복원한다</button></div>':''}</div></section></div>`;}
function renderB(){const b=state.b,blank=B_BLANKS[bActive],selected=b.answers[bActive];return `<div class="main-grid"><section class="panel"><div class="panel-h"><h2>근거를 확인하고 연결한다</h2><span class="tag">B-S1~3</span></div><div class="panel-b">${sourceCards(['B-S1','B-S2','B-S3'],null,'B')}</div></section><section class="panel"><div class="panel-h"><h2>검은 띠를 걷어내는 원고</h2><span class="tag rebuild">학습용 재구성 · 실제 기사 원본 아님</span></div><div class="panel-b"><div class="paper"><h3>「'충돌'이라는 말에 가려진 순서」</h3><p>시민군의 본격적 무장보다 먼저 확인되는 것은 <button type="button" class="tiny ${bActive===0?'selected':''}" data-blank="0">[①] ${b.answers[0].answer_id?escapeHTML(B_BLANKS[0].options.find(o=>o.id===b.answers[0].answer_id)?.label||''):''}</button>이다.</p><p>이후 시민들은 <button type="button" class="tiny ${bActive===1?'selected':''}" data-blank="1">[②] ${b.answers[1].answer_id?escapeHTML(B_BLANKS[1].options.find(o=>o.id===b.answers[1].answer_id)?.label||''):''}</button>에 나섰다.</p><p>${B_THIRD_SENTENCE.split('[③]')[0]}<button type="button" class="tiny ${bActive===2?'selected':''}" data-blank="2">[③] ${b.answers[2].answer_id?escapeHTML(B_BLANKS[2].options.find(o=>o.id===b.answers[2].answer_id)?.label||''):''}</button>${B_THIRD_SENTENCE.split('[③]')[1]}</p></div><div class="subhead">${blank.title} — 보기 선택</div><div class="button-grid">${b.optionOrders[bActive].map(id=>{const o=blank.options.find(o=>o.id===id);return `<button type="button" class="choice ${selected.answer_id===id?'selected':''}" data-b-answer="${id}">${escapeHTML(o.label)}</button>`}).join('')}</div><div class="status-line">근거칩: ${selected.source_id?selected.source_id+' 연결됨':'왼쪽에서 이 빈칸을 뒷받침하는 자료를 선택하세요.'}</div><div class="subhead">빈칸별 연결 상태</div><div class="mini-grid">${b.answers.map((x,i)=>`<div class="slot"><b>0${i+1}</b><p>${x.answer_id?'답 선택 ✓':'답 미선택'}<br>${x.source_id?'근거 '+x.source_id:'근거 미연결'}</p></div>`).join('')}</div><div class="actions"><button type="button" class="primary" id="checkB" ${b.done?'disabled':''}>원고 복원 확인</button></div>${b.done?'<div class="status-line success">계엄군의 발포와 본격적 무장, 보도 통제 기록이 복원됐습니다. ✓</div><div class="actions"><button class="primary" id="toC">시민 기록을 대조한다</button></div>':''}</div></section></div>`;}
function renderC1(){return `<div class="main-grid"><section class="panel"><div class="panel-h"><h2>당시 자료 세 장을 대조한다</h2><span class="tag">C · 1/2</span></div><div class="panel-b">${sourceCards(['C-S1','C-S2','C-S3'],cSource,'C1')}</div></section><section class="panel"><div class="panel-h"><h2>누가 무엇을 주장하거나 요구했나?</h2><span class="tag claim">당시 기록 · 검증 사실과 구분</span></div><div class="panel-b"><p class="note">왼쪽의 자료를 고른 뒤, 그 자료가 실제로 보여 주는 역할에 연결하세요. 한 당사자의 주장이 참이라는 뜻은 아닙니다.</p><div class="row-list">${C_ROLES.map(role=>{const assigned=Object.keys(state.c.roles).find(id=>state.c.roles[id]===role.id);return `<button type="button" class="slot choice ${assigned?'selected':''}" data-c-role="${role.id}"><b>${role.label}</b><p>${assigned?SOURCES[assigned].title:'이 역할에 연결할 자료 선택'}</p></button>`}).join('')}</div><div class="actions"><button class="primary" id="checkC1">다른 자료로 실제 모습을 검증하기</button></div></div></section></div>`;}
function renderC2(){const c=state.c;return `<div class="main-grid"><section class="panel"><div class="panel-h"><h2>후대의 검증 기록</h2><span class="tag later">C · 2/2</span></div><div class="panel-b">${sourceCards(['C-G1a','C-G1b','C-G1c'],cBoardSource,'C2')}<details style="margin-top:12px"><summary class="tiny">1단계에서 대조한 당시 기록 요약</summary><div class="note">${['C-S1','C-S2','C-S3'].map(id=>`<p>${id}: ${escapeHTML(SOURCES[id].short)}</p>`).join('')}</div></details></div></section><section class="panel"><div class="panel-h"><h2>기록에서 빠진 세 갈래를 복원한다</h2><span class="tag">3축 보드</span></div><div class="panel-b"><div class="note">후대 검증 카드 한 장을 선택한 뒤 해당 축을 누르세요. 세 축은 모두 복원하고, 그중 어느 축을 먼저 서술할지만 결정합니다.</div><div class="row-list">${C_AXES.map((ax,i)=>`<button type="button" class="slot choice ${c.links[ax.id]?'selected':''}" data-c-axis="${ax.id}"><b>${i+1}. ${ax.label}</b><p>${c.links[ax.id]?'근거 '+c.links[ax.id]+' 연결됨':'후대 검증 자료 연결 전'}</p></button>`).join('')}</div><p class="subhead">기록의 첫머리에 앞세울 축 (정오 점수 없음)</p><div class="mini-grid">${C_AXES.map(a=>`<button type="button" class="choice ${c.lead_axis===a.id?'selected':''}" data-lead="${a.id}">${a.label}</button>`).join('')}</div><p class="subhead">기록에서 누락된 5월의 모습을 한 문장으로 복원하세요.</p><p class="muted" style="margin:0 0 8px">시민의 행동과 군의 행동 또는 이후 변화 하나를 함께 적어 보세요. (권장 20~45자, AI 평가 없음)</p><textarea id="finalText" class="text-input" placeholder="내가 복원한 한 문장" aria-label="기록에서 누락된 5월의 모습을 한 문장으로 복원하세요.">${escapeHTML(c.finalText)}</textarea><div class="actions"><button class="tiny secondary" id="backC1">당시 기록 다시 확인</button><button class="primary" id="checkC2">기록철 ③ 복원</button></div>${c.done?'<div class="status-line success">시민 생활과 봉쇄·협상·항전에 관한 기록이 복원됐습니다. ✓</div><div class="actions"><button type="button" class="primary" id="toFinal">완성된 기록철 대조</button></div>':''}</div></section></div>`;}
function renderFinal(){const r=[state.archive.background||'',state.archive.actor_sequence||'',state.archive.citizen_context||''];return `<div class="panel"><div class="panel-h"><h2>1980년 5월, 최초 기록과 복원 기록</h2><span class="tag rebuild">학습용 훼손 사례 · 당시 원문 아님</span></div><div class="panel-b"><div class="compare"><div class="paper"><h3>처음 손상된 기록</h3><ol>${FIRST_RECORDS.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ol></div><div class="paper"><h3>근거와 함께 복원한 기록</h3><ol>${r.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ol><p class="meta">학생의 한 문장: ${escapeHTML(state.c.finalText)}</p><p class="meta">당시 자료의 주장·요구와 후대의 사실 검증을 구분했습니다.</p></div></div><div class="note" style="margin-top:16px">복원 전에 했던 질문에 다시 답해 주세요. 같은 질문·같은 보기입니다. 답변이 바뀌어도 그것만으로 학습 효과를 증명하지는 않습니다.</div>${orderQuestion('after')}<div class="actions"><button class="primary" id="finishButton" ${!state.post||state.completed_at?'disabled':''}>사후 판단 기록 완료</button></div>${state.completed_at?renderRemote():''}</div></div>`;}
function renderRemote(){let value=state.submissionStatus,msg=value==='saved'?'서버 저장 완료 ✓':value==='sending'?'서버 저장 중…':value==='failed'?'저장 여부를 확인하지 못했습니다 ⚠️ 재시도하거나 TXT 백업을 저장하세요':value==='unknown'?'저장 여부를 확인하지 못했습니다 ⚠️ 재시도하거나 TXT 백업을 저장하세요':'저장 전';return `<div class="status-line ${value==='saved'?'success':value==='sending'?'': 'error'}" id="remoteStatus" role="status" aria-live="polite">${msg}</div><div class="actions">${(value==='failed'||value==='unknown')?'<button type="button" class="primary" id="retryButton">저장 다시 시도</button>':''}<button type="button" id="backupButton">TXT 백업 저장</button><button type="button" id="copyButton">기록 내용 복사</button></div><p class="meta">저장 결과를 교사에게 보여주세요. 저장에 실패해도 기록철은 완료되며 기기에 보관됩니다. 이름과 학번은 입력하지 않습니다.</p>`;}
function render(){refreshGlobal();const app=$('app');app.innerHTML=state.scene===1?renderStart():state.scene===2?renderA():state.scene===3?renderB():state.scene===4?(state.cStage===1?renderC1():renderC2()):renderFinal();wireEvents();}
function setScene(n){switchScene(n);window.scrollTo({top:0,behavior:'instant'});}
function addUnique(arr,id){if(!arr.includes(id))arr.push(id)}
function assignA(index,isExcluded){const a=state.a;if(selectedSource&&!isExcluded){const id=a.order[index];if(!id){setMessage('근거를 연결하려면 먼저 이 칸에 사건을 배치하세요.','error');return}a.links[index]=selectedSource;selectedSource=null;persist();render();return}if(!selectedCard){setMessage('먼저 사건 조각 또는 근거칩을 선택하세요.','error');return}a.order=a.order.map(id=>id===selectedCard?null:id);a.excluded=a.excluded.map(id=>id===selectedCard?null:id);if(isExcluded){a.excluded[index]=selectedCard}else{a.order[index]=selectedCard;delete a.links[index]}selectedCard=null;a.done=false;state.archive.background=null;persist();render()}
function validA(){const a=state.a;return a.order.join('|')==='A-E1|A-E2|A-E3'&&a.excluded.includes('A-D1')&&a.excluded.includes('A-D2')&&Object.entries(a.links).filter(([i,sid])=>a.order[i]===`A-E${Number(i)+1}`&&sid===`A-S${Number(i)+1}`).length>=2;}
function checkA(){const a=state.a;if(!validA()){if(a.order.every(Boolean)&&a.excluded.every(Boolean)&&Object.values(a.links).filter(Boolean).length>=2)a.wrong++;persist();setMessage('시점과 근거를 다시 대조하세요. 사건은 정순인지, 왜곡 설명은 두 개 제외했는지, 사건마다 근거가 맞는지 확인하세요.','error');return}a.done=true;state.archive.background='신군부의 권력 장악과 5·17 비상계엄 확대 속에서 민주화 요구와 5·18 광주의 저항이 이어졌다.';persist();setMessage('기록철 ① 배경 복원 완료 ✓','success');render()}
function checkB(){const b=state.b;if(!b.answers.every((a,i)=>a.answer_id===B_BLANKS[i].correct&&a.source_id===B_BLANKS[i].source)){if(b.answers.every(x=>x.answer_id&&x.source_id))b.wrong++;persist();setMessage('이 문장을 뒷받침하는 사료 칩을 다시 연결하세요. 발포, 본격적 무장, 검열의 순서를 구별해야 합니다.','error');return}b.done=true;state.archive.actor_sequence='계엄군의 발포가 시민군의 본격적 자위적 무장보다 앞섰으며, 5·17 보도통제지침은 당시의 보도 검열을 보여 준다.';persist();setMessage('기록철 ② 원고 복원 완료 ✓','success');render()}
function checkC1(){const roles=state.c.roles;const ok=Object.keys(C_ROLE_ANSWERS).every(id=>roles[id]===C_ROLE_ANSWERS[id]);if(!ok){if(Object.keys(roles).length===3)state.c.wrong++;persist();setMessage('주장을 했다는 기록과 그 주장의 사실 여부를 구분하고, 작성일과 생산자를 확인하세요.','error');return}state.cStage=2;updateTimer();persist();setMessage('당시 기록의 역할을 확인했습니다. 후대의 검증 기록으로 세 축을 복원하세요.','success');render();window.scrollTo({top:0,behavior:'instant'})}
function checkC2(){const c=state.c;if(!$('finalText'))return;c.finalText=$('finalText').value;const ok=C_AXES.every(ax=>c.links[ax.id]===ax.source);if(!ok||!c.lead_axis||!c.finalText.trim()){if(C_AXES.every(ax=>c.links[ax.id])&&c.lead_axis&&c.finalText.trim())c.wrong++;persist();setMessage('세 축을 후대 검증 자료와 연결하고, 강조할 축과 자신의 한 문장을 남겨 주세요.','error');return}c.done=true;state.archive.citizen_context='계엄군의 외곽 봉쇄 속에서도 시민들은 자치와 나눔을 이어갔고, 협상·항전의 고민 끝에 5·27 계엄군이 다시 진압했다.';persist();setMessage('기록철 ③ 시민의 생활과 이후 진압 복원 완료 ✓','success');render()}
function sourceOpened(id){const scope=id.startsWith('A-')?state.a:id.startsWith('B-')?state.b:state.c;addUnique(scope.opened,id);persist();render()}
function collectMission(id,scope){const c=state[scope];let mechanic_output=null,accuracy_flags={};if(scope==='a'){mechanic_output={ordered_event_ids:[...c.order],excluded_distractor_ids:[...c.excluded],evidence_links:Object.entries(c.links).filter(([_,v])=>v).map(([i,sid])=>({source_id:sid,target_id:c.order[i]}))};accuracy_flags={chronology_correct:c.order.join('|')==='A-E1|A-E2|A-E3',distractor_avoided:c.excluded.includes('A-D1')&&c.excluded.includes('A-D2'),evidence_supported:validA()}}else if(scope==='b'){mechanic_output={blanks:Object.fromEntries(c.answers.map((a,i)=>[B_BLANKS[i].id,{answer_id:a.answer_id,source_id:a.source_id}]))};accuracy_flags={actor_restored:c.answers[0].answer_id===B_BLANKS[0].correct,sequence_correct:c.answers[1].answer_id===B_BLANKS[1].correct,censorship_identified:c.answers[2].answer_id===B_BLANKS[2].correct}}else{mechanic_output={claim_comparison:['C-S1','C-S2','C-S3'].map(sid=>({source_id:sid,role:c.roles[sid]})),board_links:{citizen_self_government:[{source_id:c.links.citizen_self_government,role:'verified_context'}],military_blockade:[{source_id:c.links.military_blockade,role:'verified_context'}],negotiation_resistance_suppression:[{source_id:c.links.negotiation_resistance_suppression,role:'verified_context'}]},lead_axis:c.lead_axis};accuracy_flags={source_roles_distinguished:Object.keys(C_ROLE_ANSWERS).every(key=>c.roles[key]===C_ROLE_ANSWERS[key]),three_axes_supported:C_AXES.every(ax=>c.links[ax.id]===ax.source)}}const cited=scope==='a'?Object.values(c.links):scope==='b'?c.answers.map(x=>x.source_id):Object.values(c.roles).length?[...Object.keys(c.roles),...Object.values(c.links)]:Object.values(c.links);return {id,duration_sec:Math.max(0,Math.round(state.duration[id])),wrong_attempts:c.wrong,opened_source_ids:[...c.opened],cited_source_ids:[...new Set(cited.filter(Boolean))],mechanic_output,accuracy_flags};}
function buildPayload(){
  return {class:state.className,game: 'democracy-1980',timestamp:state.completed_at,
    choices:{version:'1.2.0',result_id:state.resultId,record_type:'result',mode:'archive-reconstruction',question_id:'ORDER-01',evidence_version:EVIDENCE_VERSION,started_at:state.started_at,completed_at:state.completed_at,pre_post:{before:state.pre,after:state.post},missions:[collectMission('A','a'),collectMission('B','b'),collectMission('C','c')],final_reconstruction_text:state.c.finalText.trim()},comment:''};
}
async function attemptSave(){
  if(state.scene!==5||!state.completed_at||state.submissionStatus==='saved'||savingPromise)return;
  const payload=state.snapshotPayload||buildPayload();state.snapshotPayload=payload;
  state.submissionStatus='sending';persist();render();
  const request=Promise.resolve().then(async()=>{
    try{
      if(navigator.onLine===false)throw new Error('offline');
      const response=await fetch(RESULTS_URL,{method:'POST',headers:{apikey:RESULTS_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload),keepalive:true});
      if(!response.ok)throw new Error('HTTP '+response.status);
      state.submissionStatus='saved';
    }catch(e){state.submissionStatus=e&&e.message==='offline'?'failed':'unknown'}
  });
  savingPromise=request;
  try{await request}finally{savingPromise=null;persist();render()}
}
function finish(){if(state.completed_at||!state.post)return;updateTimer();if(!state.a.done||!state.b.done||!state.c.done){setMessage('아직 복원하지 않은 기록이 있습니다.','error');return}state.completed_at=new Date().toISOString();state.snapshotPayload=buildPayload();persist();render();void attemptSave()}
function backupText(){const payload=state.snapshotPayload||buildPayload();const m=payload.choices.missions;return ['1980: 광주의 기록을 복원하라 — 내 복원 기록철','수업 반: '+payload.class,'저장 확인: '+state.submissionStatus,'결과 ID: '+payload.choices.result_id,'','처음 받은 기록:',...FIRST_RECORDS.map((v,i)=>`${i+1}. ${v}`),'','복원한 기록:',state.archive.background,state.archive.actor_sequence,state.archive.citizen_context,'','나의 한 문장: '+state.c.finalText,'사전 판단: '+state.pre,'사후 판단: '+state.post,'','연결한 근거 ID:',...m.map(x=>x.id+': '+x.cited_source_ids.join(', ')),'','서버 저장 상태는 화면의 실제 성공 응답으로 확인해야 합니다.'].join('\n')}
function backup(){const blob=new Blob([backupText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='1980_광주의_기록_백업_'+(state.className||'미입력')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);setMessage('TXT 백업 저장을 요청했습니다.','success')}
async function copyBackup(){const s=backupText();try{if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(s);else{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}setMessage('기록 내용을 복사했습니다.','success')}catch(e){setMessage('복사에 실패했습니다. TXT 백업을 이용하세요.','error')}}
function wireEvents(){document.querySelectorAll('[data-order]').forEach(el=>el.onclick=()=>{const key=el.dataset.orderKind;if(key==='before')state.pre=el.dataset.order;else state.post=el.dataset.order;persist();render()});const start=$('startButton');if(start)start.onclick=()=>{state.started_at=new Date().toISOString();persist();setScene(2)};
 document.querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>{selectedSource=null;selectedCard=el.dataset.card;setMessage('선택한 조각을 배치할 시간축 또는 제외 칸을 누르세요.');render()});
 document.querySelectorAll('[data-a-slot]').forEach(el=>el.onclick=()=>assignA(Number(el.dataset.aSlot),false));document.querySelectorAll('[data-a-excluded]').forEach(el=>el.onclick=()=>assignA(Number(el.dataset.aExcluded),true));
 document.querySelectorAll('[data-source-select]').forEach(el=>el.onclick=()=>{const id=el.dataset.sourceSelect,mode=el.dataset.sourceMode;if(mode==='A'){selectedSource=id;selectedCard=null;setMessage('근거칩 선택됨: 연결할 사건의 시간축 칸을 누르세요.');render()}else if(mode==='B'){state.b.answers[bActive].source_id=id;addUnique(state.b.cited||[],id);persist();render()}else if(mode==='C1'){cSource=id;render()}else if(mode==='C2'){cBoardSource=id;render()}});
 document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>sourceOpened(el.dataset.open));
 document.querySelectorAll('[data-b-answer]').forEach(el=>el.onclick=()=>{state.b.answers[bActive].answer_id=el.dataset.bAnswer;persist();render()});document.querySelectorAll('[data-blank]').forEach(el=>el.onclick=()=>{bActive=Number(el.dataset.blank);render()});
 document.querySelectorAll('[data-c-role]').forEach(el=>el.onclick=()=>{if(!cSource){setMessage('먼저 왼쪽 당대 기록 중 하나를 선택하세요.','error');return}state.c.roles[cSource]=el.dataset.cRole;addUnique(state.c.cited||[],cSource);cSource=null;persist();render()});
 document.querySelectorAll('[data-c-axis]').forEach(el=>el.onclick=()=>{if(!cBoardSource){setMessage('먼저 후대 검증 카드 하나를 선택하세요.','error');return}state.c.links[el.dataset.cAxis]=cBoardSource;addUnique(state.c.cited||[],cBoardSource);cBoardSource=null;persist();render()});
 document.querySelectorAll('[data-lead]').forEach(el=>el.onclick=()=>{state.c.lead_axis=el.dataset.lead;persist();render()});const text=$('finalText');if(text)text.oninput=()=>{state.c.finalText=text.value;persist()};
 const back=$('backC1');if(back)back.onclick=()=>{updateTimer();state.cStage=1;persist();render()};
 for(const [id,cb] of [['checkA',checkA],['checkB',checkB],['checkC1',checkC1],['checkC2',checkC2],['resetA',()=>{state.a.order=[null,null,null];state.a.excluded=[null,null];state.a.links={};selectedCard=null;selectedSource=null;persist();render()}],['toB',()=>setScene(3)],['toC',()=>setScene(4)],['toFinal',()=>setScene(5)],['finishButton',finish],['retryButton',()=>void attemptSave()],['backupButton',backup],['copyButton',()=>void copyBackup()]]){const el=$(id);if(el)el.onclick=cb}
}
function startNew(){state=freshState();showResume=false;selectedCard=null;selectedSource=null;bActive=0;cSource=null;cBoardSource=null;persist();render();resumeTimer()}
function initial(){if(showResume){state=freshState();refreshGlobal();$('app').innerHTML=`<div class="panel"><div class="panel-h"><h2>기기에 남은 1980 기록이 있습니다</h2></div><div class="panel-b">${stored.className!==classInfo.value?`<div class="note warning">이전 기록의 반(${escapeHTML(stored.className)})과 현재 링크의 반(${escapeHTML(classInfo.value)})이 달라 자동 이어하기를 하지 않습니다. 선생님께 링크를 확인하세요.</div>`:'<div class="note">이전 기록을 이어하거나 새 기록을 시작할 수 있습니다.</div>'}${classInfo.warning?`<div class="note warning">수업 반: 미입력 ⚠️ — ${escapeHTML(classInfo.warning)}</div>`:''}<div class="actions">${stored.className===classInfo.value?'<button class="primary" id="resumeButton">이어하기</button>':''}<button id="newButton">새 기록 시작</button></div></div></div>`;const re=$('resumeButton');if(re)re.onclick=()=>{state=stored;showResume=false;if(state.submissionStatus==='sending')state.submissionStatus='unknown';render();resumeTimer()};$('newButton').onclick=()=>startNew();return}startNew()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){tick();if(state)persist()}else resumeTimer()});window.addEventListener('pagehide',()=>{tick();if(state)persist()});window.addEventListener('focus',()=>{if(!runningSince)resumeTimer()});window.addEventListener('blur',()=>{tick();if(state)persist()});
initial();
</script>
</body>
