<html lang="ko">

<style>
:root{
  --color-bg:#f0ece4; --color-surface:#e8e0d4; --color-primary:#003087; --color-accent:#cd2e3a;
  --color-text:#1a1a1a; --color-sepia:#8b7355; --color-ink:#3b3128; --color-line:#c9bda9;
  --font-display:'Black Han Sans',sans-serif; --font-body:'Noto Sans KR',sans-serif; --font-doc:'Gowun Batang',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:16px;line-height:1.6}
body{background-image:
  radial-gradient(rgba(139,115,85,.08) 1px,transparent 1px),
  radial-gradient(rgba(139,115,85,.05) 1px,transparent 1px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
#app{max-width:900px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--color-line)}
.hdr-title{font-family:var(--font-display);font-size:20px;color:var(--color-primary);letter-spacing:.5px}
.hdr-prog{font-size:14px;color:var(--color-sepia);font-variant-numeric:tabular-nums}
main{flex:1;padding:16px}
.scene{animation:scene-in .4s ease forwards}
@keyframes scene-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-family:var(--font-doc);font-size:15px;color:var(--color-accent);letter-spacing:2px;margin-bottom:4px}
h1,h2{font-family:var(--font-display);font-weight:400;line-height:1.25}
h1{font-size:34px;color:var(--color-primary)}
h2{font-size:26px;color:var(--color-primary);margin-bottom:12px}
.prompt{font-family:var(--font-doc);font-size:18px;color:var(--color-ink);margin:8px 0 20px;line-height:1.7}
.notice{border-top:1px solid var(--color-line);border-bottom:1px solid var(--color-line);padding:10px 0;margin:16px 0;font-size:15px;color:var(--color-sepia)}
.condcard{background:var(--color-surface);border:1px solid var(--color-line);border-radius:4px;padding:14px 16px;margin:16px 0}
.condcard .lbl{font-family:var(--font-display);font-size:15px;color:var(--color-accent);margin-bottom:6px}
.condcard ul{list-style:none}
.condcard li{padding:4px 0 4px 14px;position:relative;font-size:16px}
.condcard li::before{content:"";position:absolute;left:0;top:14px;width:6px;height:6px;background:var(--color-primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border:2px solid var(--color-primary);background:var(--color-primary);color:#fff;font-family:var(--font-body);font-weight:700;font-size:17px;border-radius:4px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.ghost{background:transparent;color:var(--color-primary)}
.btn:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-card{display:block;width:100%;text-align:left;min-height:56px;padding:14px 16px;background:var(--color-surface);border:1px solid var(--color-line);border-left:3px solid transparent;border-radius:4px;font-family:var(--font-body);font-size:17px;color:var(--color-text);cursor:pointer;transition:border-color .2s,background .2s,transform .15s;line-height:1.5}
.choice-card:hover{border-left-color:var(--color-primary);background:#efe8dc;transform:translateX(4px)}
.choice-card:focus-visible{outline:3px solid var(--color-accent)}
.choice-card.selected{border-left-color:var(--color-accent);background:#e9dfcf;font-weight:700}
.choice-card:disabled{cursor:default;opacity:.55;transform:none}
.choice-card.selected:disabled{opacity:1}
.result{margin-top:16px;animation:slide-in .35s ease forwards}
@keyframes slide-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.rec{font-family:var(--font-doc);background:#f7f2ea;border:1px solid var(--color-line);border-left:4px solid var(--color-sepia);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.rec .tag{display:inline-block;font-family:var(--font-body);font-size:12px;letter-spacing:1px;color:#fff;background:var(--color-sepia);padding:1px 7px;border-radius:2px;margin-right:6px;vertical-align:middle}
.rec .grade{font-family:var(--font-body);font-size:12px;color:var(--color-sepia);margin-left:6px}
.rec p{font-size:16px;color:var(--color-ink);margin-top:4px}
.think{border:1px dashed var(--color-line);border-radius:4px;padding:10px 14px;font-size:15px;color:var(--color-sepia)}
.think .lbl{font-weight:700;color:var(--color-ink);margin-right:6px}
.lead{font-family:var(--font-doc);font-size:17px;color:var(--color-sepia);border-left:2px solid var(--color-line);padding-left:12px;margin:4px 0 16px;line-height:1.7}
.you{font-family:var(--font-doc);font-size:17px;color:var(--color-ink);padding:6px 0 12px}
.you .lbl{font-family:var(--font-display);font-size:15px;color:var(--color-primary);display:block;margin-bottom:2px}
.intermission{padding:24px 0 8px}
.intermission p{font-family:var(--font-doc);font-size:19px;color:var(--color-ink);line-height:1.8;margin-bottom:12px}
.intermission h2{font-size:30px}
.track{list-style:none;margin:8px 0 16px}
.track li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--color-line);font-size:15px}
.track .d{font-family:var(--font-doc);color:var(--color-accent)}
.pattern{background:var(--color-primary);color:#fff;border-radius:4px;padding:14px 16px;margin:12px 0 20px}
.pattern .lbl{font-family:var(--font-display);font-size:15px;opacity:.85;margin-bottom:4px}
.pattern p{font-size:17px}
.myeon{border:1px solid var(--color-line);border-radius:4px;background:#f7f2ea;padding:14px 16px;margin-bottom:12px}
.myeon h3{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--color-primary);margin-bottom:6px}
.myeon p{font-family:var(--font-doc);font-size:16px;color:var(--color-ink);margin-bottom:4px}
.myeon .src{font-family:var(--font-body);font-size:13px;color:var(--color-sepia)}
.numbers{border-top:2px solid var(--color-primary);border-bottom:2px solid var(--color-primary);padding:14px 0;margin:20px 0}
.numbers .big{font-family:var(--font-display);font-size:30px;color:var(--color-primary);line-height:1.2}
.numbers .q{font-family:var(--font-doc);font-size:17px;color:var(--color-accent);margin-top:8px}
.stats{margin:16px 0}
.stats .bar{display:grid;grid-template-columns:1fr 60px;gap:8px;align-items:center;font-size:15px;margin:4px 0}
.stats .bar i{display:block;height:10px;background:var(--color-primary);border-radius:2px}
.stats .muted{color:var(--color-sepia);font-size:14px}
textarea{width:100%;font-family:var(--font-body);font-size:16px;padding:10px;border:1px solid var(--color-line);border-radius:4px;background:#fff;resize:vertical}
.copyright{text-align:center;font-size:12px;color:rgba(120,100,80,0.4);margin-top:28px}
.toast{font-size:14px;color:var(--color-primary);margin-left:8px}
/* tooltip */
.tt{border-bottom:1px dotted var(--color-accent);cursor:help;color:var(--color-primary)}
#tt-bubble{position:fixed;top:-9999px;left:0;max-width:280px;background:#1a1a1a;color:#f0ece4;font-size:14px;line-height:1.5;padding:8px 12px;border-radius:4px;z-index:99;opacity:0;pointer-events:none;transition:opacity .15s}
#tt-bubble.show{opacity:1}
/* map */
.map{background:#f7f2ea;border:1px solid var(--color-line);border-radius:4px;padding:8px;margin:12px 0}
.map svg{width:100%;height:auto;display:block}
.region{fill:#e1d6c2;stroke:var(--color-sepia);stroke-width:1.5;transition:fill .8s,stroke .8s}
.now .region{fill:#dfe4ee;stroke:var(--color-primary)}
.lbl-old,.lbl-now{font-family:'Black Han Sans',sans-serif;font-size:20px;transition:opacity .8s}
.lbl-old{fill:var(--color-ink)}.lbl-now{fill:var(--color-primary);opacity:0}
.now .lbl-old{opacity:0}.now .lbl-now{opacity:1}
.sub{font-family:'Noto Sans KR',sans-serif;font-size:12px;fill:var(--color-sepia)}
.river{fill:none;stroke:#7a9bb5;stroke-width:2;stroke-dasharray:4 3}
.mapnote{font-size:13px;color:var(--color-sepia);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){h1{font-size:28px}h2{font-size:22px}main{padding:12px}}
</style>
</head>
<body>
<div id="app">

<script>
/* ===== 식별·연결 계약 ===== */
window.GAME_CONFIG = {
  game_id: 'jangnal1919',
  label: '장날, 1919년 3월',
  era: '일제강점기',
  version: '1.2.1',        // 게임 릴리스 (연출 패치 포함)
  schema_version: '1.2',   // choices 구조 = DESIGN_LOCK v1.2
  scenes: ['s1_inform','s2_prep','s3_when','s4_where','s5_next'],
  axes: ['net_axis','space_axis']
};
window.CHARLIE_CONFIG = {
  supabaseUrl: 'https://xgniwztlrakkrbzcfklb.supabase.co',
  supabasePublishableKey: 'sb_publishable_mYZObIGh4nOLKqfnjXHsow_eIARb5U9'
};
/* 반 통계: game_results는 anon INSERT only. 집계 엔드포인트(Edge Function/RPC) 확정 전까지 빈 값 유지 → 버튼 미표시 */
const STATS_ENDPOINT = '';
function publicHeaders(extra){
  const key = window.CHARLIE_CONFIG.supabasePublishableKey || '';
  const headers = { apikey: key, ...(extra || {}) };
  if (key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + key;
  return headers;
}
const CLASS = new URLSearchParams(location.search).get('class') || '미입력';
function sendToSupabase(choiceData, comment){
  const { supabaseUrl: url, supabasePublishableKey: key } = window.CHARLIE_CONFIG;
  if (!url || !key || key.startsWith('__')) return Promise.resolve({ ok:false, skipped:true });
  return fetch(url + '/rest/v1/game_results', {
    method: 'POST',
    headers: publicHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
    body: JSON.stringify({
      class: CLASS, game: window.GAME_CONFIG.game_id,
      choices: choiceData, comment: comment || '', timestamp: new Date().toISOString()
    })
  }).then(res => { if (!res.ok) console.warn('[Supabase] 전송 실패 HTTP ' + res.status); return res; })
    .catch(err => { console.warn('[Supabase] 네트워크 전송 실패', err); return { ok:false, failed:true }; });
}

/* ===== 툴팁 ===== */
const TERMS = {
  '면장': '면장(面長) — 총독부 지방 행정 말단인 면의 책임자',
  '면사무소': '면사무소(面事務所) — 부역·세금 등을 처리한 면의 관청',
  '주재소': '헌병주재소(憲兵駐在所) — 헌병경찰이 상주한 지방 치안 기관',
  '헌병': '헌병(憲兵) — 1910년대 경찰 업무까지 맡은 일본 군 경찰',
  '보안법': '보안법(保安法) — 집회·언동을 처벌한 1907년 법',
  '인산': '인산(因山) — 왕·황제의 장례',
  '봉화': '봉화(烽火) — 산 위에 불을 올려 멀리 알리는 신호',
  '장날': '장날 — 5일마다 서는 정기 시장이 열리는 날',
  '조선독립신문': '조선독립신문 — 3·1 직후 비밀리에 발행된 지하 신문',
  '부역': '부역(賦役) — 관청이 주민에게 시킨 무보수 노동'
};
/* [[용어]] 마커를 DOM으로 변환 — 템플릿 리터럴 안 <span> 삽입 금지 원칙 준수 */
function rich(str){
  const frag = document.createDocumentFragment();
  const parts = str.split(/\[\[(.+?)\]\]/);
  parts.forEach((p, i) => {
    if (i % 2 === 0) { if (p) frag.appendChild(document.createTextNode(p)); }
    else {
      const s = document.createElement('span');
      s.className = 'tt'; s.textContent = p; s.setAttribute('data-term', p); s.setAttribute('tabindex','0');
      frag.appendChild(s);
    }
  });
  return frag;
}
const bubble = document.getElementById('tt-bubble');
function tt(el){
  const term = el.getAttribute('data-term');
  bubble.textContent = TERMS[term] || term;
  bubble.classList.remove('show');
  bubble.style.top = '-9999px'; bubble.style.left = '0';
  const h = bubble.offsetHeight, w = bubble.offsetWidth;
  const r = el.getBoundingClientRect();
  let left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  let top = r.top - h - 8;
  if (top < 8) top = r.bottom + 8;
  bubble.style.left = left + 'px'; bubble.style.top = top + 'px';
  bubble.classList.add('show');
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tt');
  if (t) { e.stopPropagation(); tt(t); } else bubble.classList.remove('show');
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('tt')) tt(e.target); });

/* ===== 데이터 ===== */
const SCENES = [
  { key:'s1_inform', date:'3월 26일, 낮', title:'소식이 넘어왔다', next:'저녁이 된다',
    prompt:'[[인산]]에 다녀온 마을 사람이 서울의 만세 소식을 가져왔다. 누구에게 먼저 알릴 것인가?',
    choices:[
      { id:'village', text:'동리 어른들에게 — 마을 사람끼리 먼저', cond:'마을 단위 결집이 실제 시위의 기본 단위였다.', grade:'B', think:'빠르지만 규모가 작다.' },
      { id:'market', text:'장터에서 아는 상인·장꾼에게', cond:'[[장날]]은 여러 마을 사람이 정기적으로 만나는 공간이었다.', grade:'B', think:'멀리 퍼지지만 누가 듣는지 통제할 수 없다.' },
      { id:'myeonjang', text:'[[면장]]에게', cond:'면장은 총독부 행정의 말단이자 지역의 유력자였다.', grade:'B', think:'면장이 어느 편일지 알 수 없다.' },
      { id:'wait', text:'아직 아무에게도 — 며칠 지켜본다', cond:'이 선택은 재판 기록에 남지 않는다. 기록되지 않은 사람들의 자리다.', grade:'', think:'정보와 시점을 남에게 맡기게 된다.' }
    ]},
  { key:'s2_prep', date:'3월 26일, 저녁', title:'무엇을 준비해 둘까', next:'밤이 깊는다',
    lead:'해가 기울었다. 서울에서 시작된 만세 이야기는 이제 이 마을에서도 남의 이야기가 아니다.',
    prompt:'마을에 만세 이야기가 퍼지고 있다. 당신은 무엇을 준비해 둘 것인가?',
    choices:[
      { id:'flag', text:'태극기를 만든다', cond:'이 지역에서는 비밀리에 국기를 만들었고, 옛 국기를 앞세운 시위가 있었다.', grade:'A·B', think:'발각되면 물증이 된다.' },
      { id:'beacon', text:'[[봉화]]를 올릴 불씨와 장소를 준비한다', cond:'이 지역의 한 고개에서 봉화를 올려 만세를 시작한 기록이 있다.', grade:'B', think:'멀리서도 보일 수 있다. 누가 보게 될지는 통제할 수 없다.' },
      { id:'paper', text:'서울 인쇄물을 구해 읽을 수 있는 사람에게 부탁한다', cond:'이웃 면에서는 『[[조선독립신문]]』을 군중 앞에서 읽어 주었다.', grade:'A', think:'글 아는 사람과 인쇄물이 둘 다 필요하다.' },
      { id:'none', text:'아무것도 준비하지 않는다', cond:'', grade:'', think:'물증도 없지만 알릴 수단도 없다.' }
    ]},
  { key:'s3_when', date:'3월 26~27일', title:'언제, 어디서', next:'사람들이 모인다',
    lead:'밤이 깊는다. 준비할 수 있는 것은 많지 않았다. 더 어려운 문제가 남았다.',
    prompt:'사람들이 움직이려 한다. 언제, 어디서 모일 것인가?',
    choices:[
      { id:'tonight', text:'오늘 밤, 마을 사람끼리', cond:'이웃 면에서는 3월 26일 밤 약 100명이 모여 [[면사무소]]로 향했다.', grade:'A', think:'규모는 작지만 빠르다.' },
      { id:'marketday', text:'내일 [[장날]], 장터에서', cond:'3월 27일은 이 지역 장터의 장날이었다.', grade:'B', think:'여러 면 사람이 모이지만 하루를 기다려야 한다.' },
      { id:'joint', text:'이웃 면 사람들에게 함께 나오자고 알린다', cond:'실제 시위에서 여러 면 주민이 합류했다. 사전에 약속했는지는 기록에 없다.', grade:'B', think:'다른 지역까지 연락하려면 사람과 시간이 필요하다.' },
      { id:'avoid', text:'장날은 피한다', cond:'', grade:'', think:'헌병은 나올 수 있다. 그러나 모일 사람도 줄어든다.' }
    ]},
  { key:'s4_where', date:'시위 당일', title:'면사무소 앞', next:'하루가 지난다',
    intro:['서로 다른 마을에서 나온 사람들이 한 무리가 되었다. 길 앞에 [[면사무소]]가 있다.','[[면장]]은 식민 통치의 말단이다. 그러나 그 면장이 지금 어떤 선택을 할지, 당신은 모른다.'],
    prompt:'한 무리의 시위대가 [[면사무소]] 근처에 모였다. 당신도 그 자리에 섰다. 어디로 갈 것인가?',
    choices:[
      { id:'office', text:'면사무소 앞에서 만세를 부른다', cond:'이웃 면 시위대는 면사무소에 모였고, 일부는 안으로 들어갔다.', grade:'A', think:'행정기구를 직접 향하는 행동이다.' },
      { id:'myeonjang_home', text:'[[면장]]의 집으로 간다', cond:'이웃 면에서 실제로 제안되었으나 군중이 따르지 않았다.', grade:'A', think:'시간대에 따라 면사무소에 면장이 없을 수 있다.' },
      { id:'market', text:'면사무소를 지나 장터로 돌아간다', cond:'', grade:'', think:'행정기구와의 충돌을 피한다.' },
      { id:'disperse', text:'여기서 해산한다', cond:'', grade:'', think:'이웃 면과 합류할 기회가 사라진다.' }
    ]},
  { key:'s5_next', date:'3월 28~29일', title:'그 다음 날', next:'기록을 펼친다',
    lead:'하루가 지나도 사건은 끝나지 않았다. 어제의 만세 뒤에도 각자는 다시 선택해야 한다.',
    prompt:'시위가 있었고 하루가 지났다. 오늘 당신은 어떻게 할 것인가?',
    choices:[
      { id:'march', text:'이웃 면으로 행진해 합류한다', cond:'시위는 이웃 면의 큰 마을까지 번졌다.', grade:'B', think:'' },
      { id:'nextmarket', text:'마을로 돌아가 다음 장날을 기다린다', cond:'이 군의 만세 시위는 4월까지 이어졌다.', grade:'B', think:'' },
      { id:'torch', text:'밤에 산에서 횃불을 올린다', cond:'이웃 면들에서 밤에 산 위에서 횃불을 올린 기록이 있다.', grade:'B', think:'' },
      { id:'stop', text:'멈춘다', cond:'멈추거나 참여하지 않은 사람은 재판 기록에 잘 보이지 않는다.', grade:'', think:'' }
    ]}
];
/* 선택 재서술 — 결과를 만들지 않는다 */
const YOU = {
  s1_inform:{ village:'마을 사람들과 먼저 이야기하기로 했다.', market:'장터의 아는 얼굴들에게 소식을 흘리기로 했다.', myeonjang:'면장을 찾아가 서울 소식을 알리기로 했다.', wait:'당분간 말을 아끼고 지켜보기로 했다.' },
  s2_prep:{ flag:'몰래 국기를 만들기로 했다.', beacon:'고개 위에 불을 올릴 준비를 하기로 했다.', paper:'서울 인쇄물을 구해 읽어 줄 사람을 찾기로 했다.', none:'따로 준비하지 않기로 했다.' },
  s3_when:{ tonight:'오늘 밤 마을 사람끼리 나서기로 했다.', marketday:'장날을 기다리기로 했다. 여러 마을 사람이 모이는 공간을 써 보기로 한 것이다.', joint:'이웃 면 사람들에게도 함께 나오자고 연락하기로 했다.', avoid:'장날은 피하기로 했다.' },
  s4_where:{ office:'면사무소 앞으로 나아가기로 했다.', myeonjang_home:'면장의 집으로 가자고 했다.', market:'면사무소를 지나쳐 장터로 돌아가기로 했다.', disperse:'여기서 흩어지기로 했다.' },
  s5_next:{ march:'이웃 면으로 행진하기로 했다.', nextmarket:'마을로 돌아가 다음 장날을 기다리기로 했다.', torch:'밤에 산에서 횃불을 올리기로 했다.', stop:'여기서 멈추기로 했다.' }
};
const NET = { village:'사적 관계망(마을)', market:'시장 관계망(장터)', myeonjang:'공적 관계망(면장)', wait:'관망' };
const SPACE = { tonight:'마을', marketday:'장터', joint:'장터·이웃 면', avoid:'마을', office:'면사무소', myeonjang_home:'면장의 집', market:'장터', disperse:'해산' };
const NETAXIS = { village:'private', market:'market', myeonjang:'public', wait:'none' };
function spaceAxis(p){ if (p.s4_where==='office'||p.s4_where==='myeonjang_home') return 'office'; if (p.s3_when==='marketday'||p.s3_when==='joint'||p.s4_where==='market') return 'market'; return 'village'; }

/* ===== 상태 ===== */
function newSession(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }); }
const S = { step:0, picks:{}, submitted:false, commentSubmitted:false, session: newSession() };
function trace(stage){ return { session_id: S.session, submission_stage: stage }; }
const stage = document.getElementById('stage');
const prog = document.getElementById('prog');
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.appendChild(rich(text)); return e; }
function clear(){ stage.innerHTML = ''; bubble.classList.remove('show'); window.scrollTo(0,0); }

/* ===== 화면 ===== */
function renderIntro(){
  clear(); prog.textContent = '';
  const v = el('section','scene');
  v.appendChild(el('div','eyebrow','1919년 3월 26일'));
  v.appendChild(el('h1',null,'장날, 1919년 3월'));
  v.appendChild(el('p','prompt','서울에서 독립 선언이 있었다는 소식이 경기도 어느 군의 한 마을에 닿았다. 이제 무엇을 할지는 이 마을 사람들이 정해야 한다.'));
  const n = el('div','notice');
  n.appendChild(rich('이 게임은 1919년 3월의 시위와 그에 대한 처벌 기록을 다룹니다. 광주군 전체 3·1 운동의 시작이 아니라, 한 지역에서 확인되는 3월 26~29일의 움직임만 다룹니다.'));
  v.appendChild(n);
  const c = el('div','condcard');
  c.appendChild(el('div','lbl','당신은 3월 26일의 사람입니다. 이 운동이 어떻게 끝날지 모릅니다. 지금 아는 것은 이것뿐입니다.'));
  const ul = document.createElement('ul');
  ['서울에서 3월 1일 독립 선언과 만세 시위가 있었다.','고종 [[인산]]에 다녀온 이 지역 사람이 그 소식을 가져왔다.','면에는 [[면장]]과 [[면사무소]]가 있고, [[주재소]]가 있다.'].forEach(t => ul.appendChild(el('li',null,t)));
  c.appendChild(ul); v.appendChild(c);
  v.appendChild(el('p',null,'모르는 말은 밑줄 친 낱말을 눌러 뜻을 볼 수 있습니다.')).style.color='var(--color-sepia)';
  const row = el('div','btnrow');
  const b = el('button','btn','소식을 듣는다'); b.onclick = () => { S.step = 1; renderScene(0); };
  row.appendChild(b); v.appendChild(row); stage.appendChild(v);
}

function renderScene(i){
  clear(); const sc = SCENES[i]; prog.textContent = '장면 ' + (i+1) + ' / 5';
  if (sc.intro) {
    const w = el('section','scene intermission');
    w.appendChild(el('div','eyebrow',sc.date));
    w.appendChild(el('h2',null,'길 앞에 면사무소가 있다'));
    sc.intro.forEach(t => w.appendChild(el('p',null,t)));
    const row = el('div','btnrow'); const b = el('button','btn','그 자리에 선다');
    b.onclick = () => renderChoices(i); row.appendChild(b); w.appendChild(row);
    stage.appendChild(w); return;
  }
  renderChoices(i);
}
function renderChoices(i){
  clear(); const sc = SCENES[i]; prog.textContent = '장면 ' + (i+1) + ' / 5';
  const v = el('section','scene');
  v.appendChild(el('div','eyebrow',sc.date));
  v.appendChild(el('h2',null,sc.title));
  if (sc.lead) v.appendChild(el('p','lead',sc.lead));
  v.appendChild(el('p','prompt',sc.prompt));
  const list = el('div','choices'); const btns = [];
  sc.choices.forEach(ch => {
    const b = el('button','choice-card',ch.text); b.type='button';
    b.onclick = () => {
      S.picks[sc.key] = ch.id;
      btns.forEach(x => { x.disabled = true; x.classList.remove('selected'); });
      b.classList.add('selected');
      showResult(v, sc, ch, i);
    };
    btns.push(b); list.appendChild(b);
  });
  v.appendChild(list); stage.appendChild(v);
}

function showResult(v, sc, ch, i){
  const old = v.querySelector('.result'); if (old) old.remove();
  const r = el('div','result');
  const you = el('div','you'); you.appendChild(el('span','lbl','당신의 판단')); you.appendChild(rich((YOU[sc.key]||{})[ch.id] || '')); r.appendChild(you);
  if (ch.cond) {
    const rec = el('div','rec');
    const head = document.createElement('div');
    head.appendChild(el('span','tag','기록'));
    head.appendChild(el('span','grade', ch.grade ? '출처 ' + ch.grade + '등급' : '기록 없음'));
    rec.appendChild(head);
    rec.appendChild(el('p',null,ch.cond));
    r.appendChild(rec);
  }
  if (ch.think) {
    const th = el('div','think');
    th.appendChild(el('span','lbl','생각해 볼 것'));
    th.appendChild(rich(ch.think));
    r.appendChild(th);
  }
  const row = el('div','btnrow');
  const b = el('button','btn',sc.next + ' →');
  b.onclick = () => { if (i < SCENES.length-1) renderScene(i+1); else renderResult(); };
  row.appendChild(b); r.appendChild(row); v.appendChild(r);
  b.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function trackText(){
  return SCENES.map(sc => { const ch = sc.choices.find(c => c.id === S.picks[sc.key]); return { date:sc.date, title:sc.title, text: ch ? ch.text.replace(/\[\[|\]\]/g,'') : '—' }; });
}
function patternText(){
  const p = S.picks;
  return '관계망: ' + (NET[p.s1_inform]||'—') + ' · 공간: ' + (SPACE[p.s3_when]||'—') + ' → ' + (SPACE[p.s4_where]||'—');
}

function renderResult(){
  clear(); prog.textContent = '기록';
  if (!S.submitted) {
    const data = { record_type:'result', version: window.GAME_CONFIG.schema_version, result_id: S.session, ...S.picks,
      net_axis: NETAXIS[S.picks.s1_inform] || 'none', space_axis: spaceAxis(S.picks), _trace: trace('complete') };
    sendToSupabase(data, ''); S.submitted = true;
  }
  const v = el('section','scene');
  v.appendChild(el('div','eyebrow','1919년 3월 26~29일'));
  v.appendChild(el('h2',null,'당신의 궤적, 그리고 기록'));
  const ul = el('ul','track');
  trackText().forEach(t => { const li = document.createElement('li'); li.appendChild(el('span','d',t.date)); li.appendChild(el('span',null,t.text)); ul.appendChild(li); });
  v.appendChild(ul);
  const pt = el('div','pattern'); pt.appendChild(el('div','lbl','당신의 선택 패턴')); pt.appendChild(el('p',null,patternText())); v.appendChild(pt);

  v.appendChild(el('h2',null,'실제 세 개의 면에서는'));
  v.appendChild(el('p','prompt','당신의 선택이 만든 결과가 아니라, 같은 조건에서 실제 사람들이 남긴 기록이다.'));
  const M = [
    { n:'돌마면', p:['3월 26일 비밀리에 국기를 만들고 만세고개에서 [[봉화]]를 올렸다. 27일 분당리 [[장날]], 장터에 1,000여 명이 모였다.','주도자 한백봉: 주민 50여 명을 모아 옛 국기를 앞세웠고, 다른 지역 수백 명과 합류했다. 징역 1년.','면장 이준구는 사직서를 내고 집에 태극기를 걸었다.'], s:'디지털성남문화대전 [B] · 국가기록원 판결문 [A] · 조성운(2020) [B]' },
    { n:'낙생면', p:['[[면장]] 남태희는 사직서를 내고 집에 태극기를 걸었다.','장터의 시위대가 낙생 [[면사무소]]로 와 면민과 합동 시위를 벌였다.'], s:'디지털성남문화대전 [B] · 조성운(2020) [B]' },
    { n:'대왕면', p:['3월 26일 송파 시위에서 돌아온 이시종이 밤 7시경 수서리 주민 약 100명과 면사무소로 행진했다.','『[[조선독립신문]]』을 읽었다. "밤에는 면장이 없을 테니 면장 집으로 가자"는 제안이 있었지만 군중은 따르지 않았다.','면사무소 안에서 "이제 조선이 독립하니 [[부역]]과 세금은 필요 없다"고 말했다. 이시종 징역 1년, 이재순 징역 8월.'], s:'국가기록원 독립운동 판결문 [A]' }
  ];
  M.forEach(m => { const d = el('div','myeon'); d.appendChild(el('h3',null,m.n)); m.p.forEach(t => d.appendChild(el('p',null,t))); d.appendChild(el('div','src','출처: ' + m.s)); v.appendChild(d); });

  const num = el('div','numbers');
  num.appendChild(el('div','big','1,000여 명 / 3,000여 명'));
  num.appendChild(el('p',null,'자료에 따라 1,000여 명 또는 3,000여 명으로 기록되어 있다. 날짜와 집계 범위의 표기도 일치하지 않는다.'));
  num.appendChild(el('p','q','왜 같은 시위를 두고 숫자가 다를까?'));
  v.appendChild(num);

  if (STATS_ENDPOINT) {
    const st = el('div','stats');
    const sb = el('button','btn ghost','우리 반 지금까지 선택 보기 →');
    const sbox = document.createElement('div');
    sb.onclick = () => loadClassStats(sbox, sb);
    st.appendChild(sb); st.appendChild(sbox); v.appendChild(st);
  }

  v.appendChild(el('h2',null,'한 줄 소감'));
  const ta = document.createElement('textarea'); ta.id='comment'; ta.rows=2; ta.maxLength=100; ta.placeholder='한 줄 소감을 남겨보세요. (이름·학번 제외)';
  v.appendChild(ta);
  const row = el('div','btnrow');
  const cp = el('button','btn','결과 복사'); const toast = el('span','toast','');
  cp.onclick = () => {
    const comment = ta.value.trim();
    if (comment && !S.commentSubmitted) { sendToSupabase({ record_type:'comment', version: window.GAME_CONFIG.schema_version, result_id: S.session, _trace: trace('comment') }, comment); S.commentSubmitted = true; }
    const txt = ['「장날, 1919년 3월」 나의 선택'].concat(trackText().map(t => '· ' + t.date + ' ' + t.title + ': ' + t.text)).concat(['패턴: ' + patternText()]).concat(comment ? ['소감: ' + comment] : []).join('\n');
    navigator.clipboard.writeText(txt).then(() => { toast.textContent = '복사됐습니다'; }, () => { toast.textContent = '복사에 실패했습니다. 길게 눌러 직접 복사하세요.'; });
  };
  const nx = el('button','btn ghost','이 이야기가 있었던 곳 →'); nx.onclick = renderEpilogue;
  row.appendChild(cp); row.appendChild(toast); v.appendChild(row);
  const row2 = el('div','btnrow'); row2.appendChild(nx); v.appendChild(row2);
  v.appendChild(el('div','copyright','© 찰리쌤 · hischarlie.tistory.com'));
  stage.appendChild(v);
}

function loadClassStats(box, btn){
  /* 집계 엔드포인트 계약(가정): GET STATS_ENDPOINT?game=&class= → { total, s1_inform:{village,market,myeonjang,wait} }
     n<3 억제는 서버에서 적용. raw choices SELECT 금지. */
  box.innerHTML = ''; btn.disabled = true;
  const q = STATS_ENDPOINT + '?game=' + encodeURIComponent(window.GAME_CONFIG.game_id) + '&class=' + encodeURIComponent(CLASS);
  fetch(q).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(agg => {
    const total = agg.total || 0; const MIN = 3;
    box.appendChild(el('p',null,CLASS + '반 · 지금까지 ' + total + '명'));
    if (total < MIN || !agg.s1_inform) { box.appendChild(el('p','muted','응답이 ' + MIN + '명 미만이라 비율을 표시하지 않습니다.')); return; }
    box.appendChild(el('p','muted','장면 1 · 누구에게 먼저 알렸는가'));
    SCENES[0].choices.forEach(ch => {
      const n = agg.s1_inform[ch.id]; const row = el('div','bar');
      const left = document.createElement('div'); left.appendChild(rich(ch.text));
      const bar = document.createElement('i'); bar.style.width = (n == null ? 0 : n/total*100).toFixed(0) + '%';
      left.appendChild(bar); row.appendChild(left);
      row.appendChild(el('span',null, n == null ? '소수' : Math.round(n/total*100) + '%'));
      box.appendChild(row);
    });
  }).catch(e => { console.warn('[stats] 조회 실패', e); box.appendChild(el('p','muted','지금은 반 통계를 불러올 수 없습니다.')); });
}

function renderEpilogue(){
  clear(); prog.textContent = '지금';
  const v = el('section','scene');
  v.appendChild(el('div','eyebrow','1919 → 지금'));
  v.appendChild(el('h2',null,'이 이야기가 있었던 곳'));
  v.appendChild(el('p','prompt','세 개의 면은 경기도 광주군에 있었다. 이 땅은 지금 어디일까?'));
  const map = el('div','map'); map.id = 'map';
  map.innerHTML = MAP_SVG;
  v.appendChild(map);
  v.appendChild(el('p','mapnote','위치 관계를 단순화한 도식입니다. 실제 경계·거리를 나타내지 않습니다.'));
  const row = el('div','btnrow');
  const b = el('button','btn','지금은 어디일까?');
  const after = el('p','prompt','당신이 방금 살펴본 것과 비슷한 판단과 행동이 지금의 성남시 일대에서 실제로 이루어졌다.'); after.style.display='none';
  b.onclick = () => { map.classList.add('now'); b.disabled = true; after.style.display='block'; };
  row.appendChild(b); v.appendChild(row); v.appendChild(after);
  const row2 = el('div','btnrow'); const rs = el('button','btn ghost','처음부터 다시'); rs.onclick = restart; row2.appendChild(rs); v.appendChild(row2);
  stage.appendChild(v);
}

function restart(){ S.step = 0; S.picks = {}; S.submitted = false; S.commentSubmitted = false; S.session = newSession(); renderIntro(); }
renderIntro();
