name: Assemble rationnet1943 v1.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rationnet1943-deploy.yml'
      - 'deploy_staging/rationnet1943/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble verified HTML
        shell: bash
        run: |
          set -euo pipefail
          cat \
            deploy_staging/rationnet1943/part00fix.b64 \
            deploy_staging/rationnet1943/part01.b64 \
            deploy_staging/rationnet1943/part02.b64 \
            deploy_staging/rationnet1943/part03.b64 \
            deploy_staging/rationnet1943/part04.b64 \
            deploy_staging/rationnet1943/part05.b64 \
            | base64 -d | gunzip > rationnet1943/index.html
          sed -i "s/__배포_전_주입__/sb_publishable_mYZObIGh4nOLKqfnjXHsow_eIARb5U9/" rationnet1943/index.html
          grep -q "version: '1.1.3'" rationnet1943/index.html
          grep -q "s2_classify" rationnet1943/index.html
          grep -q "play_id" rationnet1943/index.html
          grep -q "sb_publishable_mYZObIGh4nOLKqfnjXHsow_eIARb5U9" rationnet1943/index.html
          ! grep -q "__배포_전_주입__" rationnet1943/index.html
          ! grep -q "result_id" rationnet1943/index.html
          ! grep -q "attempt_id" rationnet1943/index.html
          ! grep -q "submission_id" rationnet1943/index.html
          test "$(wc -c < rationnet1943/index.html)" -eq 77493
          echo "648754a5848bfdf935c6e2fa93e7346cd90ce042171541fefbba42ec5d609d5f  rationnet1943/index.html" | sha256sum -c -
      - name: Commit deploy candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rationnet1943/index.html
          if git diff --cached --quiet; then
            echo 'No index change.'
            exit 0
          fi
          git commit -m 'games: deploy rationnet1943 v1.1.3'
          git push
