name: One-time imjeong1919 release audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imjeong1919-release-audit.yml'

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout games repository
        uses: actions/checkout@v4
        with:
          path: games
      - name: Checkout hub repository
        uses: actions/checkout@v4
        with:
          repository: gtmc-history/gtmc-history.github.io
          path: hub
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cross-repo audit
        working-directory: games
        run: npm run audit:games -- --hub-repo ../hub
      - name: Production HTTP audit
        working-directory: games
        run: npm run audit:games -- --hub-repo ../hub --production
