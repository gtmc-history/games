name: jangnal1919 Supabase migration preflight

on:
  push:
    branches:
      - feat/jangnal1919
    paths:
      - '.github/workflows/jangnal1919-supabase-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jangnal1919
      - name: Check credential availability without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'MISSING SUPABASE_ACCESS_TOKEN'; exit 20; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'MISSING SUPABASE_DB_PASSWORD'; exit 21; }
          echo 'Supabase migration credentials are configured.'
      - name: Compare local and remote migration history (read-only)
        shell: bash
        run: npx --yes supabase@latest migration list --linked
