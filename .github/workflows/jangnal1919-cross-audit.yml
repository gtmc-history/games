name: jangnal1919 cross-repo audit

on:
  push:
    branches:
      - feat/jangnal1919
    paths:
      - '.github/workflows/jangnal1919-cross-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout games branch
        uses: actions/checkout@v4
        with:
          ref: feat/jangnal1919
      - name: Checkout hub branch
        uses: actions/checkout@v4
        with:
          repository: gtmc-history/gtmc-history.github.io
          ref: feat/jangnal1919
          path: _hub
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run canonical cross-repo audit
        run: npm run audit:games -- --hub-repo _hub
      - name: Remove one-time audit workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/jangnal1919-cross-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove jangnal1919 one-time cross audit'
          git push origin HEAD:feat/jangnal1919
