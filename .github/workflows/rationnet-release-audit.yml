name: Cross-audit rationnet1943 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rationnet-release-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-rationnet1943
          path: games
      - uses: actions/checkout@v4
        with:
          repository: gtmc-history/gtmc-history.github.io
          ref: publish-rationnet1943
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cross-repository integration audit
        working-directory: games
        run: npm run audit:games -- --hub-repo ../hub
      - name: Production read-only audit
        working-directory: games
        run: npm run audit:games -- --hub-repo ../hub --production
