name: Game Integration Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout games repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit canonical game integration
        run: npm run audit:games

      - name: Verify 1980 student-input security and inline JavaScript syntax
        run: node tests/democracy-1980-security.mjs

      - name: Verify 1980 DESIGN_LOCK v1.3 contract (game logic, payload, save branches, local drafts)
        run: node tests/democracy-1980-contract-v13.mjs

      - name: Verify 1980 art layer (local WebP, labels, SVG fallback)
        run: node tests/democracy-1980-art.mjs
