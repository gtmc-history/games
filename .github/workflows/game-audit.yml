name: Game Integration Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout games repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit canonical game integration
        run: npm run audit:games
