name: Rationnet production read check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rationnet-prod-readcheck.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production game_meta and public game
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('rationnet1943/index.html','utf8');
          const url = html.match(/supabaseUrl:\s*'([^']+)'/)?.[1];
          const key = html.match(/supabasePublishableKey:\s*'([^']+)'/)?.[1];
          if (!url || !key) throw new Error('public Supabase config not found');
          const metaUrl = `${url}/rest/v1/game_meta?game_id=eq.rationnet1943&select=game_id,label,era`;
          const metaRes = await fetch(metaUrl, { headers: { apikey: key } });
          if (!metaRes.ok) throw new Error(`game_meta HTTP ${metaRes.status}`);
          const meta = await metaRes.json();
          console.log('game_meta rows:', JSON.stringify(meta));
          if (!Array.isArray(meta) || meta.length !== 1) throw new Error('rationnet1943 game_meta row missing');
          if (meta[0].label !== '배급망 1943') throw new Error('rationnet1943 label mismatch');
          const gameRes = await fetch('https://gtmc-history.github.io/games/rationnet1943/');
          console.log('public game HTTP:', gameRes.status);
          if (!gameRes.ok) throw new Error(`public game HTTP ${gameRes.status}`);
          const live = await gameRes.text();
          if (!live.includes("version: '1.1.3'")) throw new Error('public game is not v1.1.3');
          if (!live.includes('play_id') || !live.includes('s2_classify')) throw new Error('public payload contract not live');
          NODE
