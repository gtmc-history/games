name: Rationnet Supabase preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rationnet-supabase-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configured credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN: MISSING'; exit 21; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'SUPABASE_DB_PASSWORD: MISSING'; exit 22; }
          echo 'SUPABASE_ACCESS_TOKEN: PRESENT'
          echo 'SUPABASE_DB_PASSWORD: PRESENT'
      - name: Install Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save supabase@latest >/dev/null
          npx supabase --version
      - name: Link project and inspect migration state
        shell: bash
        run: |
          set -euo pipefail
          npx supabase link --project-ref xgniwztlrakkrbzcfklb --password "$SUPABASE_DB_PASSWORD"
          echo '--- migration list ---'
          npx supabase migration list --linked
          echo '--- db push dry-run ---'
          npx supabase db push --linked --dry-run
