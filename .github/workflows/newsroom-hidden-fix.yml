name: One-shot newsroom hidden fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/newsroom-hidden-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append hidden rule once
        run: |
          if ! grep -q '\[hidden\]{display:none!important}' newsroom1945/style.css; then
            printf '\n[hidden]{display:none!important}\n' >> newsroom1945/style.css
          fi
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newsroom1945/style.css
          git commit -m 'fix: enforce hidden scenes in newsroom1945'
          git push
