<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독도연구소: 1905 파일</title>
<meta name="description" content="1877·1900·1904·1906년의 기록으로 1905년의 편입 조치를 검증하는 사료 탐구 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --paper:#fbf8f1; --ink:#1b2430; --muted:#5b6470; --line:#cfc6b4;
  --sea:#1f4e5f; --sea-2:#2f6f83; --sea-soft:#dfe9ea;
  --seal:#a3322a; --seal-soft:#f3dedb; --gold:#9a7a2c; --ok:#2f6b45; --ok-soft:#dcebdf;
  --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.65;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:var(--ink);color:#f3efe6}
.brand{display:flex;align-items:center;gap:10px}
.brand strong{font-family:var(--serif);font-size:19px;letter-spacing:.02em;display:block;line-height:1.2}
.brand small{font-size:13px;opacity:.75}
.seal{display:inline-grid;place-items:center;width:36px;height:36px;border:2px solid var(--seal);color:#fff;background:var(--seal);font-family:var(--serif);font-weight:900;border-radius:3px;font-size:19px}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.steps li{width:30px;height:6px;background:#3b4654;border-radius:1px}
.steps li.done{background:#8fb3bd}
.steps li.now{background:#f3efe6}

/* timeline */
.timeline{display:flex;gap:0;overflow-x:auto;background:#e6e0d3;border-bottom:1px solid var(--line);padding:8px 12px;scrollbar-width:thin}
.tl{flex:0 0 auto;min-width:104px;max-width:150px;padding:4px 10px;border-left:1px solid var(--line);font-size:13px;line-height:1.35;color:#9a927f;transition:background .4s,color .4s}
.tl b{display:block;font-size:12px;letter-spacing:.03em}
.tl span{display:block;visibility:hidden}
.tl.file b{color:var(--sea)}
.tl.lit{color:var(--ink);background:var(--paper)}
.tl.lit span{visibility:visible}
.tl.lit b{color:var(--seal)}
.tl.fresh{animation:tl-in 1.2s ease}
@keyframes tl-in{0%{background:#f7e3b8}100%{background:var(--paper)}}

.stage{flex:1;width:100%;max-width:960px;margin:0 auto;padding:24px 20px 120px;outline:none}
.scene-enter{animation:scene-in .4s ease both}
@keyframes scene-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--serif);line-height:1.35;margin:0 0 8px}
h1{font-size:30px}
h2{font-size:24px}
h3{font-size:19px}
.kicker{font-size:13px;letter-spacing:.12em;color:var(--seal);font-weight:700;margin-bottom:4px}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:15px}

/* VN line */
.vn{display:flex;gap:12px;align-items:flex-start;background:var(--ink);color:#f3efe6;padding:14px 16px;border-radius:4px;margin:0 0 18px}
.vn .who{flex:0 0 auto;font-size:13px;font-weight:700;color:#8fb3bd;padding-top:2px;min-width:64px}
.vn p{margin:0}

/* task bar */
.task{border-left:4px solid var(--seal);background:var(--paper);padding:10px 14px;margin:0 0 14px;font-weight:500}
.task small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.task.done{border-left-color:var(--ok);color:var(--ok)}

/* documents */
.doc{background:var(--paper);border:1px solid var(--line);padding:18px 20px;margin:0 0 16px;position:relative}
.doc::before{content:"";position:absolute;inset:6px;border:1px solid #e6dfcf;pointer-events:none}
.doc-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:10px;position:relative}
.doc-meta .tag{border:1px solid var(--line);padding:0 6px;border-radius:2px;background:#fff}
.doc-meta .tag.now{border-color:var(--sea);color:var(--sea)}
.doc-title{font-family:var(--serif);font-weight:700;font-size:18px;margin-bottom:8px;position:relative}
.doc-body{font-family:var(--serif);font-size:18px;line-height:2;position:relative}
.orig{display:block;font-size:14px;color:var(--muted);line-height:1.6;margin-top:10px;font-family:var(--serif)}
.seg{display:inline;background:none;border:0;padding:2px 1px;margin:0;font-family:inherit;font-size:inherit;line-height:inherit;text-align:left;cursor:pointer;border-bottom:1px dashed #b9ae98;border-radius:0}
.seg:hover{background:#efe8d8}
.seg:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
.seg.hit{background:#f6e1a8;border-bottom:2px solid var(--seal);animation:mark .5s ease}
.seg.miss{animation:wrong-shake .35s ease}
.seg.static{cursor:default;border-bottom:0}
.seg.static:hover{background:none}
@keyframes mark{0%{background:transparent}100%{background:#f6e1a8}}
@keyframes wrong-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.seg.hit{display:inline}
.note{font-size:15px;background:var(--sea-soft);border-left:3px solid var(--sea);padding:8px 12px;margin:8px 0 14px}
.note.warn{background:var(--seal-soft);border-left-color:var(--seal)}
.note.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.layer{display:inline-block;font-size:12px;font-weight:700;padding:0 6px;border-radius:2px;margin-right:6px;vertical-align:1px}
.layer.fact{background:var(--ink);color:#fff}
.layer.interp{background:var(--gold);color:#fff}
.layer.gov{background:var(--sea);color:#fff}

/* buttons */
.act{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:10px 22px;background:var(--sea);color:#fff;border:0;border-radius:3px;font-weight:700;font-size:17px;cursor:pointer;transition:transform .15s,background .15s}
.act:hover{background:var(--sea-2);transform:translateY(-1px)}
.act:active{transform:scale(.98)}
.act.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.act.ghost:hover{background:var(--sea-soft)}
.act:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}

/* judgement */
.judge{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.opt{min-height:64px;padding:10px 12px;background:var(--paper);border:1.5px solid var(--line);border-radius:3px;cursor:pointer;font-size:17px;font-weight:500;text-align:center;transition:border-color .2s,background .2s,transform .15s}
.opt:hover{border-color:var(--sea)}
.opt.on{border-color:var(--sea);background:var(--sea);color:#fff}
.opt small{display:block;font-size:13px;font-weight:400;opacity:.8}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.past{background:#e9e4d8;border:1px dashed #a79f8c;padding:12px 14px;font-size:15px}
.past b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.past .val{font-size:18px;font-weight:700;color:var(--ink)}
.newdoc{background:var(--paper);border:1px solid var(--sea);padding:12px 14px;font-size:15px}
.newdoc b{display:block;font-size:13px;color:var(--sea)}

/* cards & slots */
.cards{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.card{min-height:56px;min-width:140px;max-width:260px;padding:8px 12px;background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--sea);border-radius:2px;text-align:left;cursor:pointer;font-size:15px;line-height:1.4;transition:transform .15s,border-color .15s}
.card b{display:block;font-size:12px;color:var(--seal);letter-spacing:.04em}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-soft)}
.card.used{opacity:.35;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.slot{min-height:92px;border:2px dashed #b5aa94;padding:10px;background:rgba(255,255,255,.4);cursor:pointer;border-radius:2px;font-size:15px;transition:background .2s,border-color .2s}
.slot > b{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.slot.ready{border-color:var(--sea);background:var(--sea-soft)}
.slot.filled{border-style:solid;border-color:var(--ok);background:#fff}
.slot.wrong{animation:wrong-shake .35s ease;border-color:var(--seal)}
.slot .placed{font-family:var(--serif);font-size:16px}

/* map */
.mapwrap{background:#e9e2cf;border:1px solid var(--line);position:relative;margin:0 0 12px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapcap{font-size:13px;color:var(--muted);padding:6px 12px;background:var(--paper);border-top:1px solid var(--line)}
.isle{cursor:pointer}
.isle .shape{transition:fill .2s}
.isle:hover .shape{fill:#c9b98f}
.isle.hit .shape{fill:#e8c46a}
.maptools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.maptools button{min-width:48px;min-height:48px;background:var(--paper);border:1px solid var(--line);border-radius:3px;font-size:15px;cursor:pointer}
.modern{opacity:0;transition:opacity .5s}
.legend{background:var(--sea);color:#fff;padding:6px 12px;font-size:14px;line-height:1.5}
.modern.show{opacity:1}

/* check card */
.check{border:1.5px solid var(--ink);background:#fff;padding:12px 16px;margin:12px 0;font-size:15px}
.check h3{font-size:16px;font-family:var(--sans);letter-spacing:.02em;border-bottom:1px solid var(--line);padding-bottom:6px}
.check dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.check dt{font-weight:700;color:var(--ok)}
.check dt.no{color:var(--seal)}
.check dd{margin:0}

/* two-column claims */
.gov2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.gov2 > div{background:var(--paper);border:1px solid var(--line);padding:10px 12px;font-size:15px}
.gov2 b{display:block;font-size:13px;color:var(--sea)}

/* panel */
.panel{background:#fff;border:1px solid var(--ink);padding:22px 24px;margin:14px 0;position:relative}
.panel h2{font-size:26px;border-bottom:3px double var(--ink);padding-bottom:8px}
.panel .ev{padding:10px 0;border-bottom:1px solid var(--line)}
.panel .ev b{font-size:12px;color:var(--seal);letter-spacing:.04em;display:block}
.panel .ev p{font-family:var(--serif);font-size:17px;margin:2px 0}
.panel .ev .limit{font-size:13px;color:var(--muted)}
.panel .closing{font-family:var(--serif);font-weight:700;font-size:18px;margin-top:14px}
.panel .flag{display:inline-block;font-size:12px;border:1px solid var(--gold);color:var(--gold);padding:0 6px;margin-left:6px;font-family:var(--sans);font-weight:700}
.panel .flag.red{border-color:var(--seal);color:var(--seal)}
.stamp{position:absolute;right:18px;top:14px;border:3px solid var(--seal);color:var(--seal);font-family:var(--serif);font-weight:900;padding:2px 10px;transform:rotate(-6deg);font-size:18px;animation:stamp-in .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes stamp-in{0%{transform:scale(2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.claims{display:grid;gap:8px;margin:8px 0 16px}
.claim{text-align:left;padding:10px 14px;min-height:52px;background:var(--paper);border:1.5px solid var(--line);border-radius:3px;cursor:pointer;font-family:var(--serif);font-size:16px}
.claim.on{border-color:var(--sea);background:var(--sea-soft)}
textarea{width:100%;min-height:72px;font:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:3px;background:#fff}

/* result */
.traj{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:12px 0;border:1px solid var(--line);background:var(--paper)}
.traj > div{padding:12px;border-right:1px solid var(--line);position:relative}
.traj > div:last-child{border-right:0}
.traj b{display:block;font-size:13px;color:var(--muted)}
.traj .v{font-size:18px;font-weight:700}
.traj .v.up{color:var(--ok)} .traj .v.down{color:var(--seal)}
.qs{background:var(--ink);color:#f3efe6;padding:16px 20px;margin:16px 0}
.qs h3{color:#f3efe6}
.qs ol{margin:0;padding-left:20px}

.tray{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(27,36,48,.96);color:#f3efe6;z-index:5;overflow-x:auto}
.tray-label{font-size:13px;opacity:.75;flex:0 0 auto}
.tray-cards{display:flex;gap:6px}
.chip{flex:0 0 auto;font-size:13px;border:1px solid #8fb3bd;padding:2px 8px;border-radius:2px;white-space:nowrap}
.chip.new{animation:chip-in 1.4s ease}
@keyframes chip-in{0%{border-color:#f6e1a8;color:#f6e1a8}100%{border-color:#8fb3bd;color:#f3efe6}}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:3px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;z-index:6}
.toast.show{opacity:1}

@media (max-width:640px){
  body{font-size:16px}
  .top{padding:8px 12px}
  .steps li{width:16px}
  .stage{padding:16px 16px 110px}
  h1{font-size:25px} h2{font-size:21px}
  .doc{padding:14px}
  .doc-body{font-size:17px}
  .judge{grid-template-columns:1fr}
  .compare,.gov2{grid-template-columns:1fr}
  .traj{grid-template-columns:1fr}
  .traj > div{border-right:0;border-bottom:1px solid var(--line)}
  .stamp{position:static;display:inline-block;margin-bottom:10px}
  .panel{padding:16px}
}
@media print{
  .top,.timeline,.tray,.row,.toast{display:none!important}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  if(fresh.length){const el=$$('.tl.fresh')[0];el&&el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}}
function light(ids){const f=ids.filter(i=>!S.lit.includes(i));S.lit.push(...f);save();timeline(f)}
function tray(fresh){const t=$('#tray');t.hidden=!S.cards.length||S.scene==='r';$('#trayCards').innerHTML=S.cards.map(c=>`<span class="chip ${c===fresh?'new':''}">${c} ${CARDS[c].n}</span>`).join('')}

/* 찾기: 문서의 구절 중 목표 구절을 터치해 표시한다 */
function doc({title,meta=[],segs,orig}){
  return `<article class="doc"><div class="doc-meta">${meta.map(m=>`<span class="tag ${m[1]||''}">${m[0]}</span>`).join('')}</div>
  ${title?`<div class="doc-title">${title}</div>`:''}
  <div class="doc-body">${segs.map((s,i)=>`<button class="seg" data-i="${i}" type="button">${s.t}</button>`).join(' ')}</div>
  ${orig?`<span class="orig">${orig}</span>`:''}</article>`}
function find(root,segs,targets,onDone,miss='찾는 표현이 아닙니다. 과제를 다시 읽어 보세요.'){
  const left=new Set(targets);
  root.querySelectorAll('.seg').forEach(b=>{b.onclick=()=>{
    const i=+b.dataset.i,s=segs[i];
    if(b.classList.contains('hit'))return;
    if(left.has(s.id)){b.classList.add('hit');left.delete(s.id);if(s.ok)toast(s.ok);if(!left.size){root.querySelectorAll('.seg:not(.hit)').forEach(x=>x.classList.add('static'));onDone()}}
    else{S.misses++;save();b.classList.remove('miss');void b.offsetWidth;b.classList.add('miss');toast(s.note||miss)}
  }})}
/* 판단: 세 버튼 중 하나 */
function judge(el,opts,cur,cb){el.innerHTML=Object.entries(opts).map(([k,v])=>`<button type="button" class="opt ${cur===k?'on':''}" data-k="${k}">${v}</button>`).join('');
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.k)})}
/* 배치: 카드 선택 → 칸 선택 */
function place(root,{items,check,onPlace,onDone,errKey='sortErr'}){
  let sel=null;const done={};
  const cardEls=root.querySelectorAll('.card'),slotEls=root.querySelectorAll('.slot');
  cardEls.forEach(c=>c.onclick=()=>{sel=c.dataset.id;cardEls.forEach(x=>x.classList.toggle('sel',x===c));slotEls.forEach(s=>{if(!s.classList.contains('filled'))s.classList.add('ready')})});
  slotEls.forEach(s=>s.onclick=()=>{
    if(!sel){toast('먼저 위의 카드를 고르세요.');return}
    if(s.classList.contains('filled'))return;
    const ok=check?check(sel,s.dataset.slot):true;
    if(!ok){S[errKey]++;save();s.classList.remove('wrong');void s.offsetWidth;s.classList.add('wrong');toast(items[sel].why||'이 칸에 맞지 않습니다. 구절을 말한 주체를 다시 확인해 보세요.');return}
    s.classList.add('filled');s.classList.remove('ready','wrong');s.insertAdjacentHTML('beforeend',`<div class="placed">${items[sel].t}</div>`);
    root.querySelector(`.card[data-id="${sel}"]`).classList.add('used');done[s.dataset.slot]=sel;onPlace&&onPlace(sel,s.dataset.slot);sel=null;
    cardEls.forEach(x=>x.classList.remove('sel'));slotEls.forEach(x=>x.classList.remove('ready'));
    if(Object.keys(done).length===slotEls.length)onDone(done)})}

    <h3>이 자료는 "石島는 이 섬인가?"에 대한 나의 판단에 어떤 영향을 주나요?</h3>
    <div class="judge" id="j"></div>
    <div class="row"><button class="act" id="next" disabled>판단을 기록하고 전시 패널로 간다</button></div>
   </div></div>`;
  find($('#d'),segsA,['x'],()=>{$('#task').classList.add('done');$('#task').textContent='✓ "본군 소속 독도"';gain('E05');light(['t6','t7','t8','t9']);$('#d2').hidden=false;gain('E06');$('#sort').hidden=false;
    place($('#sort'),{items,check:(c,s)=>right[c]===s,onDone:()=>{$('#task2').classList.add('done');$('#task2').textContent='✓ 울도군의 인식 · 일본 측의 통보 · 중앙정부의 대응을 구분했습니다.';$('#after').hidden=false;$('#after').scrollIntoView({behavior:'smooth',block:'start'})}});
    $('#d2').scrollIntoView({behavior:'smooth',block:'start'})});
  judge($('#j'),UPD,S.u1906,k=>{S.u1906=k;save();$('#next').disabled=false});
  if(S.u1906)$('#next').disabled=false;
  $('#next').onclick=()=>go('s6');
}

/* ---------- S6 전시 패널 ---------- */
const CLOSING={
  c1:{t:'1905년 이전과 이후에도, 이 섬에 관한 한국과 일본의 기록이 여러 개 남아 있다.',lv:'narrow'},
  c2:{t:'1877·1900·1904·1906년의 기록을 함께 읽으면, 1905년 결정문의 "다른 나라가 점유한 형적이 없다"는 판단은 그대로 받아들이기 어렵다.',lv:'link'},
  c3:{t:'독도는 우리 땅이니 더 설명할 필요가 없다.',lv:'slogan'}};
function s6(){
  let step=S.panel.cards.length===3?(S.closing?4:Object.keys(S.panel.claims).length===3?(S.review?3:2):1):0;
  const draw=()=>{
    const pc=S.panel.cards;
    stage.innerHTML=`<div class="scene-enter">
     <div class="kicker">S6 · 전시 개막</div>
     <h2>검수 보류를 풀 전시 패널을 완성하세요</h2>
     ${vn('윤 연구원','조사한 사료 카드로 패널을 채울 차례예요. 근거는 세 장. 각 문장이 그 자료가 말할 수 있는 범위를 넘지 않는지가 검수 기준이에요.')}
     <div id="body"></div></div>`;
    const b=$('#body');
    if(step===0){
      b.innerHTML=`<div class="task">① 패널에 쓸 사료 카드 <b>세 장</b>을 고르세요. (${pc.length}/3)</div>
       <div class="cards">${S.cards.map(c=>`<button class="card ${pc.includes(c)?'sel':''}" data-c="${c}" type="button"><b>${c}</b>${CARDS[c].n}</button>`).join('')}</div>
       <div class="row"><button class="act" id="ok" ${pc.length===3?'':'disabled'}>이 세 장으로 쓴다</button></div>`;
      $$('#body .card').forEach(x=>x.onclick=()=>{const c=x.dataset.c,i=pc.indexOf(c);if(i>=0)pc.splice(i,1);else if(pc.length<3)pc.push(c);else{toast('세 장까지 고를 수 있습니다. 바꾸려면 고른 카드를 한 번 더 누르세요.');return}save();draw()});
      $('#ok').onclick=()=>{S.panel.claims={};S.panel.support={};S.review='';S.reviewCard='';save();step=1;draw()};
    }else if(step===1){
      b.innerHTML=`<div class="task">② 카드마다 패널에 쓸 <b>문장</b>을 고르세요.</div>`+pc.map(c=>{const d=CARDS[c],pair=[['d',d.d],['x',d.x]].sort(()=>c.charCodeAt(2)%2?1:-1);
        return `<h3>${c} · ${d.n}</h3><div class="claims" data-c="${c}">${pair.map(([k,t])=>`<button type="button" class="claim ${S.panel.claims[c]===k?'on':''}" data-k="${k}">${t}</button>`).join('')}</div>`}).join('')+
        `<div class="row"><button class="act" id="ok" disabled>검토 의견을 받는다</button></div>`;
      const chk=()=>{$('#ok').disabled=Object.keys(S.panel.claims).length<3};
      $$('#body .claims').forEach(g=>g.querySelectorAll('.claim').forEach(x=>x.onclick=()=>{S.panel.claims[g.dataset.c]=x.dataset.k;save();g.querySelectorAll('.claim').forEach(y=>y.classList.toggle('on',y===x));chk()}));chk();
      $('#ok').onclick=()=>{step=2;draw()};
    }else if(step===2){
      const strong=pc.find(c=>S.panel.claims[c]==='x');
      if(!strong){S.review='none';save();step=3;draw();return}
      const d=CARDS[strong],over=d.xt==='over';S.reviewCard=strong;save();
      b.innerHTML=`<div class="task">③ 검토 의견이 도착했습니다.</div>
       <div class="doc"><div class="doc-meta"><span class="tag now">검토 의견</span><span class="tag">${strong} · ${d.n}</span></div>
        <div class="doc-body" style="font-size:17px">"${esc(d.x)}"<br>${over?'<b>이 자료에서는 이 내용을 확인할 수 없습니다.</b> 자료의 성격을 다시 보세요.':'<b>그 자료 하나만으로 이렇게 말할 수 있습니까?</b> 이 표현은 자료가 직접 말하는 것보다 강합니다.'}</div>
        <span class="orig">자료가 말하는 범위: ${d.limit}</span></div>
       <div class="judge" id="rv"></div><div id="sup"></div>
       <div class="row"><button class="act" id="ok" disabled>의견을 반영한다</button></div>`;
      const opts=over?{narrow:'표현을 좁힌다',keep:'그대로 둔다'}:{add:'다른 근거를 추가한다',narrow:'표현을 좁힌다',keep:'그대로 둔다'};
      judge($('#rv'),opts,'',k=>{S.review=k;save();$('#ok').disabled=k==='add';
        $('#sup').innerHTML=k==='add'?`<p>이 문장을 함께 뒷받침할 카드를 고르세요.</p><div class="cards">${S.cards.filter(c=>c!==strong).map(c=>`<button class="card" data-s="${c}" type="button"><b>${c}</b>${CARDS[c].n}</button>`).join('')}</div>`:'';
        $$('#sup .card').forEach(x=>x.onclick=()=>{S.panel.support[strong]=x.dataset.s;save();$$('#sup .card').forEach(y=>y.classList.toggle('sel',y===x));$('#ok').disabled=false})});
      $('#ok').onclick=()=>{if(S.review==='narrow')S.panel.claims[strong]='d';save();step=3;draw()};
    }else if(step===3){
      b.innerHTML=`${S.review==='none'?'<div class="note ok">검토 의견: 세 문장 모두 자료가 직접 말하는 범위 안에 있습니다. 그렇다면 세 자료를 이어서 무엇을 말할 수 있을까요?</div>':''}
       <div class="task">④ 패널을 맺는 문장을 고르세요.</div>
       <div class="claims" id="cl">${Object.entries(CLOSING).map(([k,v])=>`<button type="button" class="claim ${S.closing===k?'on':''}" data-k="${k}">${v.t}</button>`).join('')}</div>
       <div id="clnote"></div>
       <p class="muted">덧붙이고 싶은 내 문장이 있으면 적어 보세요. (선택 · 이 기기에서만 보이며 저장·전송되지 않습니다)</p>
       <textarea id="own" maxlength="200" placeholder="예: 1905년 결정문은 …">${esc(S.own)}</textarea>
       <div class="row"><button class="act" id="ok" ${S.closing?'':'disabled'}>전시를 연다</button></div>`;
      const note=k=>{$('#clnote').innerHTML=k==='c3'?'<div class="note warn">검수 기준: 처음 패널 초안의 결론으로 돌아갔습니다. 조사한 근거가 문장에 드러나지 않습니다. 그대로 두어도 되지만, 검수 의견이 패널에 남습니다.</div>':''};
      $$('#cl .claim').forEach(x=>x.onclick=()=>{S.closing=x.dataset.k;save();$$('#cl .claim').forEach(y=>y.classList.toggle('on',y===x));note(S.closing);$('#ok').disabled=false});note(S.closing);
      $('#own').oninput=e=>{S.own=e.target.value;save()};
      $('#ok').onclick=()=>{finish();go('r')};
    }else{go('r')}
  };
  draw();
}

/* ---------- 결과 ---------- */
function panelHTML(){
  return `<div class="panel"><span class="stamp">검수 완료</span><h2>독도, 1905년 — 그 이전과 이후의 기록</h2>
   ${S.panel.cards.map(c=>{const d=CARDS[c],k=S.panel.claims[c],sup=S.panel.support[c];
     const flag=k==='x'?(d.xt==='over'?'<span class="flag red">검수 의견: 자료 범위 밖</span>':sup?`<span class="flag">해석 · ${sup} ${CARDS[sup].n}와 연결</span>`:'<span class="flag">해석 · 추가 근거 필요</span>'):'';
     return `<div class="ev"><b>${c} · ${d.n}</b><p>${esc(k==='x'?d.x:d.d)}${flag}</p><div class="limit">이 자료만으로 확인하기 어려운 것 — ${d.limit}</div></div>`}).join('')}
   <p class="closing">${esc(CLOSING[S.closing]?.t||'')}${S.closing==='c3'?'<span class="flag red">검수 의견: 근거 미표시</span>':''}</p>
   ${S.own.trim()?`<p style="font-family:var(--serif)">${esc(S.own)}</p>`:''}</div>`}
function r(){
  const cls=v=>v==='strengthen'?'up':v==='weaken'?'down':'';
  stage.innerHTML=`<div class="scene-enter">
   <div class="kicker">전시 개막</div>
   <h1>검수 보류가 풀렸습니다</h1>
   ${panelHTML()}
   <h2>나의 판단 궤적 — "石島는 이 섬인가?"</h2>
   <div class="traj"><div><b>1900 · 칙령 제41호를 읽고</b><span class="v">${JUDGE1[S.j1900]||'—'}</span></div>
    <div><b>1904 · 군함 기록을 읽고</b><span class="v ${cls(S.u1904)}">${UPD[S.u1904]||'—'}</span></div>
    <div><b>1906 · 울도군수 보고를 읽고</b><span class="v ${cls(S.u1906)}">${UPD[S.u1906]||'—'}</span></div></div>
   <p class="muted">궤적에는 정답이 없습니다. 짝과 비교해 보세요. "나는 어느 자료에서 판단이 움직였고, 왜 그랬는가?"</p>
   <div class="qs"><h3>함께 생각해 볼 질문</h3><ol>
    <li>내 전시 패널에서 ① 사료가 직접 말하는 것, ② 여러 자료를 연결해 해석한 것, ③ 오늘날 우리가 평가하는 것을 하나씩 찾아보자.</li>
    <li>1905년 결정문은 "다른 나라가 점유한 형적이 없다"고 적었다. 1877·1900·1906년의 기록은 이 판단과 어떻게 만나는가?</li>
    <li>1906년 대한제국 정부의 대응에서 할 수 있었던 일과 어려웠던 일은 무엇이었나? 시간 띠를 보며 이야기해 보자.</li></ol></div>
   <p id="saveMsg" class="muted"></p>
   <div class="row"><button class="act ghost" id="retry" hidden>기록을 다시 저장한다</button><button class="act ghost" id="restart">처음부터 다시 조사한다</button></div></div>`;
  $('#restart').onclick=()=>{if(!confirm('조사 기록을 지우고 처음부터 시작할까요?'))return;try{sessionStorage.removeItem(SK)}catch{}location.href=location.pathname+location.search};
  $('#retry').onclick=()=>submitUI(true);
  submitUI(false);
}

/* ---------- 저장 (구조화 값만, 자유서술 제외) ---------- */
function finish(){if(!S.resultId)S.resultId=GAME_ID+'-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));if(!S.completedAt)S.completedAt=new Date().toISOString();save()}
function payload(){finish();const dur=S.startedAt?Math.round((Date.parse(S.completedAt)-Date.parse(S.startedAt))/1000):null;
  return{class:CLASS,game:GAME_ID,timestamp:S.completedAt,choices:{version:VER,record_type:'result',result_id:S.resultId,
    j1900:S.j1900,u1904:S.u1904,u1906:S.u1906,s2_identify:S.s2id,opened:S.opened,sort_errors:S.sortErr,find_misses:S.misses,
    panel_cards:S.panel.cards,claim_levels:S.panel.cards.map(c=>S.panel.claims[c]==='x'?CARDS[c].xt:'direct'),
    review:S.review,review_card:S.reviewCard,support:S.panel.support,closing:S.closing,duration_sec:dur},comment:''}}
async function submit(force){if(NOSAVE||(S.submittedAt&&!force))return 'skip';
  const res=await fetch(SB+'/rest/v1/game_results',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload()),keepalive:true});
  if(!res.ok)throw Error('HTTP '+res.status);S.submittedAt=new Date().toISOString();save();return 'done'}
function submitUI(force){const m=$('#saveMsg');if(!m)return;
  if(NOSAVE){m.textContent='저장 없이 진행하는 모드입니다.';return}
  if(S.submittedAt&&!force){m.textContent='✓ 조사 기록(선택값만)이 저장되었습니다.';return}
  m.textContent='조사 기록을 저장하는 중입니다…';$('#retry').hidden=true;
  submit(force).then(()=>{m.textContent='✓ 조사 기록(선택값만)이 저장되었습니다. 자유롭게 쓴 문장은 저장하지 않습니다.'})
   .catch(()=>{m.textContent='기록 저장에 실패했습니다. 결과 화면은 그대로 사용할 수 있고, 인터넷 연결 뒤 다시 저장할 수 있습니다.';$('#retry').hidden=false})}

/* ---------- 시작 ---------- */
const R={s0,s1,s2,s3,s4,s5,s6,r};
function render(){steps();timeline();tray();R[S.scene]();stage.focus({preventScroll:true});scrollTo(0,0)}
load();if(!S.startedAt){S.startedAt=new Date().toISOString();save()}
render();
})();

</script>
</body>
</html>
