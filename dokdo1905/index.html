<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독도연구소: 1905 파일</title>
<meta name="description" content="1877·1900·1904·1906년의 기록으로 1905년의 편입 조치를 검증하는 사료 탐구 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#1d3440; --desk-line:rgba(255,255,255,.05);
  --paper:#fbf7ee; --ink:#1b2430; --muted:#5b6470; --line:#d6ccb8;
  --sea:#1f4e5f; --sea-soft:#e1ecee;
  --seal:#a3322a; --seal-soft:#f5e1de; --gold:#b08a2e; --mark:#f7dc8a; --mark-soft:rgba(247,220,138,.38);
  --ok:#2f6b45; --ok-soft:#dcebdf; --work:#f6f2e9;
  --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--desk);font-size:17px;line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit}

/* header */
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px;background:#121f27;color:#efe9dc}
.brand{display:flex;align-items:center;gap:10px}
.brand strong{font-family:var(--serif);font-size:18px;display:block;line-height:1.2}
.brand small{font-size:12px;opacity:.7}
.seal{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:900;border-radius:3px;font-size:18px}
.prog{display:flex;gap:4px;list-style:none;margin:0;padding:0;font-size:13px}
.prog li{padding:3px 9px;border-radius:2px;color:#7f8c95;border:1px solid #2c3d47}
.prog li.done{color:#b9d0d6;border-color:#3e5663}
.prog li.now{color:#121f27;background:#efe9dc;border-color:#efe9dc;font-weight:700}

/* timeline */
.timeline{flex:0 0 auto;background:#16262f;border-bottom:1px solid #0e1a20;overflow-x:auto;scrollbar-width:thin}
.tl-track{display:flex;min-width:max-content;padding:8px 18px 6px;position:relative}
.tl-track::before{content:"";position:absolute;left:18px;right:18px;top:17px;height:2px;background:#33494f}
.tl-item{position:relative;width:118px;padding-top:18px;font-size:12px;line-height:1.3;color:#6f8088}
.tl-item .dot{position:absolute;top:3px;left:0;width:14px;height:14px;border-radius:50%;border:2px solid #55686f;background:#16262f}
.tl-item b{display:block;font-weight:700;letter-spacing:.02em}
.tl-item span{display:block;opacity:0;transition:opacity .5s;color:#e9e2d2;padding-right:8px}
.tl-item.file .dot{border-radius:2px}
.tl-item.lit{color:#f0c96a}
.tl-item.lit .dot{background:#f0c96a;border-color:#f0c96a}
.tl-item.lit.file{color:#8fc3d1}
.tl-item.lit.file .dot{background:#8fc3d1;border-color:#8fc3d1}
.tl-item.lit span{opacity:1}
.tl-item.fresh .dot{animation:ping 1.4s ease 2}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(240,201,106,.8)}100%{box-shadow:0 0 0 12px rgba(240,201,106,0)}}

/* panes */
.tabs{display:none}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr)}
.desk{overflow:auto;padding:26px 22px 40px;background:var(--desk) repeating-linear-gradient(90deg,var(--desk-line) 0 1px,transparent 1px 38px)}
.work{overflow:auto;background:var(--work);border-left:1px solid #0e1a20;padding:18px 20px 40px}
.grid.single{grid-template-columns:1fr}
.grid.single .work{display:none}
.enter{animation:enter .35s ease both}
.wcol{display:flex;flex-direction:column;gap:14px}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* work parts */
.vn{display:flex;gap:10px;align-items:flex-start}
.ava{flex:0 0 44px;height:44px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:18px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.bubble{background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:0 8px 8px 8px;font-size:15px;line-height:1.55}
.bubble b.who{display:block;font-size:12px;color:var(--sea);margin-bottom:2px}
.task{background:var(--ink);color:#f5efe2;padding:12px 14px 14px;border-radius:3px}
.task .no{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:#f0c96a;font-weight:700;margin-bottom:4px}
.task .no i{display:inline-flex;gap:4px}
.task .no i u{display:block;width:18px;height:4px;background:#46555f;text-decoration:none}
.task .no i u.on{background:#f0c96a}
.task p{margin:0;font-size:18px;font-weight:700;line-height:1.5}
.task p u{text-decoration:none;background:linear-gradient(transparent 60%,rgba(240,201,106,.55) 60%)}
.task small{display:block;margin-top:6px;font-size:14px;font-weight:400;color:#c7cfd4}
.task.done{background:var(--ok)}
.task.done .no{color:#cfe8d6}
.where{display:inline-block;margin-top:8px;font-size:13px;background:#f0c96a;color:#1b2430;padding:2px 8px;border-radius:2px;font-weight:700}
.note{font-size:15px;background:#fff;border-left:4px solid var(--sea);padding:9px 12px;line-height:1.6}
.note.warn{border-left-color:var(--seal);background:var(--seal-soft)}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.layer{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:2px;margin-right:6px;vertical-align:1px;letter-spacing:.04em}
.layer.fact{background:var(--ink);color:#fff}
.layer.interp{background:var(--gold);color:#fff}
.layer.gov{background:var(--sea);color:#fff}
.q{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.45;margin:0}
.act{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:10px 18px;background:var(--seal);color:#fff;border:0;border-radius:3px;font-weight:700;font-size:17px;cursor:pointer;transition:transform .15s,filter .15s}
.act:hover{filter:brightness(1.08);transform:translateY(-1px)}
.act:active{transform:scale(.98)}
.act.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.act:disabled{background:#b9b2a3;cursor:not-allowed;transform:none;filter:none}
.opts{display:grid;gap:8px}
.opts.row3{grid-template-columns:repeat(3,1fr)}
.opts.row2{grid-template-columns:1fr 1fr}
.opts.wrap{display:flex;flex-wrap:wrap}
.opt{min-height:54px;padding:8px 10px;background:#fff;border:1.5px solid var(--line);border-radius:3px;cursor:pointer;font-size:16px;font-weight:700;text-align:center;line-height:1.35;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--sea)}
.opt.on{border-color:var(--sea);background:var(--sea);color:#fff}
.files h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.files .row{display:flex;flex-wrap:wrap;gap:6px}
.ftab{font-size:12px;padding:4px 8px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--sea);border-radius:2px;white-space:nowrap}
.ftab.new{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}

/* meter */
.meter{background:#fff;border:1px solid var(--line);padding:12px 16px 10px}
.meter h4{margin:0 0 2px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.meter .mq{font-family:var(--serif);font-weight:700;font-size:16px;margin-bottom:44px}
.mtrack{position:relative;height:10px;margin:0 10px;background:linear-gradient(90deg,#d9d2c3,#efe9dc 50%,#cfe0e4);border-radius:5px}
.mtick{position:absolute;top:-3px;width:2px;height:16px;background:#fff}
.mk{position:absolute;bottom:-4px;transform:translateX(-50%);transition:left .6s cubic-bezier(.34,1.3,.64,1);text-align:center;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.mk i{display:block;width:18px;height:18px;margin:2px auto 0;border-radius:50%;background:#fff;border:3px solid #9aa3aa}
.mk.now{color:var(--seal);z-index:2}
.mk.now i{background:var(--seal);border-color:#fff;box-shadow:0 0 0 2px var(--seal)}
.mk.ghost{opacity:.6}
.mk.pend{color:var(--sea);z-index:3}
.mk.pend i{background:var(--sea);border-color:#fff;box-shadow:0 0 0 2px var(--sea);animation:pop .4s ease}
.mends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
.mends b{color:var(--ink)}

/* desk papers */
.sheet{background:var(--paper);color:var(--ink);padding:20px 22px 22px;margin:0 auto 22px;max-width:720px;box-shadow:0 10px 24px rgba(0,0,0,.28);position:relative;border-radius:1px}
.sheet.tilt{transform:rotate(-.4deg)}
.sheet .label{position:absolute;top:-12px;left:18px;background:var(--seal);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;letter-spacing:.06em}
.sheet .label.sea{background:var(--sea)}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px}
.meta span{border:1px solid var(--line);padding:0 6px;background:#fff}
.sheet h3{font-family:var(--serif);font-size:19px;margin:0 0 10px;line-height:1.4}
.body{font-family:var(--serif);font-size:19px;line-height:2.15}
.orig{display:block;margin-top:12px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);line-height:1.6;font-family:var(--serif)}
.seg{display:inline;background:var(--mark-soft);border:0;border-bottom:2px dotted var(--gold);padding:3px 2px;margin:0 1px;font:inherit;line-height:inherit;cursor:pointer;border-radius:2px;text-align:left;transition:background .15s}
.seg:hover{background:var(--mark)}
.seg:focus-visible{outline:3px solid var(--sea);outline-offset:1px}
.seg.hit{background:var(--mark);border-bottom:3px solid var(--seal);font-weight:700}
.seg.hit::after{content:"✓";display:inline-block;margin-left:4px;font-family:var(--sans);font-size:12px;color:#fff;background:var(--seal);border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;vertical-align:2px;font-weight:700}
.seg.off{background:none;border-bottom-color:transparent;cursor:default}
.seg.miss{animation:shake .35s ease}
.seg.hint{animation:hint 1.2s ease infinite}
@keyframes hint{0%,100%{background:var(--mark-soft)}50%{background:var(--mark);box-shadow:0 0 0 3px var(--mark)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.memo{position:absolute;right:-10px;top:-20px;background:#fff3a8;color:#4a3d10;font-size:14px;padding:8px 12px;transform:rotate(3deg);box-shadow:0 4px 10px rgba(0,0,0,.25);max-width:230px;font-weight:700;line-height:1.4}
.hold{display:inline-block;margin-top:14px;border:3px solid var(--seal);color:var(--seal);font-family:var(--serif);font-weight:900;padding:0 10px;transform:rotate(-6deg);font-size:18px}
.hold.ok{border-color:var(--ok);color:var(--ok)}
.mtask{display:none}
.desk-cap{color:#d6e0e3;font-size:14px;text-align:center;margin:0 auto 10px;max-width:720px;font-weight:700}

/* cards & slots on desk */
.tray{max-width:720px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:10px}
.card{min-height:56px;padding:8px 12px;background:var(--paper);border:0;border-top:4px solid var(--sea);border-radius:2px;text-align:left;cursor:pointer;font-size:15px;line-height:1.4;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s;max-width:340px}
.card b{display:block;font-size:11px;color:var(--seal);letter-spacing:.06em}
.card:hover{transform:translateY(-2px)}
.card.sel{box-shadow:0 0 0 4px #f0c96a,0 6px 14px rgba(0,0,0,.35);transform:translateY(-3px)}
.card.used{opacity:.3;pointer-events:none}
.slots{max-width:720px;margin:0 auto 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.slot{min-height:104px;border:2px dashed #6f8a94;padding:10px 12px;background:rgba(255,255,255,.06);color:#dfe8ea;cursor:pointer;border-radius:3px;font-size:15px;transition:background .2s,border-color .2s}
.slot > b{display:block;font-size:14px;margin-bottom:6px;color:#f0c96a}
.slot.ready{border-color:#f0c96a;background:rgba(240,201,106,.14)}
.slot.filled{border-style:solid;border-color:#8fc3d1;background:var(--paper);color:var(--ink)}
.slot.filled > b{color:var(--sea)}
.slot.wrong{animation:shake .35s ease;border-color:#e06a5f}
.slot .placed{font-family:var(--serif);font-size:16px;font-weight:700}

/* map */
.map{background:#efe5cb;position:relative}
.map svg{display:block;width:100%;height:auto;touch-action:manipulation}
.isle{cursor:pointer}
.isle .shape{transition:fill .2s}
.isle:hover .shape{fill:#e7cf8f}
.isle.hit .shape{fill:#f0c96a}
.isle.hint .shape{animation:ihint 1.2s ease infinite}
@keyframes ihint{50%{fill:#f0c96a}}
.maptools{position:absolute;right:8px;top:8px}
.maptools button{min-width:52px;min-height:48px;background:#fff;border:1px solid var(--line);border-radius:3px;font-size:15px;font-weight:700;cursor:pointer}
.modern{opacity:0;transition:opacity .6s}
.modern.show{opacity:1}
.legend{background:var(--sea);color:#fff;padding:6px 12px;font-size:14px}

.check{background:#fff;border:2px solid var(--ink);padding:10px 14px;font-size:15px}
.check h5{margin:0 0 6px;font-size:14px}
.check dl{margin:0;display:grid;gap:2px}
.check dt{font-weight:700;color:var(--ok);font-size:13px}
.check dt.no{color:var(--seal)}
.check dd{margin:0 0 6px}
.gov2{display:grid;gap:8px}
.gov2 div{background:#fff;border:1px solid var(--line);padding:8px 12px;font-size:15px}
.gov2 b{display:block;font-size:12px;color:var(--sea)}

/* exhibition panel */
.expo{max-width:760px;margin:0 auto 18px;background:#fdfcf8;color:var(--ink);padding:24px 26px 26px;box-shadow:0 12px 28px rgba(0,0,0,.35);position:relative;border-top:10px solid var(--sea)}
.expo .ttl{font-family:var(--serif);font-weight:900;font-size:25px;line-height:1.3;border-bottom:3px double var(--ink);padding-bottom:8px;margin-bottom:12px;padding-right:120px}
.expo .ttl small{display:block;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.1em}
.eslot{border:2px dashed #b9ae98;border-radius:3px;padding:10px 12px;margin:0 0 10px;min-height:74px;cursor:pointer;transition:border-color .2s,background .2s}
.eslot .n{font-size:13px;font-weight:700;color:var(--muted)}
.eslot.ready{border-color:var(--gold);background:#fff8e2}
.eslot.full{border-style:solid;border-color:var(--line);background:#fff;cursor:default}
.eslot.focus{border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-soft)}
.eslot .cn{font-size:12px;font-weight:700;color:var(--seal);letter-spacing:.04em}
.eslot .txt{font-family:var(--serif);font-size:17px;font-weight:700;margin-top:2px}
.eslot .lim{font-size:13px;color:var(--muted);margin-top:4px}
.rm{float:right;font-size:13px;border:1px solid var(--line);background:#fff;padding:2px 10px;cursor:pointer;min-height:36px;border-radius:2px}
.rm.inline{float:none;margin-top:6px}
.strips{display:grid;gap:8px;margin-top:8px}
.strip{text-align:left;padding:10px 12px;min-height:52px;background:#f6f1e4;border:1.5px solid var(--line);border-radius:3px;cursor:pointer;font-family:var(--serif);font-size:16px;line-height:1.5}
.strip:hover{border-color:var(--sea);background:#fff}
.closing{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.closing .n{font-size:13px;font-weight:700;color:var(--muted)}
.closing .txt{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.5}
.flag{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;border:1px solid var(--gold);color:var(--gold);padding:0 6px;margin-left:6px;vertical-align:2px}
.flag.red{border-color:var(--seal);color:var(--seal)}
.stamp{position:absolute;right:22px;top:24px;border:4px solid var(--seal);color:var(--seal);font-family:var(--serif);font-weight:900;padding:2px 12px;transform:rotate(-7deg);font-size:20px;background:rgba(255,255,255,.75);animation:stamp .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-7deg);opacity:1}}
textarea{width:100%;min-height:70px;font:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:3px;background:#fff}

/* intro overlay */
.intro{position:fixed;inset:0;z-index:20;background:rgba(14,26,32,.94);display:grid;place-items:center;padding:20px}
.folder{width:min(560px,100%);background:#d9c79c;color:var(--ink);padding:30px 30px 26px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:fold .5s cubic-bezier(.34,1.3,.64,1)}
.folder::before{content:"";position:absolute;left:0;top:-22px;width:40%;height:24px;background:#d9c79c;border-radius:4px 4px 0 0}
.folder .k{font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--seal)}
.folder .yr{font-family:var(--serif);font-size:76px;font-weight:900;line-height:1;margin:6px 0 4px}
.folder .yr.sm{font-size:46px}
.folder .t{font-family:var(--serif);font-size:21px;font-weight:700;margin-bottom:12px}
.folder p{font-size:15px;margin:0 0 18px;color:#3d3522}
.folder .act{background:var(--ink)}
@keyframes fold{from{transform:translateY(30px) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* result */
.res{max-width:820px;margin:0 auto}
.res h1{font-family:var(--serif);color:#f5efe2;font-size:30px;margin:6px 0 14px}
.res .k{color:#f0c96a;font-size:13px;font-weight:700;letter-spacing:.12em}
.res .box{background:var(--work);padding:16px 18px;margin:0 0 16px}
.res .box h2{font-family:var(--serif);font-size:20px;margin:0 0 10px}
.res ol{margin:0;padding-left:20px}
.res .btns{display:flex;flex-wrap:wrap;gap:10px}
.res .btns .act{width:auto;background:var(--work)}
.savemsg{color:#c7d3d7;font-size:14px;margin:0 0 10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0e1a20;color:#fff;padding:10px 18px;border-radius:3px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;z-index:30;border-left:4px solid #f0c96a}
.toast.show{opacity:1}

@media (max-width:860px){
  body{font-size:16px}
  .prog li{padding:2px 6px;font-size:12px}
  .prog li:not(.now){display:none}
  .brand small{display:none}
  .tabs{display:flex;flex:0 0 auto;background:#121f27}
  .tabs button{flex:1;min-height:48px;background:none;border:0;color:#8fa1a9;font-weight:700;font-size:16px;border-bottom:3px solid transparent;position:relative;cursor:pointer}
  .tabs button.on{color:#fff;border-bottom-color:#f0c96a}
  .tabs button.dot::after{content:"";display:inline-block;margin-left:6px;width:9px;height:9px;border-radius:50%;background:#f0c96a;vertical-align:2px}
  .grid{grid-template-columns:1fr}
  body.pane-work .grid:not(.single) .desk{display:none}
  body.pane-desk .grid .work{display:none}
  .work{border-left:0}
  .desk{padding:22px 12px 40px}
  .sheet{padding:16px 14px 18px}
  .body{font-size:17px;line-height:2.1}
  .memo{position:static;transform:none;display:block;margin:0 0 10px;max-width:none}
  .opts.row3{grid-template-columns:1fr}
  .expo{padding:18px 14px}
  .expo .ttl{font-size:21px;padding-right:0}
  .stamp{position:static;display:inline-block;margin-bottom:8px}
  .tl-item{width:100px}
  .mtask{display:block;position:sticky;top:-22px;z-index:4;margin:-22px -12px 16px;background:var(--ink);color:#f5efe2;padding:8px 14px 10px;border-bottom:3px solid #f0c96a;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  .mtask.done{background:var(--ok)}
  .mtask .no{font-size:11px;color:#f0c96a;font-weight:700;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
  .mtask .no i{display:none}
  .mtask p{margin:0;font-size:16px;font-weight:700;line-height:1.45}

function points(pend){const p=[];if(!S.j1900)return p;let v=BASE[S.j1900];p.push(['1900',v]);

function doc({label,labelSea,title,meta=[],segs,orig,key,extra=''}){

function find(key,segs,targets,onDone){
  const root=desk.querySelector(`.body[data-key="${key}"]`),left=new Set(targets.filter(t=>!S.found.includes(key+':'+t)));let miss=0;

function place(root,{items,check,store,errKey='sortErr',onDone}){
  let sel=null;const cards=root.querySelectorAll('.card[data-id]'),slots=root.querySelectorAll('.slot');
  const fill=(slot,id)=>{slot.classList.add('filled');slot.classList.remove('ready','wrong');slot.insertAdjacentHTML('beforeend',`<div class="placed">${items[id].t}</div>`);root.querySelector(`.card[data-id="${id}"]`).classList.add('used')};

    <div class="body" style="line-height:1.9">보고는 다 읽었다. 독도가 일본 영지가 되었다는 말은 <b>전혀 근거가 없으니(全屬無根)</b>, 그 섬의 형편과 일본인이 어떻게 행동했는지 <b>다시 조사하여 보고할 것</b>.</div></article>`;

/* ---------- S6 전시 ---------- */
function s6(){
  if(S.intro)return intro('FILE 06','전시 개막','검수 보류를 풀 패널을 완성한다','조사하며 모은 사료 카드로 패널을 채웁니다. 검수 기준은 하나 — 각 문장이 그 자료가 말할 수 있는 범위를 넘지 않는가.','패널 편집을 시작한다');
  const pc=S.panel.cards,filled=pc.filter(Boolean).length;
  const flagOf=c=>{const d=CARDS[c],k=S.panel.claims[c],sup=S.panel.support[c];if(k!=='x')return '';
    return d.xt==='over'?'<span class="flag red">검수 의견: 자료 범위 밖</span>':sup?`<span class="flag">해석 · ${CARDS[sup].n}와 연결</span>`:'<span class="flag">해석 · 추가 근거 필요</span>'};
  const slotHTML=(i,mode)=>{const c=pc[i];
    if(!c)return `<div class="eslot" data-i="${i}"><div class="n">근거 ${i+1} — 빈칸</div><div class="lim">카드를 고른 뒤 여기를 터치하세요</div></div>`;
    const d=CARDS[c],k=S.panel.claims[c],focusNow=(mode==='claim'&&!k&&pc.findIndex(x=>!S.panel.claims[x])===i)||(mode==='review'&&S.reviewCard===c);
    let inner=`<div class="cn">근거 ${i+1} · ${d.n}</div>`;
    if(mode==='place')inner=`<button type="button" class="rm" data-rm="${i}">빼기</button>`+inner+`<div class="lim">문장은 다음 단계에서 골라요</div>`;
    else if(mode==='claim'&&!k){if(focusNow){const pair=[['d',d.d],['x',d.x]].sort(()=>c.charCodeAt(2)%2?1:-1);inner+=`<div class="strips">${pair.map(([kk,t])=>`<button type="button" class="strip" data-c="${c}" data-k="${kk}">${t}</button>`).join('')}</div>`}
      else inner+=`<div class="lim">차례를 기다리는 중</div>`}
    else if(k){inner+=`<div class="txt">${esc(k==='x'?d.x:d.d)}${mode==='done'?flagOf(c):''}</div>${mode==='done'?`<div class="lim">이 자료만으로 확인하기 어려운 것 — ${d.limit}</div>`:''}${mode==='claim'?`<button type="button" class="rm inline" data-re="${c}">문장 다시 고르기</button>`:''}`}
    return `<div class="eslot full ${focusNow?'focus':''}" data-i="${i}">${inner}</div>`};
  const panel=(mode,closingHTML='')=>`<div class="expo"><div class="ttl"><small>독도연구소 청소년 디지털 전시</small>독도, 1905년 — 그 이전과 이후의 기록</div>
    ${[0,1,2].map(i=>slotHTML(i,mode)).join('')}<div class="closing"><div class="n">맺음 문장</div>${closingHTML||'<div class="lim" style="color:var(--muted);font-size:14px">마지막 단계에서 골라요</div>'}</div></div>`;

  if(S.step===0){
    setDesk(`<p class="desk-cap">① 카드를 한 장 고르고 → ② 패널의 빈칸을 터치하세요</p><div class="tray">${S.cards.map(c=>`<button class="card ${pc.includes(c)?'used':''}" data-c="${c}" type="button"><b>${c}</b>${CARDS[c].n}</button>`).join('')}</div>`+panel('place'));
    setWork(vn('패널에 쓸 근거는 세 장이에요. 1905년 결정문의 판단을 확인하는 데 무엇이 필요했는지 떠올려 보세요.')+
      task(1,4,'사료 카드 <u>세 장</u>을 패널의 빈칸에 놓으세요.',`지금 ${filled} / 3 — 놓은 카드를 빼려면 [빼기]`,filled===3)+`<button class="act" id="next" ${filled===3?'':'disabled'}>이 세 장으로 쓴다</button>`);
    if(filled<3)pane('desk');else pane('work',true);
    let sel=null;
    $$('.tray .card').forEach(x=>x.onclick=()=>{sel=x.dataset.c;$$('.tray .card').forEach(y=>y.classList.toggle('sel',y===x));$$('.eslot:not(.full)').forEach(s=>s.classList.add('ready'))});
    $$('.eslot:not(.full)').forEach(s=>s.onclick=()=>{if(!sel){toast('먼저 위에서 카드를 한 장 고르세요.');return}pc[+s.dataset.i]=sel;save();s6()});
    $$('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();pc[+b.dataset.rm]=null;save();s6()});
    $('#next').onclick=()=>{S.panel.claims={};S.panel.support={};S.review='';S.reviewCard='';step(1)};return}

  if(S.step===1){
    const idx=pc.findIndex(c=>!S.panel.claims[c]),left=idx>=0;
    setDesk(panel('claim'));
    setWork(task(2,4,left?`근거 ${idx+1}(${CARDS[pc[idx]].n})에 쓸 <u>문장</u>을 고르세요.`:'세 문장을 모두 골랐어요.',left?'패널의 빨간 테두리 칸에 두 문장이 있어요. 이 자료가 <b>직접</b> 말하는 것은 어느 쪽일까요? 더 강한 문장을 골라도 돼요 — 대신 검토 의견이 올 수 있어요.':'',!left)+
      `<button class="act" id="next" ${left?'disabled':''}>검토 의견을 받는다</button>`);
    if(left)pane('desk');else pane('work',true);
    $$('.strip').forEach(b=>b.onclick=()=>{S.panel.claims[b.dataset.c]=b.dataset.k;save();s6()});
    $$('[data-re]').forEach(b=>b.onclick=()=>{delete S.panel.claims[b.dataset.re];save();s6()});
    $('#next').onclick=()=>step(2);return}

  if(S.step===2){
    const strong=pc.find(c=>S.panel.claims[c]==='x');
    if(!strong){S.review='none';S.reviewCard='';save();return step(3)}
    const d=CARDS[strong],over=d.xt==='over';S.reviewCard=strong;save();
    setDesk(panel('review'));
    const optsMap=over?{narrow:'표현을 좁힌다',keep:'그대로 둔다'}:{add:'다른 근거를 추가한다',narrow:'표현을 좁힌다',keep:'그대로 둔다'};
    setWork(task(3,4,'검토 의견이 도착했어요.','',false,false)+
      `<article class="sheet" style="margin:10px 0 0;box-shadow:none;border:2px solid var(--seal);transform:none"><span class="label">검토 의견 · 근거 ${pc.indexOf(strong)+1}</span>
       <p style="font-family:var(--serif);margin:6px 0 8px">"${esc(d.x)}"</p>
       <p style="margin:0 0 6px"><b>${over?'이 자료에서는 이 내용을 확인할 수 없어요.':'그 자료 하나만으로 이렇게 말할 수 있나요?'}</b></p>
       <p class="orig" style="margin:0">자료가 말하는 범위 — ${d.limit}</p></article>
       <div id="rv"></div><div id="sup"></div><button class="act" id="next" ${S.review&&(S.review!=='add'||S.panel.support[strong])?'':'disabled'}>의견을 반영한다</button>`);
    pane('work',true);
    const pick=k=>{S.review=k;save();opts($('#rv'),optsMap,k,pick,over?'row2':'row3');
      $('#next').disabled=k==='add'&&!S.panel.support[strong];
      $('#sup').innerHTML=k==='add'?`<p style="margin:0 0 6px;font-weight:700">이 문장을 함께 뒷받침할 카드를 고르세요.</p><div id="supo"></div>`:'';
      if(k==='add'){const m={};S.cards.filter(c=>c!==strong).forEach(c=>m[c]=CARDS[c].n);
        const sp=c=>{S.panel.support[strong]=c;save();opts($('#supo'),m,c,sp,'wrap');$('#next').disabled=false};opts($('#supo'),m,S.panel.support[strong],sp,'wrap')}};
    opts($('#rv'),optsMap,S.review,pick,over?'row2':'row3');if(S.review)pick(S.review);
    $('#next').onclick=()=>{if(S.review==='narrow')S.panel.claims[strong]='d';if(S.review!=='add')delete S.panel.support[strong];save();step(3)};return}

  const cl=S.closing?`<div class="txt">${esc(CLOSING[S.closing].t)}${S.closing==='c3'?'<span class="flag red">검수 의견: 근거 미표시</span>':''}</div><button type="button" class="rm inline" data-cl>맺음 문장 다시 고르기</button>`:
    `<div class="strips">${Object.entries(CLOSING).map(([k,v])=>`<button type="button" class="strip" data-k="${k}">${v.t}</button>`).join('')}</div>`;
  setDesk(panel('done',cl));
  setWork((S.review==='none'?'<div class="note ok">검토 의견: 세 문장 모두 자료가 직접 말하는 범위 안에 있어요. 그렇다면 세 자료를 이어서 무엇을 말할 수 있을까요?</div>':'')+
    task(4,4,S.closing?'맺음 문장을 골랐어요.':'패널을 <u>맺는 문장</u>을 고르세요.',S.closing?'':'패널 맨 아래에 후보 문장 세 개가 있어요.',!!S.closing)+
    (S.closing==='c3'?'<div class="note warn">처음 패널 초안의 결론으로 돌아갔어요. 조사한 근거가 문장에 드러나지 않아요. 그대로 두어도 되지만 검수 의견이 패널에 남아요.</div>':'')+
    `<div><p style="margin:0 0 6px;font-size:14px;color:var(--muted)">덧붙이고 싶은 내 문장 (선택 · 이 기기에서만 보이고 저장·전송되지 않아요)</p><textarea id="own" maxlength="200" placeholder="예: 1905년 결정문은 …">${esc(S.own)}</textarea></div>
     <button class="act" id="next" ${S.closing?'':'disabled'}>전시를 연다</button>`);
  if(!S.closing){pane('desk');setTimeout(()=>{const c=desk.querySelector('.closing');c&&c.scrollIntoView({behavior:'smooth',block:'center'})},200)}else pane('work',true);
  $$('.closing .strip').forEach(b=>b.onclick=()=>{S.closing=b.dataset.k;save();s6()});
  $$('[data-cl]').forEach(b=>b.onclick=()=>{S.closing='';save();s6()});
  $('#own').oninput=e=>{S.own=e.target.value;save()};
  $('#next').onclick=()=>{finish();go('r')};
}

/* ---------- 결과 ---------- */
function r(){
  $('#grid').classList.add('single');$('#tabs').hidden=true;pane('desk');
  const pc=S.panel.cards.filter(Boolean);
  const flagOf=c=>{const d=CARDS[c],k=S.panel.claims[c],sup=S.panel.support[c];if(k!=='x')return '';
    return d.xt==='over'?'<span class="flag red">검수 의견: 자료 범위 밖</span>':sup?`<span class="flag">해석 · ${CARDS[sup].n}와 연결</span>`:'<span class="flag">해석 · 추가 근거 필요</span>'};
  const panel=`<div class="expo"><span class="stamp">검수 완료</span><div class="ttl"><small>독도연구소 청소년 디지털 전시</small>독도, 1905년 — 그 이전과 이후의 기록</div>
    ${pc.map((c,i)=>{const d=CARDS[c],k=S.panel.claims[c];return `<div class="eslot full"><div class="cn">근거 ${i+1} · ${d.n}</div><div class="txt">${esc(k==='x'?d.x:d.d)}${flagOf(c)}</div><div class="lim">이 자료만으로 확인하기 어려운 것 — ${d.limit}</div></div>`}).join('')}
    <div class="closing"><div class="txt">${esc(CLOSING[S.closing]?.t||'')}${S.closing==='c3'?'<span class="flag red">검수 의견: 근거 미표시</span>':''}</div>${S.own.trim()?`<p style="font-family:var(--serif);margin:8px 0 0">${esc(S.own)}</p>`:''}</div></div>`;
  setDesk(`<div class="res"><div class="k">전시 개막</div><h1>검수 보류가 풀렸습니다</h1>${panel}
    <div class="box"><h2>나의 판단 궤적</h2>${meter('','석도 판단계 — 1900 → 1904 → 1906')}
     <p style="margin:10px 0 0;font-size:15px">1900 <b>${JUDGE1[S.j1900]||'—'}</b> → 1904 자료 뒤 <b>${UPD[S.u1904]||'—'}</b> → 1906 자료 뒤 <b>${UPD[S.u1906]||'—'}</b></p>
     <p style="margin:6px 0 0;font-size:14px;color:var(--muted)">궤적에는 정답이 없어요. 짝과 비교해 보세요 — "나는 어느 자료에서 판단이 움직였고, 왜 그랬을까?"</p></div>
    <div class="box"><h2>함께 생각해 볼 질문</h2><ol>
     <li>내 전시 패널에서 ① 사료가 직접 말하는 것, ② 여러 자료를 연결해 해석한 것, ③ 오늘날 우리가 평가하는 것을 하나씩 찾아보자.</li>
     <li>1905년 결정문은 "다른 나라가 점유한 형적이 없다"고 적었다. 1877·1900·1906년의 기록은 이 판단과 어떻게 만나는가?</li>
     <li>1906년 대한제국 정부의 대응에서 할 수 있었던 일과 어려웠던 일은 무엇이었나? 시간 띠를 보며 이야기해 보자.</li></ol></div>
    <p class="savemsg" id="saveMsg"></p>
    <div class="btns"><button class="act ghost" id="retry" hidden>기록을 다시 저장한다</button><button class="act ghost" id="restart">처음부터 다시 조사한다</button></div></div>`);
  $('#restart').onclick=()=>{if(!confirm('조사 기록을 지우고 처음부터 시작할까요?'))return;try{sessionStorage.removeItem(SK)}catch{}location.href=location.pathname+location.search};
  $('#retry').onclick=()=>submitUI(true);submitUI(false);
}

/* ---------- 저장 (구조화 값만, 자유서술 제외) ---------- */
function finish(){if(!S.resultId)S.resultId=GAME_ID+'-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));if(!S.completedAt)S.completedAt=new Date().toISOString();save()}
function payload(){finish();const dur=S.startedAt?Math.round((Date.parse(S.completedAt)-Date.parse(S.startedAt))/1000):null,pc=S.panel.cards.filter(Boolean);
  return{class:CLASS,game:GAME_ID,timestamp:S.completedAt,choices:{version:VER,record_type:'result',result_id:S.resultId,
    j1900:S.j1900,u1904:S.u1904,u1906:S.u1906,meter:points().map(p=>p[1]),s2_identify:S.s2id,opened:S.opened,sort_errors:S.sortErr,find_misses:S.misses,
    panel_cards:pc,claim_levels:pc.map(c=>S.panel.claims[c]==='x'?CARDS[c].xt:'direct'),
    review:S.review,review_card:S.reviewCard,support:S.panel.support,closing:S.closing,duration_sec:dur},comment:''}}
async function submit(force){if(NOSAVE||(S.submittedAt&&!force))return;
  const res=await fetch(SB+'/rest/v1/game_results',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload()),keepalive:true});
  if(!res.ok)throw Error('HTTP '+res.status);S.submittedAt=new Date().toISOString();save()}
function submitUI(force){const m=$('#saveMsg');if(!m)return;
  if(NOSAVE){m.textContent='저장 없이 진행하는 모드입니다.';return}
  if(S.submittedAt&&!force){m.textContent='✓ 조사 기록(선택값만)이 저장되었습니다.';return}
  m.textContent='조사 기록을 저장하는 중입니다…';$('#retry').hidden=true;
  submit(force).then(()=>{m.textContent='✓ 조사 기록(선택값만)이 저장되었습니다. 자유롭게 쓴 문장은 저장하지 않습니다.'})
   .catch(()=>{m.textContent='기록 저장에 실패했습니다. 결과 화면은 그대로 쓸 수 있고, 인터넷 연결 뒤 다시 저장할 수 있습니다.';$('#retry').hidden=false})}

/* ---------- 시작 ---------- */
const R={s0,s1,s2,s3,s4,s5,s6,r};
function render(){$('#grid').classList.remove('single');$('#tabs').hidden=false;prog();timeline();desk.scrollTop=0;work.scrollTop=0;R[S.scene]()}
load();if(!S.startedAt){S.startedAt=new Date().toISOString();save()}
render();
})();
</script>
</body>
</html>
