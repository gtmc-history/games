<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>두 개의 竹島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<!--
  EXPLORE 프로토타입 — 정본 아님 · manifest 미등록 · 서버 저장 없음.
  DESIGN_V2_EXPLORE_VN_2026-09-23.md §9: 1877 장면(원문 확대경 → 섬 가린 항로 재구성 → 원본 겹치기 → 명칭 연결 · 두 竹島).
  지도: assets/sources/kijukdo-yakudo.jpg (1000×841). 좌표는 이 스캔 픽셀 기준 실측.
  v2(사용자 피드백 반영): 섬 위치 찍기 삭제 → 가린 섬 이름에 이름표 붙이기 → 1905 카드를 지도에 올려 '같은 이름, 다른 자리'를 눈으로 보게 한다. 연결 강도·근거 칩 삭제.
-->
<style>
:root{
  color-scheme:dark;
  --night:#101722;--night2:#172233;--line:#2c3a50;--hanji:#efe6d2;--hanji2:#e3d7bd;--ink:#1d1a16;
  --text:#e9e2d2;--muted:#9fa8b6;--red:#c8372d;--brass:#c9a24a;--teal:#6fa7a0;--you:#e0763a;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;--doc:'Gowun Batang','Noto Serif KR',serif;--sans:'Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 80% at 70% -10%,#26344a 0,var(--night) 55%) fixed,var(--night);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;padding-inline:16px;padding-block:0 64px}
button{font:inherit;color:inherit;min-height:48px;padding:10px 16px;border-radius:4px;border:1px solid var(--line);background:var(--night2);cursor:pointer;transition:transform .15s ease,border-color .15s}
button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--brass)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.go{background:var(--brass);border-color:var(--brass);color:#1a1409;font-weight:700}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:rgba(16,23,34,.94);backdrop-filter:blur(6px);z-index:30}
.brand{flex:1;min-width:200px}
.brand small{display:block;font-size:11px;letter-spacing:.18em;color:var(--brass);font-weight:700}
.brand b{font-family:var(--serif);font-size:20px;font-weight:900}
.tag{font-size:11px;letter-spacing:.08em;border:1px solid var(--red);color:#f0b2ab;padding:2px 6px;border-radius:2px}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;font-size:12.5px}
.steps li{padding:4px 8px;border-radius:2px;color:var(--muted);border:1px solid transparent}
.steps li.on{color:var(--text);border-color:var(--brass)}
.steps li.done{color:var(--teal)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:18px}
@media (max-width:860px){.layout{grid-template-columns:1fr}header{position:static}aside{position:static}}
/* VN */
.vn{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(180deg,rgba(23,34,51,.96),rgba(16,23,34,.96));border:1px solid var(--line);border-left:3px solid var(--brass);padding:14px 16px;margin-bottom:16px}
.face{flex:0 0 52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:20px;background:#223149;border:1px solid var(--brass);color:var(--brass)}
.face.seo{background:#2a2a3a;color:#d8b6e6;border-color:#8e7aa0}
.vn .who{font-size:13px;color:var(--brass);font-weight:700}
.vn .who em{font-style:normal;font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.vn p{margin:2px 0 0;font-size:16.5px}
.vn .next{margin-left:auto;align-self:flex-end;min-height:40px;padding:6px 12px;font-size:14px}
/* 문서 */
.sheet{background:var(--hanji);color:var(--ink);padding:22px 22px 18px;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative}
.sheet h2{font-family:var(--serif);font-size:19px;margin:0 0 2px}
.meta{font-size:13px;color:#6b5f4c}
.task{font-weight:700;margin:14px 0 6px;font-size:15px;color:#3b2f22}
.orig{font-family:var(--doc);font-size:clamp(26px,5.2vw,40px);line-height:1.6;letter-spacing:.06em;padding:18px 12px;border:1px solid #c9b995;background:#f6efdf;position:relative;user-select:none;cursor:zoom-in;overflow:hidden;text-align:center;word-break:keep-all}
.orig .t{border-radius:3px;cursor:pointer;transition:background .2s}
.orig .t.found{background:rgba(200,55,45,.18);box-shadow:inset 0 -3px 0 var(--red)}
.lens{position:absolute;width:150px;height:150px;border-radius:50%;border:3px solid #6b5230;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.6);pointer-events:none;overflow:hidden;display:none;background:#f6efdf;z-index:5}
.lens .inner{position:absolute;transform-origin:0 0}
.gloss{font-size:15px;background:#f8f2e4;border-left:3px solid #b39a6a;padding:8px 12px;margin-top:10px}
.gloss b{color:var(--red)}
.hint{font-size:13.5px;color:#6b5f4c;margin-top:6px}
/* 지도 */
.mapbox{position:relative;width:100%;max-width:100%;aspect-ratio:1000/841;background:#d9d3c2;border:1px solid #9c8a64;overflow:hidden;touch-action:manipulation}
.mapbox img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.mask{position:absolute;background:rgba(222,215,196,.97);box-shadow:0 0 18px 10px rgba(222,215,196,.97);transition:opacity .25s;display:grid;place-items:center;color:#8a7b5c;font-size:11px;letter-spacing:.14em}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0}
.clue{background:#f8f2e4;border:1px dashed #a88f5f;padding:8px 10px;font-size:14px}
.clue .jp{font-family:var(--doc);font-size:18px;color:var(--red)}
.readout{font-size:14px;margin-top:8px;color:#3b2f22;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sheet button{background:#fbf6ea;border-color:#b8a57c;color:var(--ink)}
.sheet button.go{background:#2b3a52;border-color:#2b3a52;color:#f5ecd6}
.sheet button.sel{border-color:var(--red);background:#f6ddd6;font-weight:700}
input[type=range]{width:min(320px,100%);accent-color:var(--red)}
.compare{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;font-variant-numeric:tabular-nums}
.compare td,.compare th{border-bottom:1px solid #d3c4a3;padding:5px 6px;text-align:left}
/* 명칭 */
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.nc{background:#fbf6ea;border:1px solid #b8a57c;padding:8px 10px;text-align:left;min-height:64px;display:block;width:100%}
.nc .n{font-family:var(--doc);font-size:22px;display:block;line-height:1.2}
.nc .s{font-size:12px;color:#6b5f4c}
.nc.pick{outline:3px solid var(--red)}
.links{margin-top:12px;display:grid;gap:6px}
.link{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f8f2e4;border-left:4px solid #b39a6a;padding:6px 10px;font-size:14px}
.link.k-ok{border-color:#3b7a5c}.link.k-maybe{border-color:#c9a24a}.link.k-hold{border-color:#8a8a8a}
.pill{font-size:12px;padding:1px 7px;border-radius:9px;background:#e7dcc2}
.picker{background:#fff9ec;border:1px solid #c9b995;padding:10px;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{min-height:40px;padding:6px 10px;font-size:13.5px}
.aha{background:#20150f;color:#f3e3c2;border:1px solid var(--red);padding:14px 16px;margin-top:14px;font-size:15.5px}
.aha b{color:#ffb4a8}
/* 노트 */
aside{align-self:start;position:sticky;top:90px}
.note{background:#151f2e;border:1px solid var(--line);padding:14px}
.note h3{font-family:var(--serif);font-size:15px;margin:0 0 8px;color:var(--brass)}
.card{background:var(--hanji2);color:var(--ink);padding:8px 10px;margin-top:8px;border-radius:2px;font-size:13.5px;animation:in .35s ease}
.card .n{font-family:var(--doc);font-size:18px;display:block}
.card .l{font-size:11px;letter-spacing:.06em;color:#7a6a4d}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
pre{white-space:pre-wrap;word-break:break-all;font-size:12.5px;background:#0c121b;color:#b9c4d2;padding:10px;border:1px solid var(--line);margin:8px 0 0}
.small{font-size:12.5px;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tagbtn{font-family:var(--doc);font-size:19px;background:#fbf6ea;border:2px solid #7a5b2e;color:var(--ink);padding:6px 14px;min-height:48px}
.tagbtn small{display:block;font-family:var(--sans);font-size:11px;color:#6b5f4c}
.tagbtn.pick{border-color:var(--red);background:#f6ddd6}
.tagbtn.used{opacity:.45}
.sheet .hot,.hot{position:absolute;border:2px dashed transparent;border-radius:50%;background:transparent;transform:none!important;min-height:0;padding:0;transition:border-color .2s,background .2s}
.sheet .armed .hot,.armed .hot{border-color:rgba(200,55,45,.75);background:rgba(200,55,45,.06);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(200,55,45,.16)}}
.stick{position:absolute;transform:translate(-50%,-100%);font-family:var(--doc);font-size:clamp(12px,2.2vw,18px);line-height:1.2;padding:3px 8px;background:#fffaf0;border:2px solid #7a5b2e;color:var(--ink);white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25);pointer-events:none;animation:drop .45s cubic-bezier(.34,1.56,.64,1)}
.stick.y05{background:#20150f;color:#ffd7cf;border-color:var(--red)}
.stick.map{background:#1f6d5a;color:#eafff8;border-color:#1f6d5a}
@keyframes drop{from{opacity:0;transform:translate(-50%,-160%)}to{opacity:1;transform:translate(-50%,-100%)}}
.card05{display:flex;gap:12px;align-items:center;background:#20150f;color:#f3e3c2;border:1px solid var(--red);padding:10px 14px;margin:10px 0}
.card05 .n{font-family:var(--doc);font-size:26px;color:#ffb4a8}
.card05 button{margin-left:auto;background:var(--red)!important;border-color:var(--red)!important;color:#fff!important;font-weight:700}
.choices{display:grid;gap:8px;margin-top:10px}
.choices button{text-align:left;min-height:56px}
.layer{font-size:11px;letter-spacing:.06em;padding:1px 6px;border-radius:2px;background:#e7dcc2;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><small>DOKDO HISTORY LAB · D-2 오후 · 수장고</small><b>두 개의 竹島</b></div>
  <span class="tag">EXPLORE · 임시 그림 없음 · 저장 없음</span>
  <ol class="steps" id="steps"><li>원문</li><li>이름표</li><li>1905 카드</li><li>기록</li></ol>
</header>

<div class="layout">
  <main>
    <div class="vn" id="vn"></div>
    <section id="stage"></section>
  </main>
  <aside>
    <div class="note">
      <h3>조사 노트</h3>
      <div id="notes"></div>
    </div>
    <p class="small">1905 장면은 이미 마쳤다고 가정합니다(노트의 첫 카드). 이 프로토타입은 1877 장면만 다룹니다.</p>
  </aside>
</div>
</div>

<script>
'use strict';
const MAP_SRC='../../assets/sources/kijukdo-yakudo.jpg';
// 스캔 픽셀 실측(1000×841)
const BIG={x:300,y:235,r:120,top:118}, SMALL={x:452,y:405,r:52,top:380};
// 섬 이름·섬 이름이 드러나는 주기만 가린다(섬 그림은 보인다)
const LABEL_MASKS=[{x:283,y:160,w:40,h:115},{x:436,y:388,w:34,h:30},{x:192,y:238,w:56,h:176},{x:372,y:300,w:62,h:86}];
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const S={step:0,found:new Set(),tags:{},pick:null,y05:null,y05tries:0,record:null};

const notes=[{n:'竹島',l:'1905 · 일본 내각 결정·시마네현 고시',t:'오키에서 서북쪽, 사람이 살지 않는 섬(무인도)을 “竹島”라 부르고 오키도사 소관으로 결정.'}];
function addNote(n,l,t){if(notes.some(x=>x.n===n&&x.l===l))return;notes.push({n,l,t});renderNotes()}
function renderNotes(){$('#notes').innerHTML=notes.map(c=>`<div class="card"><span class="l">${esc(c.l)}</span><span class="n">${esc(c.n)}</span>${esc(c.t)}</div>`).join('')}
function vn(face,who,text,btn,cb){
  $('#vn').innerHTML=`<div class="face ${face==='서'?'seo':''}" aria-hidden="true">${face}</div><div><div class="who">${esc(who)}<em>스토리 연출 · 가상 인물</em></div><p>${text}</p></div>${btn?`<button class="next" type="button" id="vnNext">${esc(btn)} ›</button>`:''}`;
  if(btn)$('#vnNext').onclick=cb;
}
function steps(){scrollTo(0,0);[...document.querySelectorAll('#steps li')].forEach((li,i)=>{li.className=i===S.step?'on':i<S.step?'done':''})}
const pct=(v,t)=>`${v/t*100}%`;

/* ---------- 1. 원문 ---------- */
const TOKENS=[['伺之趣',0],['竹島',1],['外一島',2],['之儀',0],['本邦關係無之',0],['儀ト可相心得事',0]];
function renderOrig(){
  S.step=0;steps();
  vn('한','한 연구원','1905년 문서에서 이 섬을 “竹島”라고 불렀지? 그런데 28년 전 일본 정부 문서에도 <b>같은 글자</b>가 나와. 원문에서 섬을 가리키는 말 두 개를 찾아 눌러 봐.');
  $('#stage').innerHTML=`<div class="sheet">
    <h2>1877년 태정관 지령 — 원문 핵심 구절</h2>
    <div class="meta">일본 내무성 질의 → 태정관 지령 · 1877 · 소장: 일본 국립공문서관</div>
    <div class="orig" id="orig" style="margin-top:14px"><span id="origText">${TOKENS.map(([w,i])=>i?`<span class="t" data-i="${i}" role="button" tabindex="0">${w}</span>`:`<span>${w}</span>`).join('')}</span><div class="lens" id="lens"><div class="inner" id="lensInner"></div></div></div>
    <div class="gloss">현대어: 질의한 취지의 <b>竹島 외 1도</b>의 건은 본방(일본)과 관계없다는 것으로 알 것.</div>
    <div class="hint" id="found">섬을 가리키는 말 0 / 2</div>
  </div>`;
  const orig=$('#orig'),lens=$('#lens'),inner=$('#lensInner');
  inner.innerHTML=$('#origText').outerHTML.replace('id="origText"','');
  const Z=2;
  orig.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=orig.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    lens.style.display='block';lens.style.left=(x-75)+'px';lens.style.top=(y-75)+'px';
    const cs=getComputedStyle(orig);inner.style.width=r.width+'px';inner.style.padding=cs.padding;inner.style.textAlign='center';
    inner.style.transform=`translate(${75-x*Z}px,${75-y*Z}px) scale(${Z})`});
  orig.addEventListener('pointerleave',()=>lens.style.display='none');
  const hit=el=>{const i=+el.dataset.i;S.found.add(i);document.querySelectorAll(`.t[data-i="${i}"]`).forEach(x=>x.classList.add('found'));
    if(i===1)addNote('竹島','1877 · 태정관 지령','지령이 다룬 첫 번째 섬. 일건은 17세기 말 울릉도를 둘러싼 조선과의 문서 왕래를 조사한 뒤 올라왔다.');
    if(i===2)addNote('外一島','1877 · 태정관 지령','“그 밖의 섬 하나”. 본문에는 이름이 없다.');
    $('#found').textContent=`섬을 가리키는 말 ${S.found.size} / 2`;
    if(S.found.size===2)vn('서','서윤','1905년에도 “竹島”, 1877년에도 “竹島”… 그럼 같은 섬이죠?','지도를 펼친다',renderTags)};
  orig.querySelectorAll('.t').forEach(el=>{el.onclick=()=>hit(el);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(el)}}});
}

/* ---------- 지도 공통 ---------- */
function mapHTML(){return `<div class="mapbox" id="map"><img src="${MAP_SRC}" alt="1876년 시마네현 제출 지도 「磯竹島略圖」(기죽도약도). 큰 섬과 작은 섬, 오른쪽 아래 隠岐, 왼쪽 朝鮮國 해안선이 그려져 있다." draggable="false">
  ${LABEL_MASKS.map((m,i)=>`<div class="mask" data-m="${i}" style="left:${pct(m.x,1000)};top:${pct(m.y,841)};width:${pct(m.w,1000)};height:${pct(m.h,841)}"></div>`).join('')}
  ${[['big',BIG,'큰 섬'],['small',SMALL,'작은 섬']].map(([k,p,l])=>`<button class="hot" type="button" data-hot="${k}" aria-label="${l}" style="left:${pct(p.x-p.r,1000)};top:${pct(p.y-p.r,841)};width:${pct(p.r*2,1000)};height:${pct(p.r*2,841)}"></button>`).join('')}
  <div id="sticks"></div></div>`}
function stick(cls,text,p,dy=0){return `<div class="stick ${cls}" style="left:${pct(p.x,1000)};top:${pct(p.top+dy,841)}">${text}</div>`}
function drawSticks(extra=''){
  const out=[];let off={big:0,small:0};
  for(const [tag,isl] of Object.entries(S.tags)){const p=isl==='big'?BIG:SMALL;out.push(stick('',tag==='t77'?'竹島 <small>1877</small>':'外一島 <small>1877</small>',p,off[isl]));off[isl]-=34}
  if(S.revealed){out.push(stick('map','磯竹島 <small>지도 표기</small>',{x:BIG.x-150,top:BIG.y+30}),stick('map','松島 <small>지도 표기</small>',{x:SMALL.x,top:SMALL.y+SMALL.r+40}))}
  if(S.y05){const p=S.y05==='big'?BIG:SMALL;out.push(stick('y05','竹島 <small>1905</small>',p,off[S.y05]))}
  $('#sticks').innerHTML=out.join('')+extra;
}

/* ---------- 2. 이름표 붙이기 ---------- */
function renderTags(){
  S.step=1;steps();
  vn('한','한 연구원','같은 일건에 편철된 1876년 시마네현 지도야. 섬은 두 개. <b>섬 이름은 가려 뒀어.</b> 지령의 竹島와 外一島는 각각 어느 섬일까? 이름표를 눌러 섬에 붙여 봐.');
  $('#stage').innerHTML=`<div class="sheet">
    <h2>「磯竹島略圖」 — 1876년 시마네현 제출, 지령과 같은 일건에 편철</h2>
    <div class="meta">섬 이름 표기만 가린 상태</div>
    <div class="clues">
      <div class="clue">일건: 내무성은 <b>17세기 말 울릉도를 둘러싼 조선과의 문서 왕래</b>를 조사한 뒤 “竹島 외 1도”를 물었다.</div>
      <div class="clue">지도 주기: 한 섬에서 <span class="jp">朝鮮國</span>을 바라보면 약 <span class="jp">五十里許</span>.</div>
    </div>
    <div class="tags"><button class="tagbtn" type="button" data-tag="t77">竹島<small>1877 지령</small></button><button class="tagbtn" type="button" data-tag="o77">外一島<small>1877 지령</small></button></div>
    ${mapHTML()}
    <div class="row"><button class="go" id="reveal" type="button" disabled>가린 이름 걷기</button></div>
  </div>`;
  bindTags();drawSticks();
}
function bindTags(){
  document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{S.pick=b.dataset.tag;document.querySelectorAll('[data-tag]').forEach(x=>x.classList.toggle('pick',x===b));$('#map').classList.add('armed')});
  document.querySelectorAll('[data-hot]').forEach(h=>h.onclick=()=>{
    if(S.step===1&&S.pick){const isl=h.dataset.hot;for(const k in S.tags)if(S.tags[k]===isl)delete S.tags[k];S.tags[S.pick]=isl;S.pick=null;
      document.querySelectorAll('[data-tag]').forEach(x=>{x.classList.remove('pick');x.classList.toggle('used',!!S.tags[x.dataset.tag])});$('#map').classList.remove('armed');drawSticks();
      $('#reveal').disabled=Object.keys(S.tags).length<2}
    else if(S.step===2&&S.armed05)place05(h.dataset.hot)});
  if($('#reveal'))$('#reveal').onclick=reveal;
}
function reveal(){
  S.revealed=true;document.querySelectorAll('.mask').forEach(m=>m.style.opacity=0);drawSticks();$('#reveal').hidden=true;
  const ok=S.tags.t77==='big';
  addNote('磯竹島 · 松島','1876 · 시마네현 제출 지도','큰 섬에 “磯竹島”, 작은 섬에 “松島”라고 적혀 있다.');
  if(ok)vn('한','한 연구원','지도에는 큰 섬 <b>磯竹島</b>, 작은 섬 <b>松島</b>. 네 이름표와 나란히 보이지? 이제 노트 맨 위의 <b>1905년 竹島</b> 카드를 이 지도에 올려 보자.','1905 카드 꺼내기',render05);
  else vn('한','한 연구원','지도 표기와 네 이름표가 엇갈렸네. 일건이 무엇을 조사했는지, 朝鮮國과 가까운 섬이 어느 쪽인지 다시 보고 옮겨 붙여도 돼.','이대로 1905 카드 꺼내기',render05);
  document.querySelectorAll('[data-tag]').forEach(b=>b.classList.remove('used'));
  S.step=1;// 옮기기 허용
}

/* ---------- 3. 1905 카드 ---------- */
function render05(){
  S.step=2;steps();S.armed05=false;
  vn('서','서윤','1905년의 竹島는 “오키에서 서북쪽, <b>사람이 살지 않는 섬</b>”이라고 했어요. 이 지도에서는 어느 섬 자리일까요?');
  $('#stage').innerHTML=`<div class="sheet">
    <h2>1905년의 竹島를 1876년 지도 위에</h2>
    <div class="meta">1905 결정·고시의 설명과 1876 지도의 두 섬을 비교</div>
    <div class="card05"><span class="n">竹島</span><span>1905 · 오키에서 서북쪽의 무인도</span><button type="button" id="arm05">지도에 올리기</button></div>
    ${mapHTML()}
    <div id="after05"></div>
  </div>`;
  document.querySelectorAll('.mask').forEach(m=>m.style.opacity=0);
  bindTags();drawSticks();
  $('#arm05').onclick=()=>{S.armed05=true;$('#map').classList.add('armed');$('#arm05').textContent='섬을 누르세요'};
}
function place05(isl){
  S.y05=isl;S.armed05=false;S.y05tries++;$('#arm05').textContent='다시 올리기';$('#map').classList.remove('armed');drawSticks();
  if(isl==='small'){
    addNote('竹島 (1905) ↔ 松島 자리','1877 × 1905 · 내가 올린 위치','1905년의 竹島 설명(오키 쪽, 무인도)은 1876 지도의 작은 섬 松島 자리와 맞는다.');
    vn('서','서윤','어… 잠깐만요. 1905년의 <b>竹島</b>가 올라간 섬에, 1876년 지도는 <b>松島</b>라고 써 놨어요. 1877년의 <b>竹島</b>는 저쪽 큰 섬이고요.','노트에 기록하기',renderRecord);
    $('#after05').innerHTML=`<div class="aha"><b>같은 이름, 다른 자리.</b> 지도 위에 竹島가 두 번 붙었습니다 — 큰 섬(1877)과 작은 섬(1905).</div>`;
  }else{
    vn('한','한 연구원','큰 섬에 올렸구나. 이 섬엔 산이 그려져 있고, 일건은 이 섬을 울릉도 기록과 함께 다뤘어. 1905년의 설명 “<b>사람이 살지 않는 섬</b>”과 맞는지 한 번 더 볼래?','다시 올리기',()=>{$('#arm05').click()});
    $('#after05').innerHTML=`<div class="row"><button type="button" id="keep05">그래도 이 섬이라고 본다</button></div>`;
    $('#keep05').onclick=renderRecord;
  }
}

/* ---------- 4. 기록 ---------- */
function renderRecord(){
  S.step=3;steps();
  vn('한','한 연구원','노트에 한 줄만 남기자. 원문에 적힌 <b>사실</b>과, 여러 자료를 이어서 얻은 <b>해석</b>을 섞지 않게.');
  const opts=[
    ['diff','1877년의 竹島와 1905년의 竹島는 이름은 같지만, 1876년 지도에서 서로 다른 섬 자리를 가리킨다.','해석 · 근거: 1877 일건, 1876 지도, 1905 결정'],
    ['same','1877년의 竹島와 1905년의 竹島는 같은 섬이다.','해석 · 근거: 같은 이름'],
    ['hold','두 竹島가 같은 섬인지는 아직 판단하지 않는다. 1905년 섬의 위치를 더 확인해야 한다.','보류']];
  $('#stage').innerHTML=`<div class="sheet">
    <h2>조사 노트에 남길 문장</h2>
    <div class="meta">사실: 1877 지령에 “竹島 外一島”, 1876 지도에 “磯竹島·松島”, 1905 결정에 “竹島”라고 적혀 있다.</div>
    <div class="choices">${opts.map(([k,t,l])=>`<button type="button" data-rec="${k}">${esc(t)}<span class="layer">${esc(l)}</span></button>`).join('')}</div>
    <div id="recOut"></div>
  </div>`;
  document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{S.record=b.dataset.rec;document.querySelectorAll('[data-rec]').forEach(x=>x.classList.toggle('sel',x===b));
    const fb={diff:'근거가 셋(일건·지도·결정)으로 받쳐지는 해석입니다. 단, 원문 어디에도 “두 竹島는 다르다”고 적혀 있지는 않다는 점 — 그래서 해석층입니다.',
      same:'이름이 같다는 것 하나만 근거입니다. 1876 지도에서 1905년 竹島가 올라간 자리와 1877년 竹島의 자리를 다시 비교해 보세요.',
      hold:'보류도 정당한 기록입니다. 4막(1906)에서 이 노트가 다시 펼쳐집니다.'}[S.record];
    const payload={scene:'1877',tags:S.tags,y05:S.y05,y05_tries:S.y05tries,record:S.record};
    $('#recOut').innerHTML=`<div class="gloss" style="margin-top:12px">${esc(fb)}</div><div class="hint" style="margin-top:12px">저장된다면 남는 값(학생 문장 원문 없음):</div><pre>${esc(JSON.stringify(payload))}</pre>`;
    addNote(S.record==='diff'?'竹島 ≠ 竹島':S.record==='same'?'竹島 = 竹島 ?':'竹島 ? 竹島','1877 × 1905 · 내 해석',b.textContent.replace(/(해석|보류).*/,'').trim())});
}
renderNotes();renderOrig();
</script>
</body>
</html>
