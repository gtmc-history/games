<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>두 개의 竹島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<!--
  EXPLORE 프로토타입 — 정본 아님 · manifest 미등록 · 서버 저장 없음.
  DESIGN_V2_EXPLORE_VN_2026-09-23.md §9: 1877 장면(원문 확대경 → 섬 가린 항로 재구성 → 원본 겹치기 → 명칭 연결 · 두 竹島).
  지도: assets/sources/kijukdo-yakudo.jpg (1000×841). 좌표는 이 스캔 픽셀 기준 실측.
  방향 주기는 전사 검수 전이라 사용하지 않고, 거리 주기(八十里許·四十里許·五十里許)만 쓴다.
-->
<style>
:root{
  color-scheme:dark;
  --night:#101722;--night2:#172233;--line:#2c3a50;--hanji:#efe6d2;--hanji2:#e3d7bd;--ink:#1d1a16;
  --text:#e9e2d2;--muted:#9fa8b6;--red:#c8372d;--brass:#c9a24a;--teal:#6fa7a0;--you:#e0763a;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;--doc:'Gowun Batang','Noto Serif KR',serif;--sans:'Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 80% at 70% -10%,#26344a 0,var(--night) 55%) fixed,var(--night);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;padding-inline:16px;padding-block:0 64px}
button{font:inherit;color:inherit;min-height:48px;padding:10px 16px;border-radius:4px;border:1px solid var(--line);background:var(--night2);cursor:pointer;transition:transform .15s ease,border-color .15s}
button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--brass)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.go{background:var(--brass);border-color:var(--brass);color:#1a1409;font-weight:700}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:rgba(16,23,34,.94);backdrop-filter:blur(6px);z-index:30}
.brand{flex:1;min-width:200px}
.brand small{display:block;font-size:11px;letter-spacing:.18em;color:var(--brass);font-weight:700}
.brand b{font-family:var(--serif);font-size:20px;font-weight:900}
.tag{font-size:11px;letter-spacing:.08em;border:1px solid var(--red);color:#f0b2ab;padding:2px 6px;border-radius:2px}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;font-size:12.5px}
.steps li{padding:4px 8px;border-radius:2px;color:var(--muted);border:1px solid transparent}
.steps li.on{color:var(--text);border-color:var(--brass)}
.steps li.done{color:var(--teal)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:18px}
@media (max-width:860px){.layout{grid-template-columns:1fr}header{position:static}aside{position:static}}
/* VN */
.vn{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(180deg,rgba(23,34,51,.96),rgba(16,23,34,.96));border:1px solid var(--line);border-left:3px solid var(--brass);padding:14px 16px;margin-bottom:16px}
.face{flex:0 0 52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:20px;background:#223149;border:1px solid var(--brass);color:var(--brass)}
.face.seo{background:#2a2a3a;color:#d8b6e6;border-color:#8e7aa0}
.vn .who{font-size:13px;color:var(--brass);font-weight:700}
.vn .who em{font-style:normal;font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.vn p{margin:2px 0 0;font-size:16.5px}
.vn .next{margin-left:auto;align-self:flex-end;min-height:40px;padding:6px 12px;font-size:14px}
/* 문서 */
.sheet{background:var(--hanji);color:var(--ink);padding:22px 22px 18px;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative}
.sheet h2{font-family:var(--serif);font-size:19px;margin:0 0 2px}
.meta{font-size:13px;color:#6b5f4c}
.task{font-weight:700;margin:14px 0 6px;font-size:15px;color:#3b2f22}
.orig{font-family:var(--doc);font-size:clamp(26px,5.2vw,40px);line-height:1.6;letter-spacing:.06em;padding:18px 12px;border:1px solid #c9b995;background:#f6efdf;position:relative;user-select:none;cursor:zoom-in;overflow:hidden;text-align:center;word-break:keep-all}
.orig .t{border-radius:3px;cursor:pointer;transition:background .2s}
.orig .t.found{background:rgba(200,55,45,.18);box-shadow:inset 0 -3px 0 var(--red)}
.lens{position:absolute;width:150px;height:150px;border-radius:50%;border:3px solid #6b5230;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.6);pointer-events:none;overflow:hidden;display:none;background:#f6efdf;z-index:5}
.lens .inner{position:absolute;transform-origin:0 0}
.gloss{font-size:15px;background:#f8f2e4;border-left:3px solid #b39a6a;padding:8px 12px;margin-top:10px}
.gloss b{color:var(--red)}
.hint{font-size:13.5px;color:#6b5f4c;margin-top:6px}
/* 지도 */
.mapbox{position:relative;width:100%;max-width:100%;aspect-ratio:1000/841;background:#d9d3c2;border:1px solid #9c8a64;overflow:hidden;touch-action:manipulation}
.mapbox img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.mask{position:absolute;background:rgba(222,215,196,.97);box-shadow:0 0 18px 10px rgba(222,215,196,.97);transition:opacity .25s;display:grid;place-items:center;color:#8a7b5c;font-size:11px;letter-spacing:.14em}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0}
.clue{background:#f8f2e4;border:1px dashed #a88f5f;padding:8px 10px;font-size:14px}
.clue .jp{font-family:var(--doc);font-size:18px;color:var(--red)}
.readout{font-size:14px;margin-top:8px;color:#3b2f22;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sheet button{background:#fbf6ea;border-color:#b8a57c;color:var(--ink)}
.sheet button.go{background:#2b3a52;border-color:#2b3a52;color:#f5ecd6}
.sheet button.sel{border-color:var(--red);background:#f6ddd6;font-weight:700}
input[type=range]{width:min(320px,100%);accent-color:var(--red)}
.compare{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;font-variant-numeric:tabular-nums}
.compare td,.compare th{border-bottom:1px solid #d3c4a3;padding:5px 6px;text-align:left}
/* 명칭 */
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.nc{background:#fbf6ea;border:1px solid #b8a57c;padding:8px 10px;text-align:left;min-height:64px;display:block;width:100%}
.nc .n{font-family:var(--doc);font-size:22px;display:block;line-height:1.2}
.nc .s{font-size:12px;color:#6b5f4c}
.nc.pick{outline:3px solid var(--red)}
.links{margin-top:12px;display:grid;gap:6px}
.link{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f8f2e4;border-left:4px solid #b39a6a;padding:6px 10px;font-size:14px}
.link.k-ok{border-color:#3b7a5c}.link.k-maybe{border-color:#c9a24a}.link.k-hold{border-color:#8a8a8a}
.pill{font-size:12px;padding:1px 7px;border-radius:9px;background:#e7dcc2}
.picker{background:#fff9ec;border:1px solid #c9b995;padding:10px;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{min-height:40px;padding:6px 10px;font-size:13.5px}
.aha{background:#20150f;color:#f3e3c2;border:1px solid var(--red);padding:14px 16px;margin-top:14px;font-size:15.5px}
.aha b{color:#ffb4a8}
/* 노트 */
aside{align-self:start;position:sticky;top:90px}
.note{background:#151f2e;border:1px solid var(--line);padding:14px}
.note h3{font-family:var(--serif);font-size:15px;margin:0 0 8px;color:var(--brass)}
.card{background:var(--hanji2);color:var(--ink);padding:8px 10px;margin-top:8px;border-radius:2px;font-size:13.5px;animation:in .35s ease}
.card .n{font-family:var(--doc);font-size:18px;display:block}
.card .l{font-size:11px;letter-spacing:.06em;color:#7a6a4d}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
pre{white-space:pre-wrap;word-break:break-all;font-size:12.5px;background:#0c121b;color:#b9c4d2;padding:10px;border:1px solid var(--line);margin:8px 0 0}
.small{font-size:12.5px;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><small>DOKDO HISTORY LAB · D-2 오후 · 수장고</small><b>두 개의 竹島</b></div>
  <span class="tag">EXPLORE · 임시 그림 없음 · 저장 없음</span>
  <ol class="steps" id="steps"><li>원문</li><li>항로 재구성</li><li>겹쳐 보기</li><li>명칭 연결</li></ol>
</header>

<div class="layout">
  <main>
    <div class="vn" id="vn"></div>
    <section id="stage"></section>
  </main>
  <aside>
    <div class="note">
      <h3>조사 노트</h3>
      <div id="notes"></div>
    </div>
    <p class="small">1905 장면은 이미 마쳤다고 가정합니다(노트의 첫 카드). 이 프로토타입은 1877 장면만 다룹니다.</p>
  </aside>
</div>
</div>

<script>
'use strict';
const MAP_SRC='../../assets/sources/kijukdo-yakudo.jpg';
// 스캔 픽셀 실측(1000×841)
const OKI={x:810,y:730}, SMALL={x:452,y:403}, ISO={x:300,y:235};
const PX_PER_RI=Math.hypot(OKI.x-SMALL.x,OKI.y-SMALL.y)/80; // 지도 자체 축척: 오키→작은 섬 주기 80里
const MASKS=[{x:188,y:108,w:212,h:315},{x:368,y:292,w:134,h:150},{x:636,y:578,w:104,h:110}];
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const S={step:0,found:new Set(),you:{small:null,iso:null},reveal:0,links:[],same:null,pick:null};

const notes=[{n:'竹島',l:'1905 · 일본 내각 결정',t:'섬을 “다케시마(竹島)”라 부르고 오키도사 소관으로 결정. 고시: 오키에서 서북 85浬, 좌표 북위 37°9′30″'}];
function addNote(n,l,t){if(notes.some(x=>x.n===n&&x.l===l))return;notes.push({n,l,t});renderNotes()}
function renderNotes(){$('#notes').innerHTML=notes.map(c=>`<div class="card"><span class="l">${esc(c.l)}</span><span class="n">${esc(c.n)}</span>${esc(c.t)}</div>`).join('')}

function vn(face,who,text,btn,cb){
  $('#vn').innerHTML=`<div class="face ${face==='서'?'seo':''}" aria-hidden="true">${face}</div><div><div class="who">${esc(who)}<em>스토리 연출 · 가상 인물</em></div><p>${text}</p></div>${btn?`<button class="next" type="button" id="vnNext">${esc(btn)} ›</button>`:''}`;
  if(btn)$('#vnNext').onclick=cb;
}
function steps(){scrollTo({top:0,behavior:'smooth'});[...document.querySelectorAll('#steps li')].forEach((li,i)=>{li.className=i===S.step?'on':i<S.step?'done':''})}

/* ---------- 1. 원문 확대경 ---------- */
const TOKENS=[['伺之趣',0],['竹島',1],['外一島',2],['之儀',0],['本邦關係無之',3],['儀ト可相心得事',0]];
const FIND={1:{n:'竹島',l:'1877 · 태정관 지령',t:'지령이 다룬 첫 번째 섬의 이름. 일건은 17세기 말 울릉도를 둘러싼 조선과의 문서 왕래를 조사한 뒤 이 질의를 올렸다.'},
  2:{n:'外一島',l:'1877 · 태정관 지령',t:'“그 밖의 섬 하나”. 지령 본문은 이 섬의 이름을 적지 않는다.'},
  3:{n:'本邦關係無之',l:'1877 · 태정관 지령',t:'“본방(일본)과 관계없다”는 처리 방침.'}};
function renderOrig(){
  S.step=0;steps();
  vn('한','한 연구원','1905년 문서에서 이 섬을 “竹島”라고 불렀지? 그런데 28년 전 일본 정부 문서에도 <b>같은 글자</b>가 나와. 원문에서 섬을 가리키는 말을 직접 찾아 봐.');
  $('#stage').innerHTML=`<div class="sheet">
    <h2>1877년 태정관 지령 — 원문 핵심 구절</h2>
    <div class="meta">일본 내무성 질의 → 태정관 지령 · 1877.3 · 소장: 일본 국립공문서관</div>
    <div class="task">확대경으로 문장을 살피고, <u>섬을 가리키는 말</u>과 <u>처리 방침</u>을 눌러 표시하세요.</div>
    <div class="orig" id="orig"><span id="origText">${TOKENS.map(([w,i])=>i?`<span class="t" data-i="${i}" role="button" tabindex="0">${w}</span>`:`<span>${w}</span>`).join('')}</span><div class="lens" id="lens"><div class="inner" id="lensInner"></div></div></div>
    <div class="gloss" id="gloss">현대어: 질의한 취지의 <b>竹島 외 1도</b>의 건은 <b>본방(일본)과 관계없다</b>는 것으로 알 것.</div>
    <div class="hint" id="found">찾은 표현 0 / 3</div>
    <div class="row"><button class="go" id="toMap" type="button" disabled>편철된 지도를 펼친다</button></div>
  </div>`;
  const orig=$('#orig'),lens=$('#lens'),inner=$('#lensInner');
  inner.innerHTML=$('#origText').outerHTML.replace('id="origText"','');
  const Z=2;
  orig.addEventListener('pointermove',e=>{const r=orig.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    lens.style.display='block';lens.style.left=(x-75)+'px';lens.style.top=(y-75)+'px';
    const cs=getComputedStyle(orig);inner.style.width=r.width+'px';inner.style.padding=cs.padding;inner.style.textAlign='center';
    inner.style.transform=`translate(${75-x*Z}px,${75-y*Z}px) scale(${Z})`});
  orig.addEventListener('pointerleave',()=>lens.style.display='none');
  const hit=el=>{const i=+el.dataset.i;S.found.add(i);document.querySelectorAll(`.t[data-i="${i}"]`).forEach(x=>x.classList.add('found'));
    const f=FIND[i];addNote(f.n,f.l,f.t);$('#found').textContent=`찾은 표현 ${S.found.size} / 3`;
    if(S.found.has(1)&&S.found.has(2)){$('#toMap').disabled=false;
      vn('서','서윤','어? 1905년에도 “竹島”, 1877년에도 “竹島”예요. 그럼 같은 섬 얘기 아니에요?','그런데 “外一島”는…',()=>vn('한','한 연구원','지령 본문엔 두 번째 섬의 이름이 없어. 같은 일건에 <b>1876년 시마네현이 제출한 지도</b>가 편철돼 있지. 그걸 보자.'))}};
  orig.querySelectorAll('.t').forEach(el=>{el.onclick=()=>hit(el);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(el)}}});
  $('#toMap').onclick=renderRoute;
}

/* ---------- 2. 항로 재구성 ---------- */
function mapHTML(){return `<div class="mapbox" id="map"><img src="${MAP_SRC}" alt="1876년 시마네현 제출 지도 「磯竹島略圖」(기죽도약도). 일부 섬과 주기가 가려져 있다." draggable="false">
  ${MASKS.map((m,i)=>`<div class="mask" data-m="${i}" style="left:${m.x/10}%;top:${m.y/8.41}%;width:${m.w/10}%;height:${m.h/8.41}%">가림</div>`).join('')}
  <svg viewBox="0 0 1000 841" id="svg" aria-hidden="true"></svg></div>`}
function ri(a,b){return Math.hypot(a.x-b.x,a.y-b.y)/PX_PER_RI}
function drawSvg(){
  const g=[];const you=S.you;
  g.push(`<circle cx="${OKI.x}" cy="${OKI.y}" r="9" fill="#2b3a52"/><text x="${OKI.x-14}" y="${OKI.y+34}" font-size="22" fill="#2b3a52" font-weight="700" text-anchor="end">출발: 隠岐</text>`);
  if(S.step===1&&!you.small)g.push(`<circle cx="${OKI.x}" cy="${OKI.y}" r="${80*PX_PER_RI}" fill="none" stroke="#c8372d" stroke-width="3" stroke-dasharray="10 8" opacity=".75"/>`);
  if(you.small){g.push(`<line x1="${OKI.x}" y1="${OKI.y}" x2="${you.small.x}" y2="${you.small.y}" stroke="#e0763a" stroke-width="3"/>`);
    if(!you.iso&&S.step===1)g.push(`<circle cx="${you.small.x}" cy="${you.small.y}" r="${40*PX_PER_RI}" fill="none" stroke="#c8372d" stroke-width="3" stroke-dasharray="10 8" opacity=".75"/>`);
    g.push(`<circle cx="${you.small.x}" cy="${you.small.y}" r="12" fill="#e0763a" stroke="#fff" stroke-width="3"/><text x="${you.small.x+18}" y="${you.small.y-14}" font-size="24" fill="#8f3f16" font-weight="700">내 작은 섬</text>`)}
  if(you.iso){g.push(`<line x1="${you.small.x}" y1="${you.small.y}" x2="${you.iso.x}" y2="${you.iso.y}" stroke="#e0763a" stroke-width="3"/><circle cx="${you.iso.x}" cy="${you.iso.y}" r="12" fill="#e0763a" stroke="#fff" stroke-width="3"/><text x="${you.iso.x+18}" y="${you.iso.y-14}" font-size="24" fill="#8f3f16" font-weight="700">내 磯竹島</text>`)}
  if(S.step>=2&&S.reveal>=.5){[[SMALL,'지도의 작은 섬'],[ISO,'지도의 磯竹島']].forEach(([p,l],i)=>{const y=i?you.iso:you.small;
    if(y)g.push(`<line x1="${y.x}" y1="${y.y}" x2="${p.x}" y2="${p.y}" stroke="#2b3a52" stroke-width="2" stroke-dasharray="4 6"/>`);
    g.push(`<circle cx="${p.x}" cy="${p.y}" r="30" fill="none" stroke="#1f6d5a" stroke-width="4"/>`)})}
  $('#svg').innerHTML=g.join('');
}
function renderRoute(){
  S.step=1;steps();
  vn('한','한 연구원','지도의 섬 그림은 가려 뒀어. 대신 지도에 적힌 <b>거리 주기</b>만 줄게. 이 지도가 두 섬을 어떤 관계로 그렸는지 네가 먼저 복원해 봐.');
  $('#stage').innerHTML=`<div class="sheet">
    <h2>「磯竹島略圖」 — 1876년 시마네현 제출, 같은 일건에 편철</h2>
    <div class="meta">섬 그림과 주기를 가린 상태 · 보이는 것: 隠岐, 朝鮮國 해안선, 방위표, 제목</div>
    <div class="clues">
      <div class="clue"><span class="jp">八十里許</span><br>隠岐(島後) → 작은 섬 · 약 80리</div>
      <div class="clue"><span class="jp">四十里許</span><br>작은 섬 → 磯竹島 · 약 40리</div>
      <div class="clue"><span class="jp">五十里許</span><br>磯竹島에서 朝鮮國을 바라봄 · 약 50리</div>
    </div>
    <div class="task" id="rtask">① 隠岐에서 약 80리 떨어진 곳에 <b>작은 섬</b>을 놓으세요. 지도를 탭하면 놓입니다(다시 탭하면 옮겨짐).</div>
    ${mapHTML()}
    <div class="readout" id="read">점선 원 = 이 지도 자체의 축척으로 잰 80리. 방향은 주기 원문 전사 검수 전이라 주지 않습니다 — 제목·朝鮮國 해안선·방위표를 보고 판단하세요.</div>
    <div class="row"><button id="okSmall" class="go" type="button" disabled>작은 섬 위치 확정</button><button id="okIso" class="go" type="button" hidden disabled>磯竹島 위치 확정</button></div>
    <p class="hint">주기 문구는 공개 해설 기준 전사이며 고해상도 원본 대조가 남아 있습니다. 里는 약식 거리라 절대 거리보다 순서와 비율을 봅니다.</p>
  </div>`;
  drawSvg();
  const map=$('#map');
  map.addEventListener('click',e=>{if(S.step!==1)return;const r=map.getBoundingClientRect();const p={x:(e.clientX-r.left)/r.width*1000,y:(e.clientY-r.top)/r.height*841};
    if(!S.okSmall){S.you.small=p;$('#okSmall').disabled=false;$('#read').textContent=`내 작은 섬: 隠岐에서 약 ${Math.round(ri(OKI,p))}리`}
    else{S.you.iso=p;$('#okIso').disabled=false;$('#read').textContent=`내 磯竹島: 내 작은 섬에서 약 ${Math.round(ri(S.you.small,p))}리 · 隠岐에서 약 ${Math.round(ri(OKI,p))}리`}
    drawSvg()});
  $('#okSmall').onclick=()=>{S.okSmall=true;$('#okSmall').hidden=true;$('#okIso').hidden=false;
    $('#rtask').innerHTML='② 작은 섬에서 약 40리 떨어진 곳에 <b>磯竹島</b>를 놓으세요. 磯竹島에서는 朝鮮國이 약 50리 거리로 바라보인다고 적혀 있습니다.';drawSvg()};
  $('#okIso').onclick=renderOverlay;
}

/* ---------- 3. 겹쳐 보기 ---------- */
function renderOverlay(){
  S.step=2;steps();
  vn('한','한 연구원','이제 가린 종이를 걷어 보자. 맞았다, 틀렸다가 아니라 <b>네 복원과 지도가 어디서 어긋나는지</b> 보는 거야.');
  const y=S.you;
  const order=ri(OKI,y.iso)>ri(OKI,y.small);
  $('#stage').innerHTML=`<div class="sheet">
    <h2>원본 겹쳐 보기</h2>
    <div class="meta">주황 = 내 복원 · 초록 원 = 지도에 그려진 섬</div>
    ${mapHTML()}
    <div class="row"><label for="rev">가림 종이 걷기</label><input id="rev" type="range" min="0" max="100" value="0"></div>
    <table class="compare"><tr><th></th><th>내 복원</th><th>지도에 그려진 관계</th></tr>
      <tr><td>隠岐 → 작은 섬</td><td>약 ${Math.round(ri(OKI,y.small))}리</td><td>약 ${Math.round(ri(OKI,SMALL))}리 (주기 八十里許)</td></tr>
      <tr><td>작은 섬 → 磯竹島</td><td>약 ${Math.round(ri(y.small,y.iso))}리</td><td>약 ${Math.round(ri(SMALL,ISO))}리 (주기 四十里許)</td></tr>
      <tr><td>순서</td><td>${order?'隠岐 → 작은 섬 → 磯竹島':'磯竹島가 작은 섬보다 隠岐에 가까움'}</td><td>隠岐 → 작은 섬 → 磯竹島 (작은 섬이 사이에 있음)</td></tr>
    </table>
    <p class="hint">지도에서 잰 거리는 이 약도 자체의 축척(八十里許 구간 기준)으로 환산한 값입니다. 현대 지도와의 비교가 아닙니다.</p>
    <div class="row"><button class="go" id="toNames" type="button" disabled>명칭을 연결한다</button></div>
  </div>`;
  drawSvg();
  $('#rev').oninput=e=>{S.reveal=e.target.value/100;document.querySelectorAll('.mask').forEach(m=>m.style.opacity=1-S.reveal);drawSvg();
    if(S.reveal>=.9&&$('#toNames').disabled){$('#toNames').disabled=false;
      addNote('磯竹島','1876 · 시마네현 제출 지도','큰 섬. 朝鮮國 쪽, 隠岐에서 먼 쪽.');
      addNote('작은 섬 (松島)','1876 · 시마네현 제출 지도','隠岐와 磯竹島 사이, 隠岐 쪽. 섬 이름은 공개 전사 기준 “松島”.');
      vn('서','서윤','지도에는 섬이 딱 두 개네요. 큰 섬 磯竹島, 그리고 오키 쪽에 가까운 작은 섬.','연결해 보자',renderNames)}};
  $('#toNames').onclick=renderNames;
}

/* ---------- 4. 명칭 연결 ---------- */
const NAMES=[['t05','竹島','1905 결정'],['t77','竹島','1877 지령'],['o77','外一島','1877 지령'],['iso','磯竹島','1876 지도'],['sm','작은 섬 (松島)','1876 지도']];
const EVID=[['e1','지령 일건: 울릉도 관련 문서 왕래 조사'],['e2','편철 지도: 섬 두 개와 거리 주기'],['e3','내 항로 재구성·겹쳐 보기'],['e4','1905 고시: 隠岐에서 서북 85浬의 무인도']];
const KIND={ok:'확인됨',maybe:'가능함',hold:'아직 판단할 수 없음'};
function nm(id){const x=NAMES.find(n=>n[0]===id);return `${x[1]} (${x[2]})`}
function renderNames(){
  S.step=3;steps();
  vn('한','한 연구원','카드 두 장을 차례로 눌러 연결하고, 연결의 강도를 정해. <b>확인됨·가능함</b>에는 근거를 하나 이상 붙여야 해. 근거가 없으면 “아직 판단할 수 없음”으로 두면 돼.');
  $('#stage').innerHTML=`<div class="sheet">
    <h2>명칭 연결</h2>
    <div class="meta">같은 글자라도 문서·연도가 다르면 다른 카드입니다.</div>
    <div class="names" id="names">${NAMES.map(([id,n,s])=>`<button class="nc" data-id="${id}" type="button"><span class="n">${esc(n)}</span><span class="s">${esc(s)}</span></button>`).join('')}</div>
    <div id="picker"></div>
    <div class="links" id="links"></div>
    <div id="sameBox"></div>
  </div>`;
  document.querySelectorAll('.nc').forEach(b=>b.onclick=()=>{const id=b.dataset.id;
    if(!S.pick){S.pick=id;b.classList.add('pick');return}
    if(S.pick===id){S.pick=null;b.classList.remove('pick');return}
    openPicker(S.pick,id);S.pick=null;document.querySelectorAll('.nc').forEach(x=>x.classList.remove('pick'))});
  renderLinks();
}
function openPicker(a,b){
  const st={kind:null,ev:new Set()};
  const draw=()=>{$('#picker').innerHTML=`<div class="picker"><b>${esc(nm(a))}</b> ↔ <b>${esc(nm(b))}</b>
    <div class="chips">${Object.entries(KIND).map(([k,v])=>`<button type="button" data-k="${k}" class="${st.kind===k?'sel':''}">${v}</button>`).join('')}</div>
    <div class="hint">근거</div><div class="chips">${EVID.map(([k,v])=>`<button type="button" data-e="${k}" class="${st.ev.has(k)?'sel':''}">${esc(v)}</button>`).join('')}</div>
    <div class="row"><button class="go" id="saveLink" type="button" ${!st.kind||(st.kind!=='hold'&&!st.ev.size)?'disabled':''}>연결 저장</button><button id="cancelLink" type="button">취소</button></div>
    ${st.kind&&st.kind!=='hold'&&!st.ev.size?'<div class="hint">확인됨·가능함은 근거를 하나 이상 붙여야 저장됩니다.</div>':''}</div>`;
    $('#picker').querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{st.kind=x.dataset.k;draw()});
    $('#picker').querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{st.ev.has(x.dataset.e)?st.ev.delete(x.dataset.e):st.ev.add(x.dataset.e);draw()});
    $('#saveLink').onclick=()=>{S.links=S.links.filter(l=>!((l.a===a&&l.b===b)||(l.a===b&&l.b===a)));S.links.push({a,b,kind:st.kind,ev:[...st.ev]});$('#picker').innerHTML='';renderLinks()};
    $('#cancelLink').onclick=()=>$('#picker').innerHTML='';};
  draw();
}
function renderLinks(){
  $('#links').innerHTML=S.links.map(l=>`<div class="link k-${l.kind}"><span>${esc(nm(l.a))} ↔ ${esc(nm(l.b))}</span><span class="pill">${KIND[l.kind]}</span>${l.ev.length?`<span class="hint" style="margin:0">근거: ${l.ev.map(e=>esc(EVID.find(x=>x[0]===e)[1])).join(' · ')}</span>`:''}</div>`).join('')||'<div class="hint">아직 연결이 없습니다. 먼저 1877 지령의 두 섬(竹島, 外一島)을 지도의 섬과 연결해 보세요.</div>';
  const has=id=>S.links.some(l=>l.a===id||l.b===id);
  if(has('t77')&&has('o77')&&!$('#sameQ'))renderSame();
}
function renderSame(){
  $('#sameBox').innerHTML=`<div class="picker" id="sameQ"><b>마지막 질문 — 1905년의 竹島와 1877년의 竹島는 같은 섬을 가리키는가?</b>
    <div class="hint">노트의 1905 카드(隠岐에서 서북 85浬의 무인도)와, 방금 연결한 1877 카드를 함께 보세요.</div>
    <div class="chips"><button type="button" data-s="same">같은 섬</button><button type="button" data-s="diff">다른 섬</button><button type="button" data-s="hold">아직 판단할 수 없음</button></div><div id="sameOut"></div></div>`;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.same=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('sel',x===b));finish()});
}
function finish(){
  const t77=S.links.find(l=>[l.a,l.b].includes('t77'));
  const out={
    same:'<div class="aha">서윤: “같은 글자인데요… 1877년 일건의 <b>竹島</b>는 울릉도 기록을 조사한 뒤 나온 이름이고, 지도에서는 큰 섬 <b>磯竹島</b> 쪽이에요. 1905년의 竹島는 <b>隠岐에서 가까운 작은 무인도</b>고요. 위치를 한 번만 더 겹쳐 볼래요.”<br>한 연구원: “좋아. 이름이 같으니까 같은 섬이라고 보고 싶어지지. 그럴수록 <b>위치와 문서 맥락</b>으로 확인해.”</div>',
    diff:'<div class="aha"><b>같은 이름, 다른 섬.</b> 1877년 일건의 竹島는 울릉도 관련 기록을 조사한 뒤 나온 이름이고, 편철 지도에서는 큰 섬 磯竹島 쪽입니다. 1905년에 “竹島”라고 이름 붙인 섬은 隠岐에서 서북쪽의 작은 무인도 — 1876년 지도에서는 두 섬 가운데 <b>隠岐 쪽 작은 섬</b>의 자리입니다.<br><br>한 연구원: “이건 문서에 그대로 적힌 사실이 아니라, 지도·일건·고시를 <b>연결해서 얻은 해석</b>이야. 근거가 강한 해석이지만, 노트에는 근거와 함께 적어 두자.”</div>',
    hold:'<div class="aha">보류도 정당한 기록입니다. 한 연구원: “무엇이 더 있으면 판단할 수 있을지 적어 둬. 예를 들면 1905년 섬의 위치를 1876년 지도의 두 섬과 직접 비교할 수 있는 근거.”</div>'
  }[S.same];
  const payload={scene:'1877',found:[...S.found],route:{oki_small_ri:Math.round(ri(OKI,S.you.small)),small_iso_ri:Math.round(ri(S.you.small,S.you.iso))},
    links:S.links.map(l=>({pair:[l.a,l.b].sort().join('-'),kind:l.kind,evidence:l.ev})),takeshima_1877_vs_1905:S.same};
  $('#sameOut').innerHTML=out+`<div class="hint" style="margin-top:12px">저장된다면 이런 구조화 값만 남습니다(학생 문장 원문 없음):</div><pre>${esc(JSON.stringify(payload))}</pre>`;
  addNote(S.same==='diff'?'竹島 ≠ 竹島':'竹島 (1877) ? 竹島 (1905)','1877 × 1905 · 내 해석',S.same==='diff'?'같은 이름이 서로 다른 섬을 가리킨다고 판단(근거: 지도·일건·고시 연결).':S.same==='same'?'같은 섬으로 판단 — 위치 재확인 권장.':'판단 보류.');
  if(!t77)return;
}
renderNotes();renderOrig();
</script>
</body>
</html>
