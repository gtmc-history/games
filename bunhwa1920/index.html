<meta charset="utf-8">

<title>갈라진 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#f0ece4;
  --color-surface:#e8e0d4;
  --color-primary:#003087;
  --color-accent:#cd2e3a;
  --color-text:#1a1a1a;
  --color-sepia:#8b7355;
  --font-display:'Black Han Sans',sans-serif;
  --font-body:'Noto Sans KR',sans-serif;
  --font-document:'Noto Serif KR',serif;
  --paper:#f8f2e7;
  --line:#b9ad9a;
  --line-dark:#837560;
  --muted:#6e6457;
  --blue-soft:#eef3fb;
  --blue-line:#8da7cf;
  --context:#5d564e;
  --verified:#715d35;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
body{min-height:100dvh;background-image:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),repeating-linear-gradient(0deg,rgba(90,72,50,.02) 0,rgba(90,72,50,.02) 1px,transparent 1px,transparent 5px)}
button,textarea{font:inherit}
button{min-height:48px;cursor:pointer}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid rgba(0,48,135,.28);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;min-height:100dvh;background:rgba(240,236,228,.9);border-left:1px solid rgba(139,115,85,.25);border-right:1px solid rgba(139,115,85,.25)}
.ghead{height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:2px solid var(--color-primary);padding:0 16px;background:rgba(248,242,231,.95);position:sticky;top:0;z-index:30}
.gtitle{font-family:var(--font-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gprog{justify-self:center;font-size:12px;font-weight:900;color:var(--color-primary);border:1px solid var(--color-primary);padding:6px 9px;background:#fffdf8;border-radius:2px}
.gscene{justify-self:end;font-size:12px;color:var(--muted);font-weight:800}
.stage{padding:24px;min-height:calc(100dvh - 64px)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--color-accent);margin-bottom:8px}
.sc-title{font-family:var(--font-display);font-size:clamp(27px,4vw,36px);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
.lead{font-size:16px;line-height:1.75;margin:0 0 16px}
.hint{font-size:13px;line-height:1.65;color:var(--muted)}
.panel{border:1px solid var(--line);background:rgba(255,253,248,.74);padding:16px;margin:16px 0;border-radius:2px}
.panel-title{font-size:14px;font-weight:900;color:var(--color-sepia);margin:0 0 10px}
.paper{font-family:var(--font-document);background:var(--paper);border:1px solid var(--color-sepia);padding:20px;line-height:1.95;margin:18px 0;position:relative;white-space:pre-wrap}
.paper::before{content:'자료';position:absolute;top:-11px;left:12px;background:var(--color-sepia);color:#fff;padding:2px 8px;font-family:var(--font-body);font-size:11px;font-weight:900}
.source{display:block;text-align:right;font-family:var(--font-body);font-size:12px;color:var(--muted);margin-top:12px;white-space:normal}
/* ── TOOLTIP · PATCH v1.1 ── */
.tt{border-bottom:1.5px dashed var(--color-sepia);cursor:pointer;position:relative;color:inherit;text-decoration:none}
.tt:hover,.tt:focus-visible{border-bottom-color:var(--color-primary);outline:none}
#tt-bubble{position:fixed;z-index:9000;max-width:240px;background:#272522;border:1px solid rgba(139,115,85,.75);color:#f8f2e7;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.24);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;border-radius:2px}
#tt-bubble.show{opacity:1;transform:translateY(0)}
#tt-bubble .tb-word{font-size:12px;font-weight:900;color:#ead9bd;margin-bottom:4px}
#tt-bubble .tb-desc{font-size:12px;line-height:1.65;color:#f3eadc}
.scope-compact{display:inline-block;margin-top:6px;border:1px solid var(--color-sepia);background:#f8f2e7;color:#4f4539;font-size:11px;font-weight:900;padding:4px 6px;border-radius:2px}
.anchor{background:rgba(0,48,135,.065)}
.focus{font-weight:800;border-bottom:2px solid var(--color-primary);background:rgba(0,48,135,.08)}
.context{border-bottom:2px dotted var(--context);background:rgba(90,82,72,.055)}
.context-label{display:inline-block;margin:-2px 0 7px;font-size:11px;font-weight:900;color:var(--context);border:1px solid var(--line);padding:3px 6px;background:#fffdf8}
.relation-card{border:1px solid var(--line-dark);background:#fffdf8;margin:16px 0;padding:14px}
.relation-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,.9fr) minmax(0,1fr);gap:8px;align-items:center}
.node{border:2px solid var(--color-sepia);background:#fffdf8;padding:12px;text-align:center;font-weight:900;line-height:1.45;min-height:56px;display:flex;align-items:center;justify-content:center}
.rel-mid{display:flex;align-items:center;gap:7px;min-width:0}
.rel-mid::before,.rel-mid::after{content:'';height:2px;background:var(--color-primary);flex:1;min-width:12px}
.rel-mid.candidate::before,.rel-mid.candidate::after{height:1px;background:var(--line-dark)}
.rel-mid.candidate .rel-label{color:var(--context)}
.rel-mid.inference::before,.rel-mid.inference::after{background:repeating-linear-gradient(90deg,var(--color-primary) 0 7px,transparent 7px 12px)}
.rel-label{font-size:11px;font-weight:900;color:var(--color-primary);text-align:center;white-space:normal}
.rel-mid.verified::before,.rel-mid.verified::after{background:var(--verified)}
.rel-mid.verified .rel-label{color:var(--verified)}
.verified-tag{display:inline-block;font-size:10px;font-weight:900;border:1px solid var(--verified);color:var(--verified);padding:2px 5px;margin-left:5px;background:#fffaf0}
.relation-card.selected{border:2px solid var(--color-primary);background:var(--blue-soft)}
.relation-card.no-line{border-style:dashed;background:rgba(255,253,248,.58)}
.relation-card.no-line .rel-mid::before,.relation-card.no-line .rel-mid::after{display:none}
.relation-card.no-line .rel-mid{justify-content:center}
.relation-card.no-line .rel-label{color:#655d53}
.judgment-question{font-size:18px;font-weight:900;line-height:1.6;margin:18px 0 10px}
/* ── INTERACTION REOPEN v1.1 · EVIDENCE_PICK ── */
.evidence-question{font-size:18px;font-weight:900;line-height:1.6;margin:18px 0 10px}
.evidence-help{font-size:12px;color:var(--muted);line-height:1.6;margin:-3px 0 10px}
.evidence-paper{display:grid;gap:7px}
.evidence-sentence{width:100%;min-height:0;border:1px solid rgba(139,115,85,.28);background:rgba(255,253,248,.38);color:inherit;padding:8px 9px;text-align:left;font-family:var(--font-document);font-size:inherit;line-height:1.85;border-radius:2px;cursor:pointer}
.evidence-sentence:hover,.evidence-sentence:focus-visible{border-color:var(--color-primary);background:rgba(238,243,251,.5)}
.evidence-sentence.last-wrong{border:1.5px solid var(--line-dark);background:rgba(232,224,212,.5)}
.evidence-sentence.resolved{border:2px solid var(--color-primary);background:rgba(238,243,251,.72);font-weight:700}
.evidence-sentence[disabled]{cursor:default;opacity:1}
.evidence-sentence.paragraph-start{margin-top:10px}
.evidence-feedback{margin:12px 0;padding:13px 14px;border-left:4px solid var(--color-primary);background:#fffdf8;line-height:1.7}
.evidence-feedback.retry{border-left-color:var(--line-dark)}
.evidence-feedback strong{display:block;margin-bottom:3px}
.evidence-result{margin-top:14px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.choice{border:1px solid var(--line);background:#fffdf8;color:var(--color-text);padding:12px 10px;text-align:center;font-weight:900;border-radius:2px;transition:border-color .12s ease,background .12s ease,transform .08s ease}
.choice:hover{border-color:var(--color-primary)}
.choice:active{transform:translateY(1px)}
.choice.picked{border:2px solid var(--color-primary);background:var(--blue-soft)}
.choice[disabled]{cursor:default;opacity:.96}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{border:1px solid var(--color-primary);background:var(--color-primary);color:#fff;padding:11px 15px;min-width:132px;text-align:center;font-weight:900;border-radius:2px}
.btn.secondary{background:#fffdf8;color:var(--color-primary)}
.btn.ghost{background:transparent;color:var(--color-text);border-color:var(--line-dark)}
.btn[disabled]{opacity:.36;cursor:not-allowed}
.feedback{margin:12px 0;padding:13px 14px;border-left:4px solid var(--color-primary);background:#fffdf8;line-height:1.7}
.feedback-title{font-size:12px;font-weight:900;color:var(--color-primary);margin-bottom:4px}
.feedback p{margin:0}
.feedback p+p{margin-top:8px}
.badge-wrap{margin-top:10px}
.scope-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-sepia);background:#f8f2e7;color:#4f4539;font-size:12px;font-weight:900;padding:6px 8px;cursor:pointer}
.scope-detail{margin-top:7px;font-size:12px;line-height:1.6;color:var(--muted);border-left:2px solid var(--color-sepia);padding-left:9px}
.scope-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;max-width:min(90vw,520px);background:#fffdf8;border:2px solid var(--color-sepia);padding:11px 14px;font-size:13px;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.result-note{margin-top:10px;border:1px solid var(--line);background:#f8f2e7;padding:11px 12px;font-size:13px;line-height:1.65}
.no-line-list{border:1px dashed var(--line-dark);background:rgba(255,253,248,.62);padding:14px;margin:16px 0}
.no-line-list h3{margin:0 0 3px;font-size:15px}
.no-line-list .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.no-line-item{padding:8px 0;border-top:1px solid rgba(139,115,85,.22);font-size:13px;line-height:1.55}
.no-line-item:first-of-type{border-top:0}
.fold-card{border:2px solid var(--color-sepia);background:#fffdf8;padding:16px;margin:18px 0;animation:foldIn .45s ease both}
@keyframes foldIn{from{opacity:.25;transform:scale(.985) translateY(5px)}to{opacity:1;transform:none}}
.fold-title{font-weight:900;font-size:18px;margin-bottom:9px}
.summary-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.summary-tag{border:1px solid var(--line);padding:5px 8px;background:#f8f2e7;font-size:12px;font-weight:800}
.auto-note{font-size:12px;color:var(--muted);margin-top:8px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mobile-tabs{display:none;gap:6px;margin:8px 0}.mobile-tab{border:1px solid var(--line-dark);background:#fffdf8;padding:8px 10px;min-height:42px;font-weight:900}.mobile-tab.active{border:2px solid var(--color-primary);background:var(--blue-soft)}
.compare .paper{margin:10px 0}
.compare-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.complete-chip{font-size:11px;font-weight:900;color:var(--color-primary);border:1px solid var(--blue-line);padding:4px 7px;background:var(--blue-soft)}
.discover{border:1px solid var(--color-sepia);background:#f8f2e7;padding:18px;margin:18px 0}
.discover h3{margin:0 0 8px;font-size:18px}
.reading-point{border-left:4px solid var(--color-primary);background:#fffdf8;padding:12px 14px;margin:14px 0;line-height:1.7}
.map-section{margin:18px 0}
.map-section h3{font-size:14px;margin:0 0 8px;color:var(--color-sepia)}
.map-core{display:grid;gap:9px}.goal-highlight>.relation-card:nth-child(-n+2){border:2px solid var(--color-primary);background:var(--blue-soft)}
.map-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
details.map-node{border:1px solid var(--line-dark);background:#fffdf8;padding:0}
details.map-node summary{list-style:none;cursor:pointer;padding:13px;font-weight:900;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.map-node summary::-webkit-details-marker{display:none}
details.map-node summary::after{content:'＋';color:var(--color-primary)}
details.map-node[open] summary::after{content:'−'}
.node-summary{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.node-body{border-top:1px solid var(--line);padding:12px 13px;font-size:13px;line-height:1.65}
.node-body ul{margin:6px 0;padding-left:18px}
.node-body li+li{margin-top:5px}
.branch-card{border:1px solid var(--line-dark);background:#f8f2e7;padding:14px;margin:12px 0}
.branch-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.branch-source{border:2px solid var(--color-sepia);background:#fffdf8;padding:10px;text-align:center;font-weight:900}
.branch-split{text-align:center;font-size:20px;color:var(--verified);font-weight:900}
.branch-targets{display:grid;gap:7px}
.branch-target{border:1px solid var(--line-dark);background:#fffdf8;padding:9px;text-align:center;font-weight:800}
.verify-note{font-size:12px;color:var(--verified);border-left:3px solid var(--verified);padding-left:9px;margin-top:10px;line-height:1.6}
.final-steps{display:grid;gap:16px;margin:18px 0}
.final-step{border:1px solid var(--line);background:#fffdf8;padding:16px}
.final-step h3{margin:0 0 8px;font-size:16px}
.goal-btn,.split-btn{border:1px solid var(--line-dark);background:#fffdf8;padding:11px 12px;text-align:left;font-weight:800;min-height:48px}
.goal-btn.selected,.split-btn.selected{border:2px solid var(--color-primary);background:var(--blue-soft)}
.split-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
textarea{width:100%;resize:vertical;min-height:100px;border:1px solid var(--line-dark);background:#fffdf8;padding:12px;line-height:1.65;color:var(--color-text)}
.answer-box{border:1px solid var(--color-sepia);background:#f8f2e7;padding:16px;margin:16px 0}
.answer-box h3{margin:0 0 8px}
.answer-box p{white-space:pre-wrap;line-height:1.7;margin:0}
.comment-box{margin-top:16px}
.footer{margin-top:30px;text-align:center;color:rgba(120,100,80,.4);font-size:11px}
.hidden{display:none!important}
@media(max-width:720px){
  .stage{padding:18px 14px}
  .ghead{grid-template-columns:1fr auto;padding:0 12px}.gprog{display:none}.gscene{font-size:11px}
  .relation-grid{grid-template-columns:1fr;gap:5px}.rel-mid{justify-content:center}.rel-mid::before,.rel-mid::after{max-width:80px}
  .choice-grid{grid-template-columns:1fr}
  .compare{grid-template-columns:1fr}.s5-compare .source-pane{display:none}.s5-compare .source-pane.active{display:block}.mobile-tabs{display:flex}.map-details{grid-template-columns:1fr}.split-grid{grid-template-columns:1fr}
  .branch-row{grid-template-columns:1fr}.branch-split{transform:rotate(90deg)}
}


/* ═══════════════════════════════════════════════════════
   V7 · GAME PRESENTATION LAYER
   역사/판정 로직은 유지하고 Scene / Live Map / Game Feel만 확장한다.
   ═══════════════════════════════════════════════════════ */
:root{
  --game-navy:#0e2736;
  --game-navy-2:#173847;
  --game-paper:#f6eddc;
  --game-ink:#1c1a17;
  --game-rust:#9a3d2c;
  --game-brass:#a77940;
}
body{background:#d8d0c3;background-image:linear-gradient(rgba(255,255,255,.12),rgba(0,0,0,.02)),repeating-linear-gradient(90deg,rgba(72,52,32,.025) 0,rgba(72,52,32,.025) 1px,transparent 1px,transparent 6px)}
.wrap{max-width:1240px;background:rgba(239,233,222,.96);box-shadow:0 10px 40px rgba(43,31,19,.18)}
.ghead{height:66px;background:linear-gradient(180deg,var(--game-navy),#0b202d);border-bottom:1px solid rgba(215,188,145,.45);color:#f5ead8;grid-template-columns:minmax(0,1fr) auto auto;gap:18px}
.gtitle{font-size:23px;letter-spacing:.01em}
.gprog{color:#f5ead8;border:1px solid rgba(231,208,169,.56);background:rgba(255,255,255,.06);padding:6px 12px}
.gscene{color:#d6c6ae;min-width:130px;text-align:right}
.stage{padding:18px 20px 30px;min-height:calc(100dvh - 66px)}

.scene-hero{height:196px;border:1px solid #75624b;position:relative;overflow:hidden;margin:0 0 16px;background:#443a30 center/cover no-repeat;box-shadow:inset 0 -90px 90px rgba(12,20,24,.55)}
.scene-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,25,32,.76) 0,rgba(12,25,32,.16) 45%,rgba(12,25,32,.42) 100%)}
.scene-hero-copy{position:absolute;inset:auto 22px 18px 22px;z-index:2;color:#fff7e8;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.scene-file{display:inline-block;font:900 11px/1 var(--font-body);letter-spacing:.12em;padding:6px 8px;border:1px solid rgba(240,220,184,.72);background:rgba(23,38,44,.68);margin-bottom:8px}
.scene-hero h2{font-family:var(--font-display);font-size:clamp(25px,3vw,38px);margin:0 0 4px;letter-spacing:-.02em}
.scene-hero p{margin:0;font-size:13px;font-weight:700;color:#eadcc6}

.scene-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.workbench{min-width:0;background:rgba(255,253,248,.58);border:1px solid rgba(125,103,73,.36);padding:18px;box-shadow:0 5px 18px rgba(70,50,30,.06)}
.live-panel{position:sticky;top:84px;min-width:0;background:#e9ddc8;border:1px solid #7d684d;padding:10px;box-shadow:0 6px 22px rgba(64,43,25,.12)}
.live-panel-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 8px;padding:3px 4px 8px;border-bottom:1px solid rgba(111,86,56,.35)}
.live-panel-title{font-weight:900;font-size:14px;color:#342a20}
.live-panel-count{font-size:11px;font-weight:900;color:var(--color-primary);background:#fffaf0;border:1px solid #ad9472;padding:3px 6px}
.live-map-canvas{position:relative;height:330px;background-color:#d8c7aa;background-image:linear-gradient(rgba(84,68,45,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(84,68,45,.05) 1px,transparent 1px);background-size:24px 24px;border:1px solid rgba(111,86,56,.42);overflow:hidden}
.live-map-canvas::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.38),transparent 32%),linear-gradient(135deg,transparent 0 65%,rgba(98,70,38,.05) 65% 66%,transparent 66%)}
.live-map-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.live-map-svg line{stroke:#786d5e;stroke-width:1.5;opacity:.12;transition:opacity .25s ease,stroke .25s ease,stroke-width .25s ease}
.live-map-svg line.active{stroke:#174e85;stroke-width:1.35;opacity:.95;stroke-dasharray:500;stroke-dashoffset:500;animation:v7Draw .75s ease forwards}
.live-map-svg line.alert{stroke:#9a3d2c}
@keyframes v7Draw{to{stroke-dashoffset:0}}
.lm-node{position:absolute;z-index:2;transform:translate(-50%,-50%);min-width:82px;max-width:112px;padding:7px 8px;border:1px solid rgba(104,82,55,.36);background:rgba(246,237,220,.48);color:rgba(52,42,32,.42);font-size:11px;line-height:1.25;text-align:center;font-weight:900;box-shadow:0 1px 2px rgba(30,20,10,.04);transition:.25s ease}
.lm-node.active{border:1.5px solid #8e704b;background:#fff7e8;color:#201b16;box-shadow:0 3px 10px rgba(60,40,20,.14);animation:v7NodePop .42s ease both}
.lm-node.key.active{border-color:#174e85}
.lm-node.warn.active{border-color:#92392d}
@keyframes v7NodePop{0%{opacity:.4;transform:translate(-50%,-50%) scale(.92)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.live-log{margin-top:9px;border-top:1px solid rgba(111,86,56,.28);padding-top:8px;display:grid;gap:6px}
.live-log-row{display:flex;gap:7px;align-items:flex-start;font-size:11px;line-height:1.45;color:#51483d}
.live-log-dot{width:7px;height:7px;border-radius:50%;margin-top:4px;background:#a58355;flex:none}
.live-log-dot.active{background:#174e85;box-shadow:0 0 0 3px rgba(23,78,133,.1)}
.unresolved-mini{margin-top:8px;border:1px dashed #866d4d;background:#f4ead8;padding:8px;font-size:11px;line-height:1.45}
.unresolved-mini strong{display:block;margin-bottom:3px;color:#6d4d2c}

.v7-s1{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:stretch}

  ],

  ]
};

const TOOLTIP_FORBIDDEN = ['물산 장려 계급','치안 유지법','계급 해방','실력 양성 운동','비타협적 민족주의 세력'];

// 「왕의 결재함」 v3 호환 패턴: TIPS + tt() + #tt-bubble
const TIPS = Object.fromEntries(Object.values(TOOLTIP_SET).flat().map(([word,tip])=>[word,tip]));
function tt(word, tipKey){
  const key=tipKey||word;
  const tip=TIPS[key]||'';
  if(!tip) return word;
  return `<span class="tt" tabindex="0" data-tip="${encodeURIComponent(tip)}" data-word="${word}">${word}</span>`;
}

function wrapTooltipInRoot(root, term, tip){
  // 밀도 관리: 같은 자료에서 같은 용어는 첫 등장 1회만 툴팁 처리한다.
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    if(!node.nodeValue || !node.nodeValue.includes(term)) return NodeFilter.FILTER_REJECT;
    const parent=node.parentElement;
    if(!parent || parent.closest('.tt,.source')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const node=walker.nextNode();
  if(!node) return;
  const raw=node.nodeValue, idx=raw.indexOf(term);
  const frag=document.createDocumentFragment();
  if(idx>0) frag.appendChild(document.createTextNode(raw.slice(0,idx)));
  const template=document.createElement('template');
  template.innerHTML=tt(term);
  frag.appendChild(template.content.firstElementChild);
  if(idx+term.length<raw.length) frag.appendChild(document.createTextNode(raw.slice(idx+term.length)));
  node.replaceWith(frag);
}

function applyTooltips(root=document){
  root.querySelectorAll('.paper[data-source-key]').forEach(paper=>{
    const key=paper.dataset.sourceKey;
    (TOOLTIP_SET[key]||[]).forEach(([term,tip])=>wrapTooltipInRoot(paper,term,tip));
  });
}

let tooltipTimer=null;
function hideTooltip(){
  const bubble=document.getElementById('tt-bubble');
  if(tooltipTimer){clearTimeout(tooltipTimer);tooltipTimer=null;}
  if(!bubble) return; bubble.classList.remove('show'); bubble.setAttribute('aria-hidden','true');
}
function showTooltip(el){
  const bubble=document.getElementById('tt-bubble'); if(!bubble) return;
  bubble.querySelector('.tb-word').textContent=el.dataset.word||'';
  bubble.querySelector('.tb-desc').textContent=decodeURIComponent(el.dataset.tip||'');
  const rect=el.getBoundingClientRect(), bw=Math.min(240,window.innerWidth-16);
  let left=rect.left+rect.width/2-bw/2; left=Math.max(8,Math.min(left,window.innerWidth-bw-8));
  bubble.style.width=bw+'px'; bubble.style.left=left+'px'; bubble.style.top='-9999px';
  bubble.classList.add('show'); bubble.setAttribute('aria-hidden','false');
  const bh=bubble.offsetHeight;
  bubble.style.top=(rect.top-bh-12<8 ? rect.bottom+10 : rect.top-bh-12)+'px';
  if(tooltipTimer) clearTimeout(tooltipTimer);
  tooltipTimer=setTimeout(hideTooltip,4000);
}
document.addEventListener('click',e=>{ const el=e.target.closest('.tt'); if(el){e.stopPropagation();showTooltip(el);} else hideTooltip(); });
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList?.contains('tt')){e.preventDefault();showTooltip(e.target);}
  if(e.key==='Escape') hideTooltip();
});

const SOURCE = {
  S2:`3·1 운동을 전후해 국내에서도 사회주의 사상이 빠르게 전파되었다. 사회주의가 확산하면서 국내의 민족 운동은 크게 민족주의 운동과 사회주의 운동의 두 진영으로 분화되었다. 민족주의 세력과 사회주의 세력은 일제를 몰아내고 독립을 쟁취하자는 민족 해방이라는 공통의 목표를 갖고 있었다. 그러나 사회주의 세력은 자본주의 체제를 비판하고 노동자와 농민의 계급 해방도 함께 추구했다. 이로 인해 민족을 계급보다 우선시한 민족주의 세력과 대립하기도 했다.`,
  S3:`사회주의 사상을 접한 청년과 지식인들은 독서회, 토론회 등을 열며 사회주의 사상을 연구하고 이를 신문과 잡지에서 소개했다. 전국 각지에서 다양한 계층의 사회주의 운동 단체들이 조직되었으며, 서울에서는 비밀리에 조선 공산당이 조직되었다(1925). 조선 공산당은 1928년 일제의 탄압으로 해체되기 전까지 국내외의 다양한 사회주의 운동을 이끌었다.\n\n사회주의자들은 노동 운동, 농민 운동 및 청년 운동 등 대중 운동을 주도했다. 이에 일제는 치안 유지법을 공포해 사회주의 운동을 대대적으로 탄압했다. 사회주의 세력은 위기를 극복하기 위해 비타협적 민족주의 세력과 연합을 모색하기도 했다.`,
  S4:`3·1 운동 이후 일부 민족주의 세력은 일제의 지배를 벗어나려면 먼저 실력을 키워 독립을 준비해야 한다고 생각했다. 이들은 민족 산업의 육성과 교육을 통한 인재 양성을 강조하는 실력 양성 운동을 전개했다.\n\n물산 장려 운동 회사령 철폐와 일제의 경제 침탈에 맞서 민족 산업을 육성하자는 분위기가 조성되었다. 그 가운데 경성 방직 주식회사, 평양 메리야스 공장 등 한국인이 세운 기업들이 성장했다. 그러나 이들 기업은 일본 기업보다 자본과 기술력이 부족해 어려움에 처했다. 특히 일본 상품의 관세 폐지 움직임까지 나타나자 한국인 자본가들은 위기의식을 느꼈다. 이에 1920년 평양에서 조만식 등이 조선 물산 장려회를 조직하고 물산 장려 운동을 전개했다. 이 운동은 '내 살림 내 것으로', '조선 사람 조선 것'의 구호를 내세우며 토산품을 애용해 민족 산업을 보호·육성할 것 등을 주장했다. 운동은 각 지역의 호응을 얻으며 전국으로 확산했다.`,
  S5A:`(사회주의 세력이) 타파하고자 하는 자본주의는 일본 사람의 자본주의인가 혹은 조선 사람의 자본주의인가? …… 무릇 목적을 달성하기 위한 방법은 하나 둘만 있는 것이 아니다. 시대와 환경을 보아서 하는 것이 좋은 방법인 것이다. 우리는 조선 민족이 (다른 어떤 것보다) 먼저 조선 사람 자체의 생산력 발달부터 기도하는 것이 가장 시급하고 절실하다고 생각한다. 어찌하면 일본 사람의 자본주의하에서 조선 사람의 생산력을 발달시킬 수 있을 것인가? 이는 오직 조선 사람의 '단결'에 있는 것이다. 유산, 무산 계급을 막론한 모든 조선 사람이 대동단결해 조선인이 제작하는 물품을 조선인이 사용하는 그 확실한 정신을 수립하고 실현해야 한다.`,
  S5B:`물산 장려 운동은 최근 우리 조선에서 일어난 대규모의 운동이라 할 수 있다. …… 실상 말하자면 노동자에게는 새삼스럽게 우리 물건을 장려할 필요가 없는 것이다. 그들은 오랜 옛날부터 훌륭한 물산 장려 계급이다. 자본가 중산 계급이 양복이나 비단옷을 입는 대신에 무명과 베옷을 입었고 저들 자본가가 일본 술을 마시는 대신에 소주나 막걸리를 먹지 않았는가. …… 저들은 민족적, 애국적이라는 감상적인 미사여구로 저들의 이익과는 상관없는 노동 계급의 후원을 갈구하는 것이다. …… 저들이 주장하는 생산 기관의 발달, 산업의 진흥, 생활의 경제적 독립 이것은 진실로 누구를 위한 것인가?`,
  S6A:`3·1 운동 이후 일제는 이른바 문화 정치를 표방하며 한국인에 대한 교육 기회를 확대하겠다고 발표했다. 그러나 학교 수는 여전히 부족했고, 고등 교육의 기회도 주어지지 않았다. 이에 이상재 등을 중심으로 한국인 본위 교육을 위한 민립 대학 설립 운동을 전개했다. 1923년 조직한 조선 민립 대학 기성회는 대학 설립에 필요한 1천만 원을 모으는 전국적인 모금 운동을 전개했다.`,
  S6B:`또한 청년운동을 비롯한 사회운동 세력들의 동향도 문제였다. 이들은 당시 물산장려운동을 부르주아적인 운동이라고 비판하고 있었다. 따라서 비슷한 성격을 가지고 있은 이 운동에 대해서도 소극적인 태도를 취했으리란 것은 쉽게 짐작할 수 있다. 이러한 점도 민립대학설립운동의 기세가 꺾이는데 영향을 미쳤다.`,
  S7A:`실력 양성 운동이 구체적인 성과를 내지 못하자 이광수, 김성수, 최린 등 일부 민족주의 세력은 법률이 허락하는 한도 내에서 합법적인 정치 운동을 전개하자는 자치 운동을 벌였다. 이들은 독립이 당장은 불가능하다고 판단하고, 일제의 지배를 받아들인 채 조선 총독부와 협력해 자치 정부 또는 자치 의회를 구성하고자 했다.`,
  S7B:`왜 지금의 조선 민족에게는 정치적 생활이 없나? …… 우리는 조선 내에서 (일본이) 허용하는 범위 내에서 일대 정치적 결사를 조직해야 한다.`
};

function publicHeaders(extra){
  const key = window.CHARLIE_CONFIG.supabasePublishableKey || '';
  const headers = { apikey:key, ...(extra || {}) };
  if(key.startsWith('eyJ')) headers.Authorization = `Bearer ${key}`;
  return headers;
}

function classParam(){
  const p = new URLSearchParams(location.search).get('class');
  return p || '';
}

function canSubmit(){
  const key = window.CHARLIE_CONFIG.supabasePublishableKey || '';
  return key && !key.includes('__배포_전_주입__');
}

function postGameResult(choices, comment=''){
  choices={...choices,presentation_version:'v9.2'};
  if(!canSubmit()){
    console.info('[Supabase] publishable key 미주입 — 개발 모드에서 전송 생략', choices);
    return Promise.resolve({ok:false,skipped:true});
  }
  const body = {
    class: classParam(),
    game: window.GAME_CONFIG.game_id,
    choices,
    comment,
    timestamp:new Date().toISOString()
  };
  return fetch(`${window.CHARLIE_CONFIG.supabaseUrl}/rest/v1/game_results`,{
    method:'POST',
    headers:publicHeaders({'Content-Type':'application/json','Prefer':'return=minimal'}),
    body:JSON.stringify(body)
  }).then(res=>{
    if(!res.ok) console.warn(`[Supabase] 전송 실패 HTTP ${res.status}`);
    return res;
  }).catch(err=>{

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function rangesFor(text, needles){
  const out=[];
  (needles||[]).forEach(needle=>{
    if(!needle) return;
    let from=0;
    while(true){
      const i=text.indexOf(needle,from);
      if(i<0) break;
      out.push([i,i+needle.length]);
      from=i+needle.length;
    }
  });
  return out;
}

function markedText(text,{anchors=[],focus=[],context=[],contextFocus=[]}={}){
  const a=rangesFor(text,anchors), f=rangesFor(text,focus), c=rangesFor(text,context), cf=rangesFor(text,contextFocus);
  const bounds=new Set([0,text.length]);
  [...a,...f,...c,...cf].forEach(([s,e])=>{bounds.add(s);bounds.add(e)});
  const pts=[...bounds].sort((x,y)=>x-y);
  let html='';
  for(let k=0;k<pts.length-1;k++){
    const s=pts[k],e=pts[k+1],mid=(s+e)/2;
    const has=(arr)=>arr.some(([x,y])=>mid>=x&&mid<y);
    const cls=[];
    if(has(a)) cls.push('anchor');
    if(has(f)||has(cf)) cls.push('focus');
    if(has(c)) cls.push('context');
    const piece=esc(text.slice(s,e));
    html+=cls.length?`<span class="${cls.join(' ')}">${piece}</span>`:piece;
  }
  return html.replace(/\n/g,'<br>');
}

function sourceBox(key,label,mark={}){

function evidenceSegments(text){
  const out=[];
  let start=0;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if((ch==='.'||ch==='?'||ch==='!') && (i===text.length-1 || /\s/.test(text[i+1]))){
      out.push(text.slice(start,i+1));
      start=i+1;
      while(start<text.length && /[ \t]/.test(text[start])) start++;
      if(text[start]==='\n'){
        while(start<text.length && text[start]==='\n') start++;
      }
      i=start-1;
    }
  }
  if(start<text.length) out.push(text.slice(start));
  return out.map(s=>s.trim()).filter(Boolean);
}

function getEvidenceTaskState(taskId){
  if(!S.evidenceState[taskId]) S.evidenceState[taskId]={first_choice:null,attempt_count:0,completed:false,last_choice:null,correct_index:null};
  return S.evidenceState[taskId];
}

function evidencePickScreen(taskId){
  const task=EVIDENCE_TASKS[taskId];
  const state=getEvidenceTaskState(taskId);
  const segments=evidenceSegments(SOURCE[task.source]);
  const correctIndex=segments.findIndex(s=>s===task.correct);
  state.correct_index=correctIndex;
  if(correctIndex<0) console.warn('[EVIDENCE_PICK] 정답 문장 불일치',taskId,task.correct);
  let cursor=0;
  const rows=segments.map((sentence,i)=>{
    const sourceIndex=SOURCE[task.source].indexOf(sentence,cursor);
    const between=sourceIndex>=0?SOURCE[task.source].slice(cursor,sourceIndex):'';
    const paragraphStart=between.includes('\n\n');
    if(sourceIndex>=0) cursor=sourceIndex+sentence.length;
    const cls=[paragraphStart?'paragraph-start':'',i===state.last_choice&&!state.completed?'last-wrong':'',i===correctIndex&&state.completed?'resolved':''].filter(Boolean).join(' ');
    let sentenceHtml=esc(sentence);
    if(task.source==='S4' && sentence.startsWith('물산 장려 운동 회사령')) sentenceHtml=sentenceHtml.replace('물산 장려 운동','<strong>물산 장려 운동</strong>');
    return `<button type="button" class="evidence-sentence ${cls}" onclick="pickEvidence('${taskId}',${i})" ${state.completed?'disabled':''}>${sentenceHtml}</button>`;
  }).join('');
  const feedback=state.attempt_count?`<div class="evidence-feedback ${state.completed?'':'retry'}"><strong>${state.completed?'근거 확인':'다시 찾아보기'}</strong>${state.completed?'이 문장이 관계를 직접 말합니다.':'이 문장보다 관계를 직접 말하는 문장을 다시 찾아보세요.'}</div>`:'';
  const relationHtml=state.completed?`<div class="evidence-result">${task.relations.map(id=>relationCard(ITEMS[id].relation,{style:'direct',badge:(id==='P05'||id==='P06')})).join('')}${taskId==='E02_S3_MASS'?'<div class="auto-note">농민 운동 · 자료에 함께 제시됨</div>':''}${taskId==='E03_S3_REPRESSION'?'<div class="result-note">이 선은 치안유지법이 사회주의 운동 탄압에 사용되었다는 관계를 보여줍니다. 치안유지법의 적용 대상이 사회주의에만 한정되었다는 뜻은 아닙니다.</div>':''}</div>`:'';
  return `<div class="eyebrow">${esc(task.scene)}</div><h1 class="sc-title">${esc(task.title)}</h1>
    <div class="paper evidence-paper" data-source-key="${esc(task.source)}">${rows}<span class="source">— ${esc(task.sourceLabel)}</span></div>
    <div class="evidence-question">${esc(task.prompt)}</div>
    <div class="evidence-help">문장 하나를 눌러 확인합니다. 근거를 찾는 활동은 다시 선택할 수 있습니다.</div>
    ${feedback}${relationHtml}
    ${state.completed?`<div class="btnrow"><button class="btn" onclick="continueEvidence('${taskId}')">계속</button></div>`:''}`;
}

function pickEvidence(taskId,index){
  const task=EVIDENCE_TASKS[taskId];
  const state=getEvidenceTaskState(taskId);
  if(state.completed) return;
  const segments=evidenceSegments(SOURCE[task.source]);
  const correctIndex=segments.findIndex(s=>s===task.correct);
  if(state.first_choice===null) state.first_choice=index;
  state.attempt_count+=1;
  state.last_choice=index;
  state.correct_index=correctIndex;
  if(index===correctIndex){
    state.completed=true;
    task.relations.forEach(id=>{S.mapState[id]='direct';});
  }
  render();
  if(state.completed && taskId==='E02_S3_MASS' && !S.scopeBadgeIntroSeen) setTimeout(showScopeIntro,50);
}

function continueEvidence(taskId){
  const state=getEvidenceTaskState(taskId);
  if(!state.completed) return;
  S.feedback=null;
  S.scopeExpanded=false;
  S.screen=EVIDENCE_TASKS[taskId].next;
  if(ITEMS[S.screen]&&STRENGTH_JUDGMENTS.includes(S.screen)) S.currentId=S.screen;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

    }
  }else{
    extras+=relationCard(item.relation,{noLine:true});

  return `<div class="feedback"><div class="feedback-title">${esc(f.title)}</div><p>${esc(f.text)}</p></div>${extras}<div class="btnrow"><button class="btn" onclick="continueJudgment('${id}')">계속</button></div>`;
}

function copyAnswer(){
  const text=S.finalExplanation;
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('내 답을 복사했습니다.')).catch(()=>fallbackCopy(text));}
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('내 답을 복사했습니다.');
}

function go(screen){S.screen=screen;S.feedback=null;S.scopeExpanded=false;if(ITEMS[screen]&&STRENGTH_JUDGMENTS.includes(screen))S.currentId=screen;render();window.scrollTo({top:0,behavior:'smooth'});}

function render(){
  v91MapPrepare();
  hideTooltip();

  document.body.classList.remove('v8-s2-mode');
  const app=document.getElementById('app');
  if(v9IsLateScreen()){
    app.innerHTML=v9LateRender();
    if(S.screen==='finalPrompt') app.querySelectorAll('.v91-final-side, #finalForm, .v91-final-scroll').forEach(n=>n.scrollTop=0);
    applyTooltips(app);
    v9KeepEvidenceVisible(app);
    return;
  }
  let html='';
  if(S.screen==='s1') html=renderS1();
  else if(EVIDENCE_TASKS[S.screen]) html=evidencePickScreen(S.screen);
  else if(ITEMS[S.screen] && STRENGTH_JUDGMENTS.includes(S.screen)) html=judgmentScreen(S.screen);
  else if(S.screen==='foldS3') html=foldS3();
  else if(S.screen==='foldS4') html=foldS4();
  else if(S.screen==='s5Discover') html=s5Discover();
  else if(S.screen==='s5Reveal') html=s5Reveal();
  else if(S.screen==='foldS5') html=foldS5();
  else if(S.screen==='s6Reading') html=s6Reading();
  else if(S.screen==='foldS6') html=foldS6();
  else if(S.screen==='s7A') html=s7A();
  else if(S.screen==='s7B') html=s7B();
  else if(S.screen==='finalPrompt') html=finalPrompt();
  else if(S.screen==='done') html=doneScreen();
  if(S.screen==='E05_S5_PRIORITY'||S.screen==='E06_S5_UNITY') html=v7S5Evidence(S.screen);
  else if(S.screen==='R11C') html=v7S5Judgment();
  else if(S.screen==='s7B') html=v7Finale();
  else if(v7SceneKey(S.screen)==='S5') html=`<section class="v8-s5-follow"><div class="v8-workbench">${html}</div></section>`;
  else if(v7SceneKey(S.screen)==='S7') html=`<section class="v8-board-follow"><div class="v8-workbench">${html}</div></section>`;
  else html=v7Present(html,S.screen);
  app.innerHTML=html;
  applyTooltips(app);
  if(['S3','S4'].includes(v7SceneKey(S.screen))) v9KeepEvidenceVisible(app);
}
